      // function itself gives up at 140s, so the client waits a little longer.
      const callDrills = (body) => callEdgeFunction('drills', body, 155000);

      const patchDrill = async (id, patch, { quiet = false } = {}) => {
        let before;
        setDrills((prev) => {
          before = prev.find((d) => d.id === id);
          return prev.map((d) => (d.id === id ? { ...d, ...patch } : d));
        });
        const { error } = await runSb(() => sb.from('drills').update(patch).eq('id', id));
        if (error) {
          // Autosaves stay quiet and keep the local copy; the next save retries.
          if (!quiet) {
            if (before) setDrills((prev) => prev.map((d) => (d.id === id ? before : d)));
            notify('Failed to save drill: ' + humaniseSbError(error), 'error');
          } else {
            console.warn('[drills] autosave failed', error);
          }
          return false;
        }
        return true;
      };

      const startDrill = async ({ kind, difficulty, focus, catalogItem }) => {
        if (drillGen) return;
        let exercise;
        if (catalogItem) {
          exercise = { ...catalogItem, kind: 'system_design', difficulty, topic: catalogItem.tags[0] || '', source: 'catalog' };
        } else {
          setDrillGen({ kind, startedAt: Date.now() });
          // Recent titles of the same kind so the model doesn't hand back a near-duplicate.
          const avoid = drills.filter((d) => d.kind === kind).slice(0, 20).map((d) => d.title);
          const data = await callDrills({ action: 'generate', kind, difficulty, focus, avoid });
          setDrillGen(null);
          if (!data || !data.exercise) {
            notify('Couldn\'t generate a drill. Check that the drills function is deployed, then try again.', 'error');
            return;
          }
          exercise = data.exercise;
        }
        const row = {
          id: `d_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          user_id: user.id,
          kind,
          title: exercise.title || DRILL_KINDS[kind].label,
          topic: exercise.topic || focus || null,
          difficulty,
          exercise,
          response: {},
          followups: null,
          grade: null,
          score: null,
          status: 'in_progress',
          duration_sec: 0,
          submitted_at: null,
          created_at: new Date().toISOString(),
        };
        setDrills((prev) => [row, ...prev]);
        setOpenDrillId(row.id);
        const { error } = await runSb(() => sb.from('drills').insert(row));
        if (error) {
          setDrills((prev) => prev.filter((d) => d.id !== row.id));
          setOpenDrillId(null);
          notify('Failed to save drill: ' + humaniseSbError(error), 'error');
        }
      };

      const requestFollowups = async (drill, response) => {
        const data = await callDrills({ action: 'followups', kind: drill.kind, exercise: drill.exercise, response });
        return Array.isArray(data?.questions) && data.questions.length ? data.questions : null;
      };

      // Submit locks the attempt (status → submitted) before grading, so a
      // grader failure still leaves a finished attempt whose answer key the
      // user can check by hand, with a retry button.
      const gradeDrill = async (id, fields) => {
        const drill = drills.find((d) => d.id === id);
        if (!drill || gradingIds.has(id)) return;
        const submitted = {
          ...fields,
          status: drill.status === 'graded' ? 'graded' : 'submitted',
          submitted_at: drill.submitted_at || new Date().toISOString(),
        };
        await patchDrill(id, submitted, { quiet: true });
        setGradingIds((s) => new Set(s).add(id));
        const merged = { ...drill, ...submitted };
        const data = await callDrills({
          action: 'grade',
          kind: merged.kind,
          exercise: merged.exercise,
          response: merged.response,
          followups: merged.followups,
          duration_sec: merged.duration_sec,
        });
        setGradingIds((s) => { const n = new Set(s); n.delete(id); return n; });
        if (!data || !data.grade) {
          notify('Grading didn\'t come back. The answer key is revealed, and you can retry grading.', 'error');
          return;
        }
        const ok = await patchDrill(id, { grade: data.grade, score: data.grade.score, status: 'graded' });
        if (ok) notify(`Graded: ${data.grade.score} / 100 · ${data.grade.verdict}`, 'success');
      };

      const deleteDrill = async (id) => {
        let gone;
        setDrills((prev) => { gone = prev.find((d) => d.id === id); return prev.filter((d) => d.id !== id); });
        if (openDrillId === id) setOpenDrillId(null);
        const { error } = await runSb(() => sb.from('drills').delete().eq('id', id));
        if (error) {
          if (gone) setDrills((prev) => [gone, ...prev]);
          notify('Failed to delete: ' + humaniseSbError(error), 'error');
        } else {
          notify('Drill removed', 'success');
        }
      };

      // Hands the grader's feedback to Notes, where Generate cards turns each
      // paragraph into a flashcard. The drill itself never gets scheduled; the
      // lessons can.
      const saveDrillLessons = async (drill) => {
        const body = drillLessonsBody(drill);
        if (!body) { notify('Nothing to save yet. Grade the drill first.', 'error'); return; }
        const note = await addNote({
          title: `${drill.title}: lessons`,
          topic: DRILL_KINDS[drill.kind].label,
          body,
        });
        if (note) { setView('notes'); notify('Lessons saved to Notes. Hit Generate cards to quiz yourself.', 'success'); }
      };
      // -----------------------------------------------------------------

      const addProblem = async (data) => {
        const newProblem = {
          id: `p_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          user_id: user.id,
          name: data.name.trim(),
          pattern: data.pattern.trim(),
          url: data.url.trim() || null,
          solution: data.solution.trim() || null,
          notes: data.notes.trim() || null,
          solution_saved_at: data.solution.trim() ? todayStr() : null,
          history: [{ date: todayStr(), rating: data.rating }],
          next_review: addDays(todayStr(), RATING_INTERVALS[data.rating]),
          created_at: todayStr(),
        };
        const prev = problems;
        setProblems([...problems, newProblem]);
        const { error } = await runSb(() => sb.from('problems').insert(newProblem));
        if (error) { setProblems(prev); notify('Failed to save: ' + humaniseSbError(error), 'error'); return; }
        notify(`${newProblem.name} added · back in ${RATING_INTERVALS[data.rating]}d`, 'success');

        // Optional companion note pre-linked to the problem — the touchpoint the
        // journey map calls out as the Add→Notes bridge.
        if (data.startNote) {
          const note = await addNote({
            title: newProblem.name,
            topic: newProblem.pattern,
            body: newProblem.notes || '',
            problem_id: newProblem.id,
          });
          if (note) { setView('notes'); return; }
        }
        setView('today');
      };

      const rateProblem = async (id, rating) => {
        const problem = problems.find((p) => p.id === id);
        if (!problem) return;
        const newHistory = [...problem.history, { date: todayStr(), rating }];
        const newNextReview = addDays(todayStr(), RATING_INTERVALS[rating]);
        const prev = problems;
        setProblems(problems.map((p) =>
          p.id === id ? { ...p, history: newHistory, next_review: newNextReview } : p
        ));
        const { error } = await runSb(() => sb.from('problems')
          .update({ history: newHistory, next_review: newNextReview })
          .eq('id', id));
        if (error) { setProblems(prev); notify('Failed to save: ' + humaniseSbError(error), 'error'); }
        else notify(`Next review in ${RATING_INTERVALS[rating]} days`, 'success');
      };

      // Saves the card fields (solution / notes / url). Kept separate from rateProblem so
      // editing a card never disturbs the review schedule.
      const saveCard = async (id, fields) => {
        const patch = {
          url: fields.url.trim() || null,
          solution: fields.solution.trim() || null,
          notes: fields.notes.trim() || null,
        };
        const current = problems.find((p) => p.id === id);
        if (patch.solution && patch.solution !== current?.solution) {
          patch.solution_saved_at = todayStr();
        }
        const prev = problems;
        setProblems(problems.map((p) => (p.id === id ? { ...p, ...patch } : p)));
        const { error } = await runSb(() => sb.from('problems').update(patch).eq('id', id));
        if (error) { setProblems(prev); notify('Failed to save: ' + humaniseSbError(error), 'error'); }
        else notify('Card saved', 'success');
      };

      const deleteProblem = async (id) => {
        const gone = problems.find((p) => p.id === id);
        const prev = problems;
        setProblems(problems.filter((p) => p.id !== id));
        const { error } = await runSb(() => sb.from('problems').delete().eq('id', id));
        if (error) { setProblems(prev); notify('Failed to delete: ' + humaniseSbError(error), 'error'); }
        else notify(`${gone ? gone.name : 'Problem'} removed`, 'success');
      };

      const signOut = async () => { await sb.auth.signOut(); };

      const today = todayStr();
      const dueToday = problems
        .filter((p) => p.next_review <= today)
        .sort((a, b) => a.next_review.localeCompare(b.next_review));
      const dueCards = cards
        .filter((c) => c.next_review <= today)
        .sort((a, b) => a.next_review.localeCompare(b.next_review));
      const stats = {
        total: problems.length,
        due: dueToday.length,
        notesTotal: notes.length,
        cardsTotal: cards.length,
        cardsDue: dueCards.length,
        drillsTotal: drills.length,
        drillsAvg: (() => {
          const scored = drills.filter((d) => typeof d.score === 'number');
          return scored.length ? Math.round(scored.reduce((a, d) => a + d.score, 0) / scored.length) : null;
        })(),
      };

      const activeIndex = TABS.findIndex((t) => t.key === view);

      const hero = (
        <div>
          <div className="eyebrow" style={{ marginBottom: 12 }}>Today</div>
          <div className="flex items-end gap-3.5" style={{ flexWrap: 'wrap' }}>
            <span className="hero-num" data-due={stats.due > 0}>{stats.due}</span>
            <div style={{ paddingBottom: 4 }}>
              <div style={{ color: 'var(--muted)', fontSize: 15, lineHeight: 1.3 }}>
                {stats.due === 1 ? 'problem' : 'problems'} to review
              </div>
              {stats.due === 0 && stats.total > 0 && stats.cardsDue === 0 && (
                <span className="pill pill-success" style={{ marginTop: 7 }}>
                  <IconCheck size={11} /> all clear
                </span>
              )}
              {stats.cardsDue > 0 && (
                <button onClick={() => goTo('notes')} className="pill pill-accent"
                  style={{ marginTop: 7, cursor: 'pointer', border: 'none' }}>
                  <IconBolt size={11} /> {stats.cardsDue} flashcard{stats.cardsDue === 1 ? '' : 's'} due
                </button>
              )}
            </div>
          </div>
        </div>
      );

      const startLogging = (prob) => {
        setAddPrefill({
          name: prob.name,
          pattern: (prob.patterns && prob.patterns[0]) || '',
          url: leetcodeUrlFor(prob.name),
        });
        setView('add');
      };

      const goTo = (next) => {
        if (next !== 'add') setAddPrefill(null);
        setView(next);
      };

      const views = (
        <div className="view-area">
          {view === 'today' && (
            <TodayView due={dueToday} onRate={rateProblem} onSaveCard={saveCard}
              hasProblems={problems.length > 0} onGoAdd={() => goTo('add')}
              onGoDiscover={() => goTo('discover')} />
          )}
          {view === 'discover' && (
            <DiscoverView problems={problems} skips={skips}
              aiSuggest={aiSuggest}
              onLoadAi={loadAiSuggestions}
              onLog={startLogging} onSkip={skipSuggestion} onResetSkips={resetSkips} />
          )}
          {view === 'notes' && (
            <NotesView
              notes={notes} cards={cards} problems={problems} today={today}
              selectedId={selectedNoteId} onSelect={setSelectedNoteId}
              onNewNote={() => addNote({ title: 'Untitled', topic: '', body: '' })}
              onSaveNote={saveNote} onDeleteNote={deleteNote}
              onGenerateCards={generateCards}
              onAddCard={addManualCard}
              onRateCard={rateCard} onDeleteCard={deleteCard}
            />
          )}
          {view === 'drills' && (
            <DrillsView
              drills={drills} openId={openDrillId} onOpen={setOpenDrillId}
              generating={drillGen} gradingIds={gradingIds}
              onStart={startDrill} onPatch={patchDrill} onGrade={gradeDrill}
              onRequestFollowups={requestFollowups}
              onDelete={deleteDrill} onSaveLessons={saveDrillLessons}
            />
          )}
          {view === 'add' && (
            <AddView onAdd={addProblem} prefill={addPrefill} onConsumePrefill={() => setAddPrefill(null)} />
          )}
          {view === 'all' && (
            <AllView problems={problems} onDelete={deleteProblem} onSaveCard={saveCard} />
          )}
        </div>
      );

      const errorBlock = (
        <div className="panel anim-fade" style={{ padding: 16, maxWidth: 520, borderColor: 'var(--danger)', background: 'var(--danger-soft)' }}>
          <div className="flex items-start gap-2" style={{ marginBottom: 12 }}>
            <IconAlert size={15} style={{ color: 'var(--danger)', marginTop: 1 }} />
            <div style={{ color: 'var(--danger)', fontSize: 13, lineHeight: 1.5 }}>
              Couldn't load your problems: {error}
            </div>
          </div>
          <button onClick={fetchProblems} className="btn btn-primary btn-sm">Retry</button>
        </div>
      );

      // Desktop: the rail owns identity, the counter and navigation, so the whole
      // content column is free for problems.
      if (isWide) {
        const head = VIEW_HEADINGS[view];
        return (
          <div className="layout">
            <aside className="rail">
              <Wordmark />
              {loading ? <RailHeroSkeleton /> : hero}
              <nav className="rail-nav" aria-label="Views">
                {TABS.map((tab) => {
                  const count = tab.key === 'today' ? stats.due : tab.key === 'all' ? stats.total : null;
                  return (
                    <button key={tab.key} onClick={() => goTo(tab.key)} className="rail-nav-btn"
                      aria-current={view === tab.key ? 'page' : undefined}>
                      <tab.Icon size={15} />
                      {tab.label}
                      {count !== null && (
                        <span className="rail-nav-count" data-due={tab.key === 'today' && count > 0}>{count}</span>
                      )}
                    </button>
                  );
                })}
              </nav>
              <div className="rail-foot">
                <div className="rail-user">
                  <span className="avatar">{(user.email || '?').charAt(0)}</span>
                  <span className="truncate" style={{ fontSize: 12, color: 'var(--muted)' }}>{user.email}</span>
                </div>
                <div className="flex items-center gap-2">
                  <ThemeToggle theme={theme} onToggle={onToggleTheme} />
                  <button onClick={signOut} className="btn btn-ghost btn-sm" style={{ flex: 1 }}>
                    <IconSignOut size={14} /> Sign out
                  </button>
                </div>
              </div>
            </aside>

            <div className="main">
              <main className="content page-pad">
                {loading ? <LoadingState wide /> : error ? errorBlock : (
                  <>
                    <div className="view-head anim-rise">
                      <h1 className="view-title">{head.title}</h1>
                      <p className="view-sub">{head.sub(stats)}</p>
                    </div>
                    {views}
                  </>
                )}
              </main>
            </div>

            <ToastLayer toasts={toasts} onDismiss={dismiss} />
          </div>
        );
      }

      return (
        <div className="shell">
          <header className="app-header" data-scrolled={scrolled}>
            <div className="content app-header-inner">
              <Wordmark />
              <div className="flex items-center gap-2" style={{ position: 'relative' }} ref={menuRef}>
                <span className="pill mono tnum" style={{ fontSize: 10.5 }}>{stats.total} tracked</span>
                <ThemeToggle theme={theme} onToggle={onToggleTheme} />
                <button onClick={() => setMenuOpen(!menuOpen)} className="icon-btn"
                  aria-label="Account menu" aria-haspopup="menu" aria-expanded={menuOpen}>
                  <IconMore size={16} />
                </button>
                {menuOpen && (
                  <div className="menu" role="menu">
                    <div className="menu-head flex items-center gap-2.5">
                      <span className="avatar">{(user.email || '?').charAt(0)}</span>
                      <span className="truncate" style={{ fontSize: 12, color: 'var(--muted)' }}>{user.email}</span>
                    </div>
                    <button onClick={() => { setMenuOpen(false); signOut(); }} className="menu-item" role="menuitem">
                      <IconSignOut size={15} style={{ color: 'var(--muted)' }} />
                      Sign out
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          <main className="content page-pad">
            {loading ? <LoadingState /> : error ? errorBlock : (
              <>
                <section className="anim-rise" style={{ marginBottom: 26 }}>{hero}</section>

                <div className="seg anim-rise" role="tablist" aria-label="Views" style={{ marginBottom: 22, animationDelay: '40ms' }}>
                  <div className="seg-thumb" style={{
                    width: `calc((100% - 8px) / ${TABS.length})`,
                    transform: `translateX(${Math.max(activeIndex, 0) * 100}%)`,
                  }} />
                  {TABS.map((tab) => (
                    <button key={tab.key} onClick={() => goTo(tab.key)} className="seg-btn"
                      role="tab" aria-selected={view === tab.key}>
                      {tab.label}
                    </button>
                  ))}
                </div>

                {views}
              </>
            )}
          </main>

          <ToastLayer toasts={toasts} onDismiss={dismiss} />
        </div>
      );
    }

    // Skeletons in the shape of the real content, so the first paint after load is a
    // refinement of what is already on screen rather than a jump from a text label.
    function LoadingState({ wide }) {
      const cards = wide ? [0, 1, 2, 3, 4, 5] : [0, 1, 2];
      return (
        <div className="anim-fade view-area" aria-busy="true" aria-label="Loading problems">
          {wide ? (
            <div className="view-head">
              <div className="sk" style={{ width: 176, height: 28, borderRadius: 8, marginBottom: 10 }} />
              <div className="sk" style={{ width: 280, height: 12 }} />
            </div>
          ) : (
            <>
              <div style={{ marginBottom: 26 }}>
                <div className="sk" style={{ width: 54, height: 10, marginBottom: 14 }} />
                <div className="sk" style={{ width: 168, height: 58, borderRadius: 10 }} />
              </div>
              <div className="sk" style={{ width: '100%', height: 46, borderRadius: 14, marginBottom: 22 }} />
            </>
          )}
          <div className="grid-review">
            {cards.map((i) => (
              <div key={i} className="card" style={{ padding: 20 }}>
                <div className="sk" style={{ width: `${58 + (i % 3) * 11}%`, height: 15, marginBottom: 12 }} />
                <div className="flex gap-2" style={{ marginBottom: 18 }}>
                  <div className="sk" style={{ width: 74, height: 18, borderRadius: 999 }} />
                  <div className="sk" style={{ width: 58, height: 18, borderRadius: 999 }} />
                </div>
                <div className="sk" style={{ width: '100%', height: 74, borderRadius: 10 }} />
              </div>
            ))}
          </div>
        </div>
      );
    }

    function RailHeroSkeleton() {
      return (
        <div aria-hidden="true">
          <div className="sk" style={{ width: 46, height: 10, marginBottom: 14 }} />
          <div className="sk" style={{ width: 132, height: 50, borderRadius: 10 }} />
        </div>
      );
    }

    function TodayView({ due, onRate, onSaveCard, hasProblems, onGoAdd, onGoDiscover }) {
      if (!hasProblems) return (
        <EmptyState icon={<IconSparkle size={22} />} title="Nothing tracked yet"
          body="Add the first problem you've solved recently. Rate it honestly — that rating sets when you'll see it again."
          cta="Add a problem" onCta={onGoAdd} />
      );
      if (due.length === 0) return (
        <EmptyState icon={<IconInbox size={22} />} title="Clear queue"
          body="No reviews due today. Try something new from Discover, or add a problem you just solved."
          cta="Discover problems" onCta={onGoDiscover} ctaIcon={<IconCompass size={14} />} />
      );
      return (
        <div className="grid-review">
          {due.map((p, i) => (
            <ReviewCard key={p.id} problem={p} index={i} onRate={onRate} onSaveCard={onSaveCard} />
          ))}
        </div>
      );
    }

    function ProblemLink({ problem }) {
      const href = problemUrl(problem);
      if (!href) return null;
      return (
        <a href={href} target="_blank" rel="noopener noreferrer" className="link"
          onClick={(e) => e.stopPropagation()}>
          <IconExternal size={11} /> open
        </a>
      );
    }

    function Field({ label, value, onChange, placeholder, mono, rows, inset }) {
      return (
        <div>
          <label className="field-label">{label}</label>
          <textarea value={value} onChange={(e) => onChange(e.target.value)}
            placeholder={placeholder} rows={rows}
            className={`field ${inset ? 'field-inset' : ''} ${mono ? 'mono' : ''}`} />
        </div>
      );
    }

    function LinkField({ value, onChange, placeholder, inset }) {
      return (
        <div>
          <label className="field-label">Problem link</label>
          <input type="url" value={value} onChange={(e) => onChange(e.target.value)}
            placeholder={placeholder} inputMode="url"
            className={`field ${inset ? 'field-inset' : ''}`} style={{ fontSize: 12.5 }} />
          <div className="field-hint">Leave blank to use the LeetCode link guessed from the name.</div>
        </div>
      );
    }

    // Edit form for the three card fields. Used from both the review flow and the library.
    function CardForm({ problem, onSave, onCancel }) {
      const [solution, setSolution] = useState(problem.solution || '');
      const [notes, setNotes] = useState(problem.notes || '');
      const [url, setUrl] = useState(problem.url || '');

      const save = () => { onSave(problem.id, { solution, notes, url }); onCancel(); };

      return (
        <div className="stack-3 anim-fade">
          <Field label="My solution" value={solution} onChange={setSolution} mono rows={10} inset
            placeholder="Paste the solution you actually wrote." />
          <Field label="My notes" value={notes} onChange={setNotes} rows={3} inset
            placeholder="The insight, the edge case you missed, why it works." />
          <LinkField value={url} onChange={setUrl} inset
            placeholder={leetcodeUrlFor(problem.name) || 'https://…'} />
          <div className="flex gap-2">
            <button onClick={save} className="btn btn-primary btn-sm">
              <IconCheck size={13} /> Save card
            </button>
            <button onClick={onCancel} className="btn btn-ghost btn-sm">Cancel</button>
          </div>
        </div>
      );
    }

    // Read view of a card, with an edit toggle. This is the "back" of the flashcard.
    function CardPanel({ problem, onSave }) {
      const [editing, setEditing] = useState(false);

      if (editing) {
        return <CardForm problem={problem} onSave={onSave} onCancel={() => setEditing(false)} />;
      }

      // Stay compact when there is nothing saved. Opening the full form here would push
      // the rating buttons off screen for anyone who just wants to rate and move on.
      if (!hasCard(problem)) {
        return (
          <div className="inset dashed flex items-center justify-between gap-3" style={{ padding: '12px 13px' }}>
            <span style={{ color: 'var(--muted)', fontSize: 12.5 }}>No solution saved yet.</span>
            <button onClick={() => setEditing(true)} className="btn btn-quiet btn-sm">
              <IconPlus size={13} /> Add solution
            </button>
          </div>
        );
      }

      return (
        <div className="stack-3 anim-fade">
          {problem.solution && (
            <div>
              <div className="flex items-baseline justify-between gap-3" style={{ marginBottom: 7 }}>
                <span className="field-label" style={{ margin: 0 }}>My solution</span>
                {problem.solution_saved_at && (
                  <span className="mono tnum" style={{ color: 'var(--faint)', fontSize: 10 }}>
                    saved {problem.solution_saved_at}
                  </span>
                )}
              </div>
              <pre className="code">{problem.solution}</pre>
            </div>
          )}
          {problem.notes && (
            <div>
              <span className="field-label">My notes</span>
              <div style={{ color: 'var(--text)', fontSize: 13.5, lineHeight: 1.65, whiteSpace: 'pre-wrap' }}>
                {problem.notes}
              </div>
            </div>
          )}
          <button onClick={() => setEditing(true)} className="btn btn-ghost btn-sm">
            <IconPencil size={12} /> Edit card
          </button>
        </div>
      );
    }

    function ReviewCard({ problem, index, onRate, onSaveCard }) {
      const [rating, setRating] = useState(null);
      const [revealed, setRevealed] = useState(false);
      const [leaving, setLeaving] = useState(false);
      const slotRef = useRef(null);
      // Nothing saved yet means there is nothing to recall against, so go straight to
      // rating rather than dead-ending behind a reveal button that shows an empty card.
      const showRating = revealed || !hasCard(problem);
      const lastReview = problem.history[problem.history.length - 1];
      const daysSince = daysBetween(lastReview.date, todayStr());
      const daysOverdue = daysBetween(problem.next_review, todayStr());

      // Collapse the row out of the list rather than letting it vanish and snap the
      // remaining cards upward. Height is locked to the measured value first so the
      // transition to 0 has something to animate from.
      const handleRate = (r) => {
        if (rating !== null) return;
        setRating(r);
        const el = slotRef.current;
        if (el) el.style.maxHeight = `${el.scrollHeight}px`;
        requestAnimationFrame(() => requestAnimationFrame(() => setLeaving(true)));
        setTimeout(() => onRate(problem.id, r), 360);
      };

      return (
        <div className="review-slot" ref={slotRef} data-leaving={leaving}>
          <div className="card anim-rise" style={{ padding: 20, animationDelay: `${Math.min(index, 6) * 55}ms` }}>
            <div className="mono" style={{ fontSize: 15, fontWeight: 600, lineHeight: 1.4, wordBreak: 'break-word', marginBottom: 10 }}>
              {problem.name}
            </div>
            <div className="flex items-center flex-wrap gap-x-2.5 gap-y-1.5" style={{ marginBottom: 16 }}>
              <span className="pill">{problem.pattern}</span>
              <span style={{ color: 'var(--muted)', fontSize: 11.5 }}>
                last {daysSince === 0 ? 'today' : `${daysSince}d ago`}
              </span>
              {daysOverdue > 0 && <span className="pill pill-accent">{daysOverdue}d overdue</span>}
              <ProblemLink problem={problem} />
            </div>

            <div style={{ marginBottom: 16 }}>
              {showRating ? (
                <CardPanel problem={problem} onSave={onSaveCard} />
              ) : (
                <div className="inset card-back anim-fade" style={{ padding: 22, textAlign: 'center' }}>
                  <div style={{ color: 'var(--muted)', fontSize: 12.5, marginBottom: 14 }}>
                    Try to recall it first.
                  </div>
                  <button onClick={() => setRevealed(true)} className="btn btn-primary">
                    <IconEye size={15} /> Reveal solution
                  </button>
                </div>
              )}
            </div>

            {showRating && (
              <div className="anim-fade">
                <div className="eyebrow" style={{ marginBottom: 10 }}>How did it go?</div>
                <div className="grid grid-cols-2 gap-2">
                  {[4, 3, 2, 1].map((r) => (
                    <RatingButton key={r} rating={r} selected={rating === r} onClick={() => handleRate(r)} />
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function RatingButton({ rating, selected, onClick }) {
      const label = RATING_LABELS[rating];
      const days = RATING_INTERVALS[rating];
      const dotVar = {
        4: 'var(--dot-struggle)', 3: 'var(--accent)', 2: 'var(--dot-solid)', 1: 'var(--success)',
      }[rating];

      return (
        <button onClick={onClick} className="rating" aria-pressed={selected}>
          <span className="flex items-center gap-1.5" style={{ marginBottom: 5 }}>
            <span className="dot" style={{ background: dotVar }} />
            <span className="rating-label">{label}</span>
          </span>
          <span className="rating-days">→ in {days}d</span>
        </button>
      );
    }

    // ============================================================
    // Personalization engine
    //
    // The Discover view isn't a catalog browser — it's a coach. It reads your solved
    // history (with the ratings you gave), builds a per-pattern mastery picture, and
    // then produces a small, opinionated set of "do this next" picks grouped into
    // categories. Interview frequency (frequencyOf) is weighted heavily so what you
    // see leans toward what interviewers actually ask.
    //
    // Everything below is pure — analyseHistory + personalisedPicks take the catalog
    // and your problems array and return plain data. Easy to reason about in the
    // console, and easy to reshape as we tune the heuristics.
    // ============================================================

    // Per-pattern signal from the user's tracked problems.
    //   count               how many problems in this pattern the user has logged
    //   avgRating           mean of the LATEST rating on each; lower is stronger
    //   strongCount         # rated Trivial or Solid on latest attempt
    //   struggling          latest logged rating in this pattern was Struggled hard (4)
    //   maxDifficultyStrong hardest difficulty (rank) they've cleared with rating ≤ 2
    function analyseHistory(catalog, userProblems) {
      const catBySlug = new Map(catalog.map((c) => [slugify(c.name), c]));
      const solvedSlugs = new Set();
      const solvedByPattern = new Map();
      const difficultyCleared = { Easy: 0, Medium: 0, Hard: 0 };

      for (const p of userProblems) {
        const slug = slugify(p.name);
        solvedSlugs.add(slug);
        const pattern = (p.pattern || '').trim();
        const latest = p.history[p.history.length - 1];
        const rating = latest ? latest.rating : 4;
        const cat = catBySlug.get(slug);

        if (pattern) {
          if (!solvedByPattern.has(pattern)) solvedByPattern.set(pattern, []);
          solvedByPattern.get(pattern).push({ name: p.name, rating, catalog: cat });
        }
        if (cat && rating <= 2) difficultyCleared[cat.difficulty]++;
      }

      const patternStats = new Map();
      for (const [pat, solved] of solvedByPattern) {
        const count = solved.length;
        const avgRating = solved.reduce((s, x) => s + x.rating, 0) / count;
        const strongCount = solved.filter((x) => x.rating <= 2).length;
        const struggling = solved[solved.length - 1].rating === 4;
        const maxDifficultyStrong = solved
          .filter((x) => x.rating <= 2 && x.catalog)
          .reduce((max, x) => Math.max(max, DIFFICULTY_RANK[x.catalog.difficulty]), 0);
        patternStats.set(pat, { count, avgRating, strongCount, struggling, maxDifficultyStrong });
      }

      return { solvedSlugs, patternStats, difficultyCleared };
    }

    // Sort catalog picks the way a coach would: interview classics first, then within
    // each frequency tier prefer whichever difficulty the caller is aiming at, breaking
    // final ties by name so the ordering is stable across renders.
    const bestPickFor = (candidates, targetRank) => {
      const scored = [...candidates].sort((a, b) => {
        if (b.frequency !== a.frequency) return b.frequency - a.frequency;
        const aDist = Math.abs(DIFFICULTY_RANK[a.difficulty] - targetRank);
        const bDist = Math.abs(DIFFICULTY_RANK[b.difficulty] - targetRank);
        if (aDist !== bDist) return aDist - bDist;
        return a.name.localeCompare(b.name);
      });
      return scored[0] || null;
    };

    // The main recommender. Returns an ordered list of sections, each with a title,
    // subtitle and a small (2-3) list of picks. Every pick carries a `reason` string
    // built from the actual signal that surfaced it.
    // Auto-unskip: a skip is stale once the user has *added a new problem* in one of
    // the skipped item's patterns after the skip was recorded. The earlier version
    // used the last review date on any existing problem, which fired on ordinary
    // spaced-repetition reviews and made skips feel like they weren't sticking —
    // "I keep seeing the same suggestions". Adding a new problem is a clean signal
    // that the user is genuinely working that pattern again; reviewing an existing
    // one is just the schedule doing its job. Returns the slugs that are still
    // actively hiding a suggestion right now.
    function activeSkipSlugs(catalog, userProblems, skips) {
      if (!skips || skips.size === 0) return new Set();
      const patternLatestAdd = new Map();
      for (const p of userProblems) {
        const pattern = (p.pattern || '').trim();
        if (!pattern) continue;
        const added = p.created_at;
        if (!added) continue;
        const prev = patternLatestAdd.get(pattern);
        if (!prev || added > prev) patternLatestAdd.set(pattern, added);
      }
      const active = new Set();
      for (const c of catalog) {
        const slug = slugify(c.name);
        const skippedAt = skips.get(slug);
        if (!skippedAt) continue;
        const skipDate = String(skippedAt).slice(0, 10);
        let stale = false;
        for (const pat of c.patterns) {
          const latest = patternLatestAdd.get(pat);
          if (latest && latest > skipDate) { stale = true; break; }
        }
        if (!stale) active.add(slug);
      }
      return active;
    }

    function personalisedPicks(catalog, userProblems, skips = new Map()) {
      const { solvedSlugs, patternStats, difficultyCleared } = analyseHistory(catalog, userProblems);
      const activeSkips = activeSkipSlugs(catalog, userProblems, skips);
      const eligible = catalog
        .filter((c) => {
          const slug = slugify(c.name);
          return !solvedSlugs.has(slug) && !activeSkips.has(slug);
        })
        .map((c) => ({ ...c, frequency: frequencyOf(c.name) }));

      const sections = [];
      const used = new Set();
      const take = (pick, reason) => {
        if (!pick || used.has(slugify(pick.name))) return null;
        used.add(slugify(pick.name));
        return { ...pick, reason };
      };

      // Cold start — brand new user with nothing logged yet. Bootstrap with the most
      // canonical warm-ups so the first Add they log isn't random.
      if (userProblems.length === 0) {
        const starters = eligible
          .filter((c) => c.frequency === 3 && c.difficulty === 'Easy')
          .sort((a, b) => a.name.localeCompare(b.name))
          .slice(0, 4)
          .map((c) => ({ ...c, reason: 'A canonical interview warm-up — start here.' }));
        if (starters.length) {
          sections.push({
            key: 'start',
            title: 'Start here',
            subtitle: "You haven't logged anything yet. These four are asked in almost every interview loop.",
            picks: starters,
          });
        }
        return sections;
      }

      // Overall difficulty comfort — lets us aim "next" picks at the right level rather
      // than dumping Hards on someone still building fluency in Mediums.
      const totalCleared = difficultyCleared.Easy + difficultyCleared.Medium + difficultyCleared.Hard;
      const comfortRank = totalCleared === 0
        ? 1
        : difficultyCleared.Hard >= 3 ? 3
        : difficultyCleared.Medium >= 3 ? 2
        : 1;

      // 1. Reinforce — most recent attempt in a pattern was Struggled hard. Back off
      //    to something easier in the SAME pattern so the pattern gets re-anchored.
      const strugglingPatterns = [...patternStats.entries()]
        .filter(([, s]) => s.struggling)
        .sort((a, b) => b[1].count - a[1].count)
        .slice(0, 2);
      const reinforcePicks = [];
      for (const [pat, stats] of strugglingPatterns) {
        const target = Math.max(1, stats.maxDifficultyStrong || 1);
        const pool = eligible.filter((c) => c.patterns.includes(pat));
        const chosen = bestPickFor(pool, target);
        if (!chosen) continue;
        const pick = take(chosen,
          `You struggled with a recent ${pat} problem — this ${chosen.difficulty} rebuilds the pattern.`);
        if (pick) reinforcePicks.push(pick);
      }
      if (reinforcePicks.length) sections.push({
        key: 'reinforce',
        title: 'Reinforce',
        subtitle: 'You rated a recent one Struggled hard. Back up and re-anchor the pattern before pushing forward.',
        picks: reinforcePicks,
      });

      // 2. Next up — patterns you're actively building (some solves, not struggling).
      //    Aim one step above the hardest you've cleared with rating ≤ Solid in that
      //    pattern, so the difficulty curve tracks per-pattern skill, not overall.
      const buildingPatterns = [...patternStats.entries()]
        .filter(([, s]) => !s.struggling && s.count >= 1)
        .sort((a, b) => {
          // Patterns you've done the most of first, tie-broken by average strength.
          if (b[1].strongCount !== a[1].strongCount) return b[1].strongCount - a[1].strongCount;
          return a[1].avgRating - b[1].avgRating;
        })
        .slice(0, 3);
      const nextPicks = [];
      for (const [pat, stats] of buildingPatterns) {
        const base = stats.maxDifficultyStrong || 1;
        const target = Math.min(base + (stats.strongCount >= 2 ? 1 : 0), 3);
        const pool = eligible.filter((c) => c.patterns.includes(pat));
        const chosen = bestPickFor(pool, target);
        if (!chosen) continue;
        const pick = take(chosen,
          `Builds on your ${stats.count}× ${pat} — next step at ${chosen.difficulty}.`);
        if (pick) nextPicks.push(pick);
      }
      if (nextPicks.length) sections.push({
        key: 'next',
        title: 'Next up for you',
        subtitle: 'The natural progression from the patterns you\'re actively practicing, tuned to how far you\'ve gone in each.',
        picks: nextPicks,
      });

      // 3. Level up — patterns you've clearly internalised (≥3 solved, strong ratings)
      //    and haven't yet hit the ceiling of. Hand them a Hard in that pattern, but
      //    only if it's interview-relevant (freq ≥ 2 — everything in the catalog is).
      const strongPatterns = [...patternStats.entries()]
        .filter(([, s]) => s.count >= 3 && s.avgRating <= 2 && s.maxDifficultyStrong < 3)
        .sort((a, b) => a[1].avgRating - b[1].avgRating)
        .slice(0, 2);
      const levelPicks = [];
      for (const [pat, stats] of strongPatterns) {
        const target = Math.min(stats.maxDifficultyStrong + 1, 3);
        const pool = eligible
          .filter((c) => c.patterns.includes(pat) && DIFFICULTY_RANK[c.difficulty] === target);
        const pick = take(bestPickFor(pool, target),
          `You're strong in ${pat} (${stats.strongCount} clean solves) — time for a ${DIFFICULTIES[target - 1]}.`);
        if (pick) levelPicks.push(pick);
      }
      if (levelPicks.length) sections.push({
        key: 'level',
        title: 'Level up',
        subtitle: 'Patterns you\'ve been consistent in — push into the next tier.',
        picks: levelPicks,
      });

      // 4. Interview must-haves — high-frequency classics you haven't touched yet.
      //    Prefer those that share a pattern with something you've done, so the pick
      //    isn't just "here's a random Blind 75 problem", it's one you can pattern-
      //    match onto existing skill.
      const canonPool = eligible.filter((c) => c.frequency === 3 && !used.has(slugify(c.name)));
      const canonScored = canonPool.map((c) => {
        const familiar = c.patterns.some((p) => patternStats.has(p)) ? 1 : 0;
        return { c, familiar, distFromComfort: Math.abs(DIFFICULTY_RANK[c.difficulty] - comfortRank) };
      }).sort((a, b) => {
        if (b.familiar !== a.familiar) return b.familiar - a.familiar;
        if (a.distFromComfort !== b.distFromComfort) return a.distFromComfort - b.distFromComfort;
        return a.c.name.localeCompare(b.c.name);
      });
      const canonPicks = [];
      for (const { c } of canonScored) {
        if (canonPicks.length >= 2) break;
        const familiar = c.patterns.filter((p) => patternStats.has(p));
        const reason = familiar.length > 0
          ? `Very frequently asked — pairs with your ${familiar[0]} practice.`
          : 'Very frequently asked in real interviews.';
        const pick = take(c, reason);
        if (pick) canonPicks.push(pick);
      }
      if (canonPicks.length) sections.push({
        key: 'canon',
        title: 'Interview must-haves',
        subtitle: 'Classics that come up in FAANG-tier loops — worth clearing early.',
        picks: canonPicks,
      });

      // 5. Explore — only kicks in once the user has some breadth (≥2 patterns).
      //    Introduces a foundational problem in a pattern they haven't touched, so
      //    growth stays two-dimensional (depth + breadth), not just depth.
      if (patternStats.size >= 2) {
        const touched = new Set(patternStats.keys());
        const untouched = [...new Set(eligible.flatMap((c) => c.patterns))]
          .filter((p) => !touched.has(p));
        const explorePicks = [];
        for (const pat of untouched) {
          if (explorePicks.length >= 2) break;
          const pool = eligible.filter((c) => c.patterns.includes(pat));
          const pick = take(bestPickFor(pool, 1),
            `Introduces ${pat} — a pattern you haven't touched yet.`);
          if (pick) explorePicks.push(pick);
        }
        if (explorePicks.length) sections.push({
          key: 'explore',
          title: 'Explore a new pattern',
          subtitle: "You've got breadth already — this widens it with the easiest way in.",
          picks: explorePicks,
        });
      }

      return sections;
    }

    function DifficultyPill({ level }) {
      const bg = level === 'Easy' ? 'var(--success-soft)'
        : level === 'Medium' ? 'var(--accent-soft)' : 'var(--danger-soft)';
      const fg = level === 'Easy' ? 'var(--success)'
        : level === 'Medium' ? 'var(--accent)' : 'var(--danger)';
      return (
        <span className="pill" style={{
          background: bg, color: fg, borderColor: 'transparent',
          fontWeight: 600, letterSpacing: '0.02em',
        }}>{level}</span>
      );
    }

    function SuggestionCard({ prob, onLog, onSkip, index }) {
      const href = leetcodeUrlFor(prob.name);
      const isAi = prob.source === 'ai';
      return (
        <div className="card anim-rise" style={{ padding: 16, animationDelay: `${Math.min(index, 8) * 30}ms` }}>
          <div className="flex items-start justify-between gap-3" style={{ marginBottom: 10 }}>
            <div className="mono" style={{ fontSize: 14, fontWeight: 600, lineHeight: 1.4, wordBreak: 'break-word' }}>
              {prob.name}
            </div>
            <DifficultyPill level={prob.difficulty} />
          </div>
          <div className="flex items-center flex-wrap gap-x-2 gap-y-1.5" style={{ marginBottom: 10 }}>
            {prob.patterns.map((pat) => (
              <span key={pat} className="pill" style={{ fontSize: 10.5 }}>{pat}</span>
            ))}
            {isAi && (
              <span className="pill pill-accent" style={{ fontSize: 10.5 }}
                title="Suggested by the AI coach based on your history">
                <IconSparkle size={9} /> AI pick
              </span>
            )}
            {!isAi && prob.frequency === 3 && (
              <span className="pill pill-accent" style={{ fontSize: 10.5 }}>
                <IconSparkle size={9} /> {frequencyLabel(prob.frequency)}
              </span>
            )}
            {href && (
              <a href={href} target="_blank" rel="noopener noreferrer" className="link">
                <IconExternal size={11} /> open
              </a>
            )}
          </div>
          {prob.reason && (
            <div style={{
              color: 'var(--muted)', fontSize: 12, lineHeight: 1.55, marginBottom: 12,
              paddingLeft: 10, borderLeft: '2px solid var(--border-strong)',
            }}>
              {prob.reason}
            </div>
          )}
          <div className="flex items-center justify-between gap-2">
            <button onClick={() => onLog(prob)} className="btn btn-quiet btn-sm">
              <IconPlus size={13} /> Log as solved
            </button>
            {onSkip && (
              <button onClick={() => onSkip(prob.name)} className="btn btn-ghost btn-sm"
                aria-label={`Skip ${prob.name}`} title="Not this one — show me another">
                <IconX size={12} /> Skip
              </button>
            )}
          </div>
        </div>
      );
    }

    function DiscoverView({ problems, skips, aiSuggest, onLoadAi, onLog, onSkip, onResetSkips }) {
      const sections = useMemo(
        () => personalisedPicks(PROBLEM_CATALOG, problems, skips),
        [problems, skips]
      );
      // Active = still hiding a card right now. Skips whose patterns the user has
      // since practiced no longer count — they've already been auto-restored.
      const activeSkipCount = useMemo(
        () => activeSkipSlugs(PROBLEM_CATALOG, problems, skips).size,
        [problems, skips]
      );
      const revivedCount = (skips ? skips.size : 0) - activeSkipCount;

      // First visit to Discover with anything logged: try to pull an LLM batch
      // so the "Fresh from AI" section is there when the view first paints,
      // instead of forcing the user to hunt for a button. Cold-start users
      // (nothing logged yet) skip this — the deterministic "Start here"
      // section is the right first impression there.
      useEffect(() => {
        if (aiSuggest.state === 'idle' && problems.length > 0) {
          onLoadAi();
        }
      }, [aiSuggest.state, problems.length, onLoadAi]);

      const aiPicks = aiSuggest.state === 'ready' ? aiSuggest.picks : [];
      const aiSection = (aiPicks.length > 0 || aiSuggest.state === 'loading' || aiSuggest.state === 'error')
        ? { key: 'ai' }
        : null;

      if (!aiSection && sections.length === 0) {
        return (
          <div className="stack-3 anim-rise">
            <EmptyState icon={<IconCompass size={22} />} title="No suggestions right now"
              body={activeSkipCount > 0
                ? "You've hidden everything the engine had. Reset the skip list to bring them back, or log a few more solves to open up new picks."
                : "Either you've cleared the built-in catalog, or the engine can't find a clean next step. Log a few more solves and it'll pick things up."} />
            {activeSkipCount > 0 && (
              <div className="flex justify-center">
                <button onClick={onResetSkips} className="btn btn-ghost btn-sm">
                  Reset {activeSkipCount} skipped
                </button>
              </div>
            )}
          </div>
        );
      }

      const renderAiSection = () => (
        <section key="ai" className="anim-rise">
          <div style={{ marginBottom: 14 }}>
            <div className="flex items-center justify-between gap-3" style={{ marginBottom: 6 }}>
              <div className="eyebrow">Fresh from AI</div>
              <button onClick={() => onLoadAi({ force: true })}
                className="btn btn-ghost btn-sm"
                disabled={aiSuggest.state === 'loading'}
                title="Ask the model for a new batch">
                <IconSparkle size={11} />
                {aiSuggest.state === 'loading' ? 'Thinking…' : 'Refresh'}
              </button>
            </div>
            <div style={{ color: 'var(--muted)', fontSize: 12.5, lineHeight: 1.55, maxWidth: 560 }}>
              Picks drawn from the whole LeetCode catalog by an LLM using your history — a bigger pool than the built-in list, so it stays fresh even after you've cleared it.
            </div>
          </div>
          {aiSuggest.state === 'loading' && aiPicks.length === 0 && (
            <div className="card" style={{ padding: 16, color: 'var(--muted)', fontSize: 13 }}>
              <span className="breathe">Asking the coach for fresh picks…</span>
            </div>
          )}
          {aiSuggest.state === 'error' && (
            <div className="card" style={{ padding: 14, color: 'var(--muted)', fontSize: 12.5, lineHeight: 1.55 }}>
              Couldn't reach the AI coach right now — the picks below are from the built-in engine.
              {' '}
              <button onClick={() => onLoadAi({ force: true })} className="link" style={{ background: 'none', border: 'none', padding: 0 }}>
                Try again
              </button>
            </div>
          )}
          {aiPicks.length > 0 && (
            <div className="grid-review">
              {aiPicks.map((pick, i) => (
                <SuggestionCard key={`ai-${pick.name}`} prob={pick} onLog={onLog} onSkip={onSkip} index={i} />
              ))}
            </div>
          )}
        </section>
      );

      return (
        <div className="anim-rise" style={{ display: 'flex', flexDirection: 'column', gap: 32 }}>
          {aiSection && renderAiSection()}
          {sections.map((section, si) => (
            <section key={section.key} style={{ animationDelay: `${si * 60}ms` }} className="anim-rise">
              <div style={{ marginBottom: 14 }}>
                <div className="eyebrow" style={{ marginBottom: 6 }}>{section.title}</div>
                <div style={{ color: 'var(--muted)', fontSize: 12.5, lineHeight: 1.55, maxWidth: 560 }}>
                  {section.subtitle}
                </div>
              </div>
              <div className="grid-review">
                {section.picks.map((pick, i) => (
                  <SuggestionCard key={pick.name} prob={pick} onLog={onLog} onSkip={onSkip} index={i} />
                ))}
              </div>
            </section>
          ))}

          {(activeSkipCount > 0 || revivedCount > 0) && (
            <div className="flex items-center justify-between gap-3" style={{
              padding: '10px 14px', borderTop: '1px solid var(--border)',
              color: 'var(--faint)', fontSize: 11.5,
            }}>
              <span>
                {activeSkipCount > 0 && (
                  <>{activeSkipCount} {activeSkipCount === 1 ? 'suggestion is' : 'suggestions are'} hidden.</>
                )}
                {revivedCount > 0 && (
                  <> {activeSkipCount > 0 ? ' ' : ''}
                  {revivedCount} auto-restored as {revivedCount === 1 ? 'its pattern' : 'their patterns'} came back into your practice.</>
                )}
              </span>
              {activeSkipCount > 0 && (
                <button onClick={onResetSkips} className="btn btn-ghost btn-sm">
                  Reset skipped
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    function AddView({ onAdd, prefill, onConsumePrefill }) {
      const [name, setName] = useState(prefill?.name || '');
      const [pattern, setPattern] = useState(prefill?.pattern || '');
      const [rating, setRating] = useState(4);
      const [solution, setSolution] = useState('');
      const [notes, setNotes] = useState('');
      const [url, setUrl] = useState(prefill?.url || '');
      const [startNote, setStartNote] = useState(false);
      const canSubmit = name.trim().length > 0 && pattern.trim().length > 0;

      // A prefill can arrive after mount (Discover -> Add) — apply it once and clear the
      // signal so subsequent renders don't clobber user edits or re-fire on re-render.
      useEffect(() => {
        if (!prefill) return;
        setName(prefill.name || '');
        setPattern(prefill.pattern || '');
        setUrl(prefill.url || '');
        onConsumePrefill && onConsumePrefill();
      }, [prefill]);

      const submit = () => {
        if (!canSubmit) return;
        onAdd({ name, pattern, rating, solution, notes, url, startNote });
        setName(''); setPattern(''); setRating(4);
        setSolution(''); setNotes(''); setUrl(''); setStartNote(false);
      };

      return (
        <div className="grid-add anim-rise">
          <div className="stack-5">
          <div>
            <label className="field-label">Problem name</label>
            <input type="text" value={name} onChange={(e) => setName(e.target.value)}
              placeholder="e.g. Two Sum" className="field field-lg mono" autoComplete="off" />
          </div>

          <div>
            <label className="field-label">Pattern</label>
            <input type="text" value={pattern} onChange={(e) => setPattern(e.target.value)}
              placeholder="e.g. Hash Map" className="field field-lg" autoComplete="off"
              style={{ marginBottom: 12 }} />
            <div className="flex flex-wrap gap-1.5">
              {COMMON_PATTERNS.map((p) => (
                <button key={p} onClick={() => setPattern(p)} className="chip" aria-pressed={pattern === p}>
                  {p}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className="field-label">How did it go?</label>
            <div className="grid grid-cols-2 gap-2">
              {[4, 3, 2, 1].map((r) => (
                <RatingButton key={r} rating={r} selected={rating === r} onClick={() => setRating(r)} />
              ))}
            </div>
          </div>
          </div>

          <div className="panel" style={{ padding: 16 }}>
            <div className="flex items-start gap-2" style={{ marginBottom: 14 }}>
              <IconLayers size={14} style={{ color: 'var(--faint)', marginTop: 2 }} />
              <p style={{ color: 'var(--faint)', fontSize: 11.5, lineHeight: 1.6, margin: 0 }}>
                Optional, but this is what you'll be shown when the problem comes back around.
              </p>
            </div>
            <div className="stack-3">
              <Field label="My solution" value={solution} onChange={setSolution} mono rows={8} inset
                placeholder="Paste the solution you actually wrote." />
              <Field label="My notes" value={notes} onChange={setNotes} rows={3} inset
                placeholder="The insight, the edge case you missed, why it works." />
              <LinkField value={url} onChange={setUrl} inset
                placeholder={leetcodeUrlFor(name) || 'https://…'} />
            </div>
          </div>

          <label className="start-note-toggle" data-checked={startNote}>
            <input type="checkbox" checked={startNote} onChange={(e) => setStartNote(e.target.checked)} />
            <span className="start-note-body">
              <span className="start-note-title">
                <IconNotes size={13} /> Start a note for this
              </span>
              <span className="start-note-sub">
                Opens a note pre-linked to the problem. You can jot the insight, then generate flashcards from it later.
              </span>
            </span>
          </label>

          <button onClick={submit} disabled={!canSubmit} className="btn btn-primary btn-lg add-submit">
            <IconPlus size={16} /> Add to tracker
          </button>
        </div>
      );
    }

    function AllView({ problems, onDelete, onSaveCard }) {
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [openId, setOpenId] = useState(null);

      if (problems.length === 0) return (
        <EmptyState icon={<IconLayers size={22} />} title="Empty library"
          body="Once you add problems, they'll live here. You can review the whole set and remove any you no longer want to track." />
      );

      const sorted = [...problems].sort((a, b) => a.next_review.localeCompare(b.next_review));
      // Looked up fresh each render rather than held in state, so saving a card
      // updates the open dialog, and a problem that disappears closes it.
      const openProblem = problems.find((p) => p.id === openId) || null;

      return (
        <>
          <div className="grid-rows">
            {sorted.map((p, i) => {
              const due = dueDescriptor(p);

              return (
                <div key={p.id} className="row anim-rise" data-open={openId === p.id}
                  style={{ padding: 12, animationDelay: `${Math.min(i, 10) * 28}ms` }}>
                  <div className="flex items-center justify-between gap-2">
                    <div className="flex-1 min-w-0">
                      <button onClick={() => setOpenId(p.id)} className="row-toggle"
                        aria-haspopup="dialog">
                        <IconChevron size={13} className="row-chevron" />
                        <span className="mono truncate" style={{ fontSize: 13.5, fontWeight: 600 }}>{p.name}</span>
                      </button>
                      <div style={{ marginTop: 5, paddingLeft: 21 }}>
                        <ProblemMeta problem={p} due={due} />
                      </div>
                    </div>
                    {confirmDelete === p.id ? (
                      <div className="flex gap-1.5 anim-fade" style={{ flex: 'none' }}>
                        <button onClick={() => { onDelete(p.id); setConfirmDelete(null); }} className="btn btn-danger btn-sm">
                          Delete
                        </button>
                        <button onClick={() => setConfirmDelete(null)} className="btn btn-ghost btn-sm">
                          Cancel
                        </button>
                      </div>
                    ) : (
                      <button onClick={() => setConfirmDelete(p.id)} className="row-danger"
                        aria-label={`Delete ${p.name}`}>
                        <IconTrash size={15} />
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {openProblem && (
            <Modal title={openProblem.name} onClose={() => setOpenId(null)}
              meta={<div style={{ marginTop: 7 }}>
                <ProblemMeta problem={openProblem} due={dueDescriptor(openProblem)} />
              </div>}>
              <CardPanel problem={openProblem} onSave={onSaveCard} />
            </Modal>
          )}
        </>
      );
    }

    // Pattern / review count / due state / link. Shared by the library row and the
    // dialog header so the two can never drift apart.
    function ProblemMeta({ problem, due }) {
      return (
        <div className="flex items-center flex-wrap gap-x-2 gap-y-1"
          style={{ fontSize: 11, color: 'var(--muted)' }}>
          <span>{problem.pattern}</span>
          <span style={{ color: 'var(--faint)' }}>·</span>
          <span className="tnum">{problem.history.length}× reviewed</span>
          <span style={{ color: 'var(--faint)' }}>·</span>
          <span style={{ color: due.soon ? 'var(--accent)' : 'var(--muted)', fontWeight: due.soon ? 600 : 400 }}>
            {due.label}
          </span>
          {hasCard(problem) && (
            <span className="pill pill-success" style={{ padding: '1px 7px', fontSize: 10 }}>
              <span className="dot" style={{ background: 'var(--success)', width: 4, height: 4 }} />
              card
            </span>
          )}
          <ProblemLink problem={problem} />
        </div>
      );
    }

    // ============================================================
    // Notes — freeform notes, generated flashcards, per-note quiz
    // ============================================================
    function NotesView({
      notes, cards, problems, today,
      selectedId, onSelect, onNewNote, onSaveNote, onDeleteNote,
      onGenerateCards, onAddCard, onRateCard, onDeleteCard,
    }) {
      const selected = notes.find((n) => n.id === selectedId) || notes[0] || null;
      useEffect(() => {
        if (notes.length > 0 && !notes.some((n) => n.id === selectedId)) onSelect(notes[0].id);
      }, [notes, selectedId]);

      const cardsFor = (id) => cards.filter((c) => c.note_id === id);
      const dueFor = (id) => cardsFor(id).filter((c) => c.next_review <= today).length;

      if (notes.length === 0) {
        return (
          <EmptyState icon={<IconNotes size={22} />} title="No notes yet"

              onDelete={() => onDeleteNote(selected.id)}
              onGenerate={() => onGenerateCards(selected.id)}

    // The right pane. Owns its own draft state so typing in the editor never has to
    // round-trip through the parent on every keystroke; a debounced effect writes
    // back at ~600ms of quiet, matching the existing "silent save" pattern.
    function NoteWorkspace({
      note, cards, problem, today,
      onSave, onDelete, onGenerate, onAddCard, onRateCard, onDeleteCard,
    }) {
      const [title, setTitle] = useState(note.title || '');
      const [topic, setTopic] = useState(note.topic || '');
      const [body, setBody] = useState(note.body || '');
      const [tab, setTab] = useState('write');
      const [confirmDel, setConfirmDel] = useState(false);
      const [savedState, setSavedState] = useState('saved');

      useEffect(() => { setTitle(note.title || ''); setTopic(note.topic || ''); setBody(note.body || ''); }, [note.id]);

      // Refs so the unmount cleanup can flush the latest pending edit without
      // relying on the closure of the mount effect (which sees only the first
      // render's values). NotesView keys this component on selected.id, so an
      // unmount here is either a note switch or leaving the tab — both need
      // any pending debounce to commit before it goes.
      const draftRef = useRef({ title, topic, body });
      const dirtyRef = useRef(false);
      const saveRef = useRef(onSave);
      useEffect(() => { saveRef.current = onSave; }, [onSave]);
      useEffect(() => { draftRef.current = { title, topic, body }; }, [title, topic, body]);

      // Debounce persistence. If any of the three fields changes, wait for quiet
      // and then commit. The saved-state indicator drives the "editing / saved"
      // dot in the editor footer.
      useEffect(() => {
        if (title === (note.title || '') && topic === (note.topic || '') && body === (note.body || '')) {
          dirtyRef.current = false;
          return;
        }
        dirtyRef.current = true;
        setSavedState('editing');
        const h = setTimeout(() => {
          onSave({ title, topic, body });
          dirtyRef.current = false;
          setSavedState('saved');
        }, 600);
        return () => clearTimeout(h);
      }, [title, topic, body]);

      // Flush any pending debounce on real unmount so a fast note-switch (or
      // leaving the Notes tab) never drops the last <600ms of typing.
      useEffect(() => () => {
        if (dirtyRef.current) saveRef.current(draftRef.current);
      }, []);

      const dueCards = cards.filter((c) => c.next_review <= today);

      return (
        <section className="note-workspace">
          <header className="note-head">
            <input value={title} onChange={(e) => setTitle(e.target.value)}
              placeholder="Untitled" className="note-title-input" />

          </header>

            {[
              { k: 'write', label: 'Write', Icon: IconPencil },
              { k: 'cards', label: 'Cards', Icon: IconLayers, count: cards.length },

                  <button onClick={() => setConfirmDel(false)} className="btn btn-ghost btn-sm">Cancel</button>

    function NoteQuizPanel({ cards, dueCards, onRate }) {
      const [reviewAll, setReviewAll] = useState(false);
      // Snapshot the queue at session start so a rating (which pushes the card's
      // next_review out and drops it from `dueCards`) doesn't cause `idx` to
      // skip the very next card. `cards` is still the source of truth for the
      // rendered content — we look each id back up so a mid-session edit or
      // delete is reflected.
      const [queueIds, setQueueIds] = useState(() => dueCards.map((c) => c.id));
      const [idx, setIdx] = useState(0);
      const [revealed, setRevealed] = useState(false);

      useEffect(() => {
        const source = reviewAll ? cards : dueCards;
        setQueueIds(source.map((c) => c.id));
        setIdx(0);
        setRevealed(false);
      }, [reviewAll]);

      // A card in the queue can vanish (user deleted it in the Cards tab).
      // Skip forward instead of rendering nothing.
      const card = idx < queueIds.length ? cards.find((c) => c.id === queueIds[idx]) : null;
      useEffect(() => {
        if (idx < queueIds.length && !card) {
          setIdx((i) => i + 1);
          setRevealed(false);
        }
      }, [card, idx, queueIds.length]);

      if (cards.length === 0) {
        return (
          <div className="inset dashed anim-fade" style={{ padding: 30, textAlign: 'center' }}>
            <p style={{ color: 'var(--muted)', fontSize: 13, margin: 0 }}>
              No cards to review yet. Generate some from the Write tab first.
            </p>
          </div>
        );
      }

      if (queueIds.length === 0 || idx >= queueIds.length) {
        return (
          <div className="card anim-fade" style={{ padding: 32, textAlign: 'center' }}>
            <div className="display" style={{ fontSize: 28, lineHeight: 1.2, marginBottom: 8 }}>Queue clear</div>
            <p style={{ color: 'var(--muted)', fontSize: 13, margin: '0 auto 18px', maxWidth: 40 * 8 }}>

            {!reviewAll && (
              <button onClick={() => setReviewAll(true)} className="btn btn-ghost btn-sm">
                Review all {cards.length} anyway
              </button>
            )}
          </div>
        );
      }

      if (!card) return null; // brief render between the deletion skip and the next tick

      const pct = Math.round((idx / queueIds.length) * 100);

      const handleRate = (r) => {
        onRate(card.id, r);
        setRevealed(false);
        setIdx((i) => i + 1);
      };

      return (
        <div className="quiz-stage anim-fade">
          <div className="quiz-progress">
            <span className="mono">Card {idx + 1} of {queueIds.length}</span>
            <div className="progress-track"><div className="progress-fill" style={{ width: pct + '%' }} /></div>
            <span className="mono">{pct}%</span>
          </div>

          <div className="quiz-card">
            <div className="display quiz-question">{card.front}</div>

              <>
                <div className="quiz-answer">
