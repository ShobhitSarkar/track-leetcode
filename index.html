          </div>
          <div style="color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 18px;">${msg}</div>
          <div style="color: var(--faint); font-size: 11.5px; line-height: 1.6;">
            Check the browser console for details. Common causes: bad Supabase URL/key, CDN blocked by
            network, or a script that failed to load.
          </div>
        </div>
      `;
    }

    let sb;
    try {
      sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      showFatal('Failed to init Supabase: ' + err.message);
    }

    // Catch anything that goes uncaught
    window.addEventListener('error', (e) => {
      console.error('Uncaught error:', e.error || e.message);
    });

    const RATING_INTERVALS = { 1: 30, 2: 12, 3: 5, 4: 2 };
    const RATING_LABELS = {
      1: 'Trivial', 2: 'Solid', 3: 'Got it eventually', 4: 'Struggled hard',
    };
    const COMMON_PATTERNS = [
      'Two Pointers', 'Sliding Window', 'Hash Map', 'Binary Search',
      'BFS', 'DFS', 'DP', 'Backtracking', 'Greedy', 'Monotonic Stack',
      'Prefix Sum', 'Heap', 'Union Find', 'Trie', 'Linked List',
      'Tree', 'Graph', 'Bit Manipulation'
    ];

    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const addDays = (dateStr, days) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + days);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    };
    const daysBetween = (a, b) => {
      const [y1, m1, d1] = a.split('-').map(Number);
      const [y2, m2, d2] = b.split('-').map(Number);
      return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 86400000);
    };

    // LeetCode slugs are the problem title lowercased with runs of non-alphanumerics
    // collapsed to single hyphens, so a usable link can be derived from the name alone.
    // Anything that does not follow that (a non-LeetCode problem, a renamed title) is
    // handled by letting the user store an explicit url, which always wins.
    const slugify = (s) => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const leetcodeUrlFor = (name) => {
      const slug = slugify(name || '');
      return slug ? `https://leetcode.com/problems/${slug}/` : '';
    };
    const problemUrl = (p) => (p.url || '').trim() || leetcodeUrlFor(p.name);
    const hasCard = (p) => Boolean((p.solution || '').trim() || (p.notes || '').trim());

    const THEME_KEY = 'recall_theme_v1';
    const systemTheme = () => (
      window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    );
    const loadTheme = () => {
      try { return localStorage.getItem(THEME_KEY) || systemTheme(); } catch { return 'light'; }
    };
    const saveTheme = (t) => { try { localStorage.setItem(THEME_KEY, t); } catch {} };

    // The status bar / browser chrome colour has to follow the in-app toggle, not the OS
    // setting, or a dark-themed app sits under a light system bar.
    const THEME_META = { light: '#F4F3EE', dark: '#131312' };
    const applyTheme = (theme) => {
      document.documentElement.dataset.theme = theme;
      const meta = document.getElementById('theme-color-meta');
      if (meta) meta.setAttribute('content', THEME_META[theme]);
    };

    // ============================================================
    // Icons — inline SVG rather than text glyphs, which render at
    // wildly different weights and baselines across platforms.
    // ============================================================
    function Svg({ size = 16, children, style, className = '' }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" className={className}
          style={{ display: 'block', flex: 'none', ...style }} aria-hidden="true" focusable="false">
          {children}
        </svg>
      );
    }
    const IconMoon = (p) => <Svg {...p}><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></Svg>;
    const IconSun = (p) => (
      <Svg {...p}>
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4" />
      </Svg>
    );
    const IconMore = (p) => (
      <Svg {...p}><circle cx="5" cy="12" r="1.2" /><circle cx="12" cy="12" r="1.2" /><circle cx="19" cy="12" r="1.2" /></Svg>
    );
    const IconExternal = (p) => <Svg {...p}><path d="M15 3h6v6M10.5 13.5 21 3M18 13.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5.5" /></Svg>;
    const IconChevron = (p) => <Svg {...p}><path d="m9 18 6-6-6-6" /></Svg>;
    const IconTrash = (p) => <Svg {...p}><path d="M3 6h18M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6M18.5 6l-.9 13.1A2 2 0 0 1 15.6 21H8.4a2 2 0 0 1-2-1.9L5.5 6" /></Svg>;
    const IconPlus = (p) => <Svg {...p}><path d="M12 5v14M5 12h14" /></Svg>;
    const IconCheck = (p) => <Svg {...p}><path d="M20 6 9 17l-5-5" /></Svg>;
    const IconEye = (p) => <Svg {...p}><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3" /></Svg>;
    const IconMail = (p) => <Svg {...p}><rect x="2.5" y="4.5" width="19" height="15" rx="2.5" /><path d="m21 7-9 5.5L3 7" /></Svg>;
    const IconSignOut = (p) => <Svg {...p}><path d="M9.5 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4.5M16 16.5l4.5-4.5L16 7.5M20.5 12H9.5" /></Svg>;
    const IconPencil = (p) => <Svg {...p}><path d="M12 20h9M16.4 3.6a2.1 2.1 0 0 1 3 3L7.5 18.5 3 20l1.5-4.5L16.4 3.6z" /></Svg>;
    const IconInbox = (p) => (
      <Svg {...p}>
        <path d="M22 12h-5.5l-1.5 3h-6l-1.5-3H2" />
        <path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z" />
      </Svg>
    );
    const IconLayers = (p) => <Svg {...p}><path d="m12 2.5 9.5 5-9.5 5-9.5-5 9.5-5zM2.5 12.5 12 17.5l9.5-5M2.5 17.5 12 22.5l9.5-5" /></Svg>;
    const IconAlert = (p) => <Svg {...p}><circle cx="12" cy="12" r="9.5" /><path d="M12 7.5v5M12 16.2v.1" /></Svg>;
    const IconSparkle = (p) => <Svg {...p}><path d="M12 3l1.9 5.3L19 10l-5.1 1.7L12 17l-1.9-5.3L5 10l5.1-1.7L12 3zM19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z" /></Svg>;

    const TABS = [
      { key: 'today', label: 'Today', Icon: IconInbox },
      { key: 'add', label: 'Add', Icon: IconPlus },
      { key: 'all', label: 'All', Icon: IconLayers },
    ];

    // The rail already carries the due count on desktop, so these headings say
    // what the column is rather than repeating the number back.
    const VIEW_HEADINGS = {
      today: {
        title: 'Due today',
        sub: (s) => (s.due === 0
          ? 'Nothing to review right now.'
          : 'Try to recall each one before revealing the card.'),
      },
      add: {
        title: 'Add a problem',
        sub: () => 'Log something you just solved so it comes back at the right time.',
      },
      all: {
        title: 'Library',
        sub: (s) => `${s.total} ${s.total === 1 ? 'problem' : 'problems'} tracked.`,
      },
    };

    // The phone layout and the desktop layout are different enough in structure
    // (a rail that owns navigation vs. a header plus segmented tabs) that
    // rendering one or the other beats trying to reshape a single tree in CSS.
    const WIDE = '(min-width: 1024px)';
    function useMediaQuery(query) {
      const [matches, setMatches] = useState(() => window.matchMedia(query).matches);
      useEffect(() => {
        const mql = window.matchMedia(query);
        const onChange = (e) => setMatches(e.matches);
        setMatches(mql.matches);
        mql.addEventListener('change', onChange);
        return () => mql.removeEventListener('change', onChange);
      }, [query]);
      return matches;
    }

    // ============================================================
    // Toasts — replace blocking window.alert() for failures, and give
    // silent writes (rate / save / delete) a visible confirmation.
    // ============================================================
    function useToasts() {
      const [toasts, setToasts] = useState([]);
      const timers = useRef([]);

      useEffect(() => () => timers.current.forEach(clearTimeout), []);

      const notify = useCallback((message, variant = 'info') => {
        const id = `t_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        const life = variant === 'error' ? 5200 : 2600;
        setToasts((t) => [...t, { id, message, variant, leaving: false }].slice(-3));
        timers.current.push(setTimeout(() => {
          setToasts((t) => t.map((x) => (x.id === id ? { ...x, leaving: true } : x)));
        }, life));
        timers.current.push(setTimeout(() => {
          setToasts((t) => t.filter((x) => x.id !== id));
        }, life + 260));
      }, []);

      const dismiss = useCallback((id) => setToasts((t) => t.filter((x) => x.id !== id)), []);
      return { toasts, notify, dismiss };
    }

    function ToastLayer({ toasts, onDismiss }) {
      if (toasts.length === 0) return null;
      return (
        <div className="toast-layer" role="status" aria-live="polite">
          {toasts.map((t) => (
            <div key={t.id} className="toast" data-variant={t.variant} data-leaving={t.leaving}
              onClick={() => onDismiss(t.id)}>
              <span className="toast-icon">
                {t.variant === 'error' ? <IconAlert size={14} /> : <IconCheck size={14} />}
              </span>
              <span>{t.message}</span>
            </div>
          ))}
        </div>
      );
    }

    // ============================================================
    // Shell
    // ============================================================
    function App() {
      const [authState, setAuthState] = useState('checking');
      const [user, setUser] = useState(null);
      const [theme, setTheme] = useState(loadTheme);

      useEffect(() => { applyTheme(theme); }, [theme]);

      useEffect(() => {
        sb.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) { setUser(session.user); setAuthState('signed-in'); }
          else { setAuthState('signed-out'); }
        });
        const { data: { subscription } } = sb.auth.onAuthStateChange((_e, session) => {
          if (session?.user) { setUser(session.user); setAuthState('signed-in'); }
          else { setUser(null); setAuthState('signed-out'); }
        });
        return () => subscription.unsubscribe();
      }, []);

      const toggleTheme = () => {
        const next = theme === 'light' ? 'dark' : 'light';
        setTheme(next); saveTheme(next);
      };

      if (authState === 'checking') {
        return (
          <div className="shell flex items-center justify-center">
            <div className="eyebrow breathe">Checking session</div>
          </div>
        );
      }
      if (authState === 'signed-out') {
        return <AuthScreen theme={theme} onToggleTheme={toggleTheme} />;
      }
      return <MainApp user={user} theme={theme} onToggleTheme={toggleTheme} />;
    }

    function ThemeToggle({ theme, onToggle }) {
      return (
        <button onClick={onToggle} className="icon-btn"
          aria-label={theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme'}>
          <span key={theme} className="icon-swap">
            {theme === 'light' ? <IconMoon size={15} /> : <IconSun size={15} />}
          </span>
        </button>
      );
    }

    function Wordmark() {
      return (
        <div className="wordmark">
          <span className="wordmark-name">Recall</span>
          <span className="wordmark-sub">INTERVAL PREP</span>
        </div>
      );
    }

    // ============================================================
    // Auth
    // ============================================================
    function AuthScreen({ theme, onToggleTheme }) {
      const isWide = useMediaQuery(WIDE);
      const [email, setEmail] = useState('');
      const [sending, setSending] = useState(false);
      const [sent, setSent] = useState(false);
      const [error, setError] = useState(null);

      const isValidEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

      const sendLink = async () => {
        if (!isValidEmail(email)) {
          setError('That doesn\'t look like a valid email');
          return;
        }
        setSending(true); setError(null);
        const { error } = await sb.auth.signInWithOtp({
          email: email.trim(),
          options: {
            emailRedirectTo: window.location.origin + window.location.pathname,
            shouldCreateUser: true,
          },
        });
        if (error) {
          setError(error.message);
          setSending(false);
        } else {
          setSent(true);
          setSending(false);
        }
      };

      const useDifferentEmail = () => {
        setSent(false); setEmail(''); setError(null);
      };

      const headline = (
        <>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Sign in</div>
          <h1 className="display" style={{ fontSize: 40, lineHeight: 1.06, letterSpacing: '-0.015em', margin: '0 0 12px' }}>
            Your queue,<br />across every device.
          </h1>
          <p style={{ color: 'var(--muted)', fontSize: 14, lineHeight: 1.6, margin: 0 }}>
            Enter your email and we'll send you a sign-in link. No password to remember.
          </p>
        </>
      );
      const finePrint = (
        <p style={{ fontSize: 11.5, color: 'var(--faint)', lineHeight: 1.6, margin: 0 }}>
          We only store your problem list and email. No tracking, no ads, no analytics.
        </p>
      );

      const panel = (
        <div style={{ width: '100%', maxWidth: 380 }}>
          {!sent ? (
            <div className="anim-rise">
              {!isWide && <div style={{ marginBottom: 28 }}>{headline}</div>}

              <div className="stack-3">
                    <input
                      type="email"
                      value={email}
                      onChange={(e) => { setEmail(e.target.value); setError(null); }}
                      onKeyDown={(e) => { if (e.key === 'Enter') sendLink(); }}
                      placeholder="you@example.com"
                      autoComplete="email"
                      inputMode="email"
                      aria-label="Email address"
                      className="field field-lg"
                    />
                    <button onClick={sendLink} disabled={sending || !email} className="btn btn-primary btn-lg">
                      {sending ? 'Sending…' : <><IconMail size={16} /> Send sign-in link</>}
                    </button>
                  </div>

                  {error && (
                    <div className="panel anim-fade" style={{ marginTop: 12, padding: 12, borderColor: 'var(--danger)', background: 'var(--danger-soft)' }}>
                      <div className="flex items-start gap-2" style={{ color: 'var(--danger)', fontSize: 12.5, lineHeight: 1.5 }}>
                        <IconAlert size={14} style={{ marginTop: 1 }} />
                        <span>{error}</span>
                      </div>
                    </div>
                  )}

              {!isWide && <div style={{ marginTop: 26 }}>{finePrint}</div>}
            </div>
          ) : (
            <div className="anim-rise">
              <div style={{ marginBottom: 22 }}>
                <span className="pill pill-success">
                  <IconCheck size={12} /> Link sent
                </span>
                <h1 className="display" style={{ fontSize: 36, lineHeight: 1.08, letterSpacing: '-0.015em', margin: '14px 0 12px' }}>
                  Check your email.
                </h1>
                <p style={{ color: 'var(--muted)', fontSize: 14, lineHeight: 1.6, margin: 0 }}>
                  A sign-in link is on the way to{' '}
                  <span className="mono" style={{ color: 'var(--text)', fontSize: 13 }}>{email}</span>.
                  {' '}Open it on this device to finish signing in. The link expires in an hour.
                </p>
              </div>

              <div className="inset" style={{ padding: 14, marginBottom: 14 }}>
                <p style={{ color: 'var(--muted)', fontSize: 11.5, lineHeight: 1.6, margin: 0 }}>
                  Not seeing it? Check spam, or wait a minute — Supabase's free tier can throttle.
                  If it never arrives, use a different email.
                </p>
              </div>

              <button onClick={useDifferentEmail} className="btn btn-ghost" style={{ width: '100%' }}>
                Use a different email
              </button>
            </div>
          )}
        </div>
      );

      if (isWide) {
        return (
          <div className="auth-split">
            <div className="auth-brand">
              <Wordmark />
              <div style={{ maxWidth: 460 }}>{headline}</div>
              {finePrint}
            </div>
            <div className="auth-pane">
              <div style={{ width: '100%', maxWidth: 380 }}>
                <div className="flex justify-end" style={{ marginBottom: 26 }}>
                  <ThemeToggle theme={theme} onToggle={onToggleTheme} />
                </div>
                {panel}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="shell flex flex-col">
          <header className="app-header">
            <div className="content app-header-inner">
              <Wordmark />
              <ThemeToggle theme={theme} onToggle={onToggleTheme} />
            </div>
          </header>

          <div className="flex-1 flex items-center justify-center content"
            style={{ paddingTop: 32, paddingBottom: 'calc(48px + env(safe-area-inset-bottom))' }}>
            {panel}
          </div>
        </div>
      );
    }

    // ============================================================
    // Main
    // ============================================================
    function MainApp({ user, theme, onToggleTheme }) {
      const isWide = useMediaQuery(WIDE);
      const [problems, setProblems] = useState([]);
      const [view, setView] = useState('today');
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [menuOpen, setMenuOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);
      const menuRef = useRef(null);
      const { toasts, notify, dismiss } = useToasts();

      useEffect(() => { fetchProblems(); }, []);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 4);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      // A menu that only closes by clicking its own trigger again is the kind of
      // papercut that makes an app feel unfinished.
      useEffect(() => {
        if (!menuOpen) return;
        const onDown = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
        const onKey = (e) => { if (e.key === 'Escape') setMenuOpen(false); };
        document.addEventListener('mousedown', onDown);
        document.addEventListener('touchstart', onDown);
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('mousedown', onDown);
          document.removeEventListener('touchstart', onDown);
          document.removeEventListener('keydown', onKey);
        };
      }, [menuOpen]);

      const fetchProblems = async () => {
        setLoading(true); setError(null);
        const { data, error } = await sb.from('problems').select('*').order('next_review', { ascending: true });
        if (error) setError(error.message);
        else setProblems(data || []);
        setLoading(false);
      };

      const addProblem = async (data) => {
        const newProblem = {
          id: `p_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          user_id: user.id,
          name: data.name.trim(),
          pattern: data.pattern.trim(),
          url: data.url.trim() || null,
          solution: data.solution.trim() || null,
          notes: data.notes.trim() || null,
          solution_saved_at: data.solution.trim() ? todayStr() : null,
          history: [{ date: todayStr(), rating: data.rating }],
          next_review: addDays(todayStr(), RATING_INTERVALS[data.rating]),
          created_at: todayStr(),
        };
        const prev = problems;
        setProblems([...problems, newProblem]);
        setView('today');
        const { error } = await sb.from('problems').insert(newProblem);
        if (error) { setProblems(prev); notify('Failed to save: ' + error.message, 'error'); }
        else notify(`${newProblem.name} added · back in ${RATING_INTERVALS[data.rating]}d`, 'success');
      };

      const rateProblem = async (id, rating) => {
        const problem = problems.find((p) => p.id === id);
        if (!problem) return;
        const newHistory = [...problem.history, { date: todayStr(), rating }];
        const newNextReview = addDays(todayStr(), RATING_INTERVALS[rating]);
        const prev = problems;
        setProblems(problems.map((p) =>
          p.id === id ? { ...p, history: newHistory, next_review: newNextReview } : p
        ));
        const { error } = await sb.from('problems')
          .update({ history: newHistory, next_review: newNextReview })
          .eq('id', id);
        if (error) { setProblems(prev); notify('Failed to save: ' + error.message, 'error'); }
        else notify(`Next review in ${RATING_INTERVALS[rating]} days`, 'success');
      };

      // Saves the card fields (solution / notes / url). Kept separate from rateProblem so
      // editing a card never disturbs the review schedule.
      const saveCard = async (id, fields) => {
        const patch = {
          url: fields.url.trim() || null,
          solution: fields.solution.trim() || null,
          notes: fields.notes.trim() || null,
        };
        const current = problems.find((p) => p.id === id);
        if (patch.solution && patch.solution !== current?.solution) {
          patch.solution_saved_at = todayStr();
        }
        const prev = problems;
        setProblems(problems.map((p) => (p.id === id ? { ...p, ...patch } : p)));
        const { error } = await sb.from('problems').update(patch).eq('id', id);
        if (error) { setProblems(prev); notify('Failed to save: ' + error.message, 'error'); }
        else notify('Card saved', 'success');
      };

      const deleteProblem = async (id) => {
        const gone = problems.find((p) => p.id === id);
        const prev = problems;
        setProblems(problems.filter((p) => p.id !== id));
        const { error } = await sb.from('problems').delete().eq('id', id);
        if (error) { setProblems(prev); notify('Failed to delete: ' + error.message, 'error'); }
        else notify(`${gone ? gone.name : 'Problem'} removed`, 'success');
      };

      const signOut = async () => { await sb.auth.signOut(); };

      const today = todayStr();
      const dueToday = problems
        .filter((p) => p.next_review <= today)
        .sort((a, b) => a.next_review.localeCompare(b.next_review));
      const stats = { total: problems.length, due: dueToday.length };

      const activeIndex = TABS.findIndex((t) => t.key === view);

      const hero = (
        <div>
          <div className="eyebrow" style={{ marginBottom: 12 }}>Today</div>
          <div className="flex items-end gap-3.5" style={{ flexWrap: 'wrap' }}>
            <span className="hero-num" data-due={stats.due > 0}>{stats.due}</span>
            <div style={{ paddingBottom: 4 }}>
              <div style={{ color: 'var(--muted)', fontSize: 15, lineHeight: 1.3 }}>
                {stats.due === 1 ? 'problem' : 'problems'} to review
              </div>
              {stats.due === 0 && stats.total > 0 && (
                <span className="pill pill-success" style={{ marginTop: 7 }}>
                  <IconCheck size={11} /> all clear
                </span>
              )}
            </div>
          </div>
        </div>
      );

      const views = (
        <div className="view-area">
          {view === 'today' && (
            <TodayView due={dueToday} onRate={rateProblem} onSaveCard={saveCard}
              hasProblems={problems.length > 0} onGoAdd={() => setView('add')} />
          )}
          {view === 'add' && <AddView onAdd={addProblem} />}
          {view === 'all' && (
            <AllView problems={problems} onDelete={deleteProblem} onSaveCard={saveCard} />
          )}
        </div>
      );

      const errorBlock = (
        <div className="panel anim-fade" style={{ padding: 16, maxWidth: 520, borderColor: 'var(--danger)', background: 'var(--danger-soft)' }}>
          <div className="flex items-start gap-2" style={{ marginBottom: 12 }}>
            <IconAlert size={15} style={{ color: 'var(--danger)', marginTop: 1 }} />
            <div style={{ color: 'var(--danger)', fontSize: 13, lineHeight: 1.5 }}>
              Couldn't load your problems: {error}
            </div>
          </div>
          <button onClick={fetchProblems} className="btn btn-primary btn-sm">Retry</button>
        </div>
      );

      // Desktop: the rail owns identity, the counter and navigation, so the whole
      // content column is free for problems.
      if (isWide) {
        const head = VIEW_HEADINGS[view];
        return (
          <div className="layout">
            <aside className="rail">
              <Wordmark />
              {loading ? <RailHeroSkeleton /> : hero}
              <nav className="rail-nav" aria-label="Views">
                {TABS.map((tab) => {
                  const count = tab.key === 'today' ? stats.due : tab.key === 'all' ? stats.total : null;
                  return (
                    <button key={tab.key} onClick={() => setView(tab.key)} className="rail-nav-btn"
                      aria-current={view === tab.key ? 'page' : undefined}>
                      <tab.Icon size={15} />
                      {tab.label}
                      {count !== null && (
                        <span className="rail-nav-count" data-due={tab.key === 'today' && count > 0}>{count}</span>
                      )}
                    </button>
                  );
                })}
              </nav>
              <div className="rail-foot">
                <div className="rail-user">
                  <span className="avatar">{(user.email || '?').charAt(0)}</span>
                  <span className="truncate" style={{ fontSize: 12, color: 'var(--muted)' }}>{user.email}</span>
                </div>
                <div className="flex items-center gap-2">
                  <ThemeToggle theme={theme} onToggle={onToggleTheme} />
                  <button onClick={signOut} className="btn btn-ghost btn-sm" style={{ flex: 1 }}>
                    <IconSignOut size={14} /> Sign out
                  </button>
                </div>
              </div>
            </aside>

            <div className="main">
              <main className="content page-pad">
                {loading ? <LoadingState wide /> : error ? errorBlock : (
                  <>
                    <div className="view-head anim-rise">
                      <h1 className="view-title">{head.title}</h1>
                      <p className="view-sub">{head.sub(stats)}</p>
                    </div>
                    {views}
                  </>
                )}
              </main>
            </div>

            <ToastLayer toasts={toasts} onDismiss={dismiss} />
          </div>
        );
      }

      return (
        <div className="shell">
          <header className="app-header" data-scrolled={scrolled}>
            <div className="content app-header-inner">
              <Wordmark />
              <div className="flex items-center gap-2" style={{ position: 'relative' }} ref={menuRef}>
                <span className="pill mono tnum" style={{ fontSize: 10.5 }}>{stats.total} tracked</span>
                <ThemeToggle theme={theme} onToggle={onToggleTheme} />
                <button onClick={() => setMenuOpen(!menuOpen)} className="icon-btn"
                  aria-label="Account menu" aria-haspopup="menu" aria-expanded={menuOpen}>
                  <IconMore size={16} />
                </button>
                {menuOpen && (
                  <div className="menu" role="menu">
                    <div className="menu-head flex items-center gap-2.5">
                      <span className="avatar">{(user.email || '?').charAt(0)}</span>
                      <span className="truncate" style={{ fontSize: 12, color: 'var(--muted)' }}>{user.email}</span>
                    </div>
                    <button onClick={() => { setMenuOpen(false); signOut(); }} className="menu-item" role="menuitem">
                      <IconSignOut size={15} style={{ color: 'var(--muted)' }} />
                      Sign out
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          <main className="content page-pad">
            {loading ? <LoadingState /> : error ? errorBlock : (
              <>
                <section className="anim-rise" style={{ marginBottom: 26 }}>{hero}</section>

                <div className="seg anim-rise" role="tablist" aria-label="Views" style={{ marginBottom: 22, animationDelay: '40ms' }}>
                  <div className="seg-thumb" style={{ transform: `translateX(${Math.max(activeIndex, 0) * 100}%)` }} />
                  {TABS.map((tab) => (
                    <button key={tab.key} onClick={() => setView(tab.key)} className="seg-btn"
                      role="tab" aria-selected={view === tab.key}>
                      {tab.label}
                    </button>
                  ))}
                </div>

                {views}
              </>
            )}
          </main>

          <ToastLayer toasts={toasts} onDismiss={dismiss} />
        </div>
      );
    }

    // Skeletons in the shape of the real content, so the first paint after load is a
    // refinement of what is already on screen rather than a jump from a text label.
    function LoadingState({ wide }) {
      const cards = wide ? [0, 1, 2, 3, 4, 5] : [0, 1, 2];
      return (
        <div className="anim-fade view-area" aria-busy="true" aria-label="Loading problems">
          {wide ? (
            <div className="view-head">
              <div className="sk" style={{ width: 176, height: 28, borderRadius: 8, marginBottom: 10 }} />
              <div className="sk" style={{ width: 280, height: 12 }} />
            </div>
          ) : (
            <>
              <div style={{ marginBottom: 26 }}>
                <div className="sk" style={{ width: 54, height: 10, marginBottom: 14 }} />
                <div className="sk" style={{ width: 168, height: 58, borderRadius: 10 }} />
              </div>
              <div className="sk" style={{ width: '100%', height: 46, borderRadius: 14, marginBottom: 22 }} />
            </>
          )}
          <div className="grid-review">
            {cards.map((i) => (
              <div key={i} className="card" style={{ padding: 20 }}>
                <div className="sk" style={{ width: `${58 + (i % 3) * 11}%`, height: 15, marginBottom: 12 }} />
                <div className="flex gap-2" style={{ marginBottom: 18 }}>
                  <div className="sk" style={{ width: 74, height: 18, borderRadius: 999 }} />
                  <div className="sk" style={{ width: 58, height: 18, borderRadius: 999 }} />
                </div>
                <div className="sk" style={{ width: '100%', height: 74, borderRadius: 10 }} />
              </div>
            ))}
          </div>
        </div>
      );
    }

    function RailHeroSkeleton() {
      return (
        <div aria-hidden="true">
          <div className="sk" style={{ width: 46, height: 10, marginBottom: 14 }} />
          <div className="sk" style={{ width: 132, height: 50, borderRadius: 10 }} />
        </div>
      );
    }

    function TodayView({ due, onRate, onSaveCard, hasProblems, onGoAdd }) {
      if (!hasProblems) return (
        <EmptyState icon={<IconSparkle size={22} />} title="Nothing tracked yet"
          body="Add the first problem you've solved recently. Rate it honestly — that rating sets when you'll see it again."
          cta="Add a problem" onCta={onGoAdd} />
      );
      if (due.length === 0) return (
        <EmptyState icon={<IconInbox size={22} />} title="Clear queue"
          body="No reviews due today. Add new problems as you solve them, or come back tomorrow."
          cta="Add a problem" onCta={onGoAdd} />
      );
      return (
        <div className="grid-review">
          {due.map((p, i) => (
            <ReviewCard key={p.id} problem={p} index={i} onRate={onRate} onSaveCard={onSaveCard} />
          ))}
        </div>
      );
    }

    function ProblemLink({ problem }) {
      const href = problemUrl(problem);
      if (!href) return null;
      return (
        <a href={href} target="_blank" rel="noopener noreferrer" className="link"
          onClick={(e) => e.stopPropagation()}>
          <IconExternal size={11} /> open
        </a>
      );
    }

    function Field({ label, value, onChange, placeholder, mono, rows, inset }) {
      return (
        <div>
          <label className="field-label">{label}</label>
          <textarea value={value} onChange={(e) => onChange(e.target.value)}
            placeholder={placeholder} rows={rows}
            className={`field ${inset ? 'field-inset' : ''} ${mono ? 'mono' : ''}`} />
        </div>
      );
    }

    function LinkField({ value, onChange, placeholder, inset }) {
      return (
        <div>
          <label className="field-label">Problem link</label>
          <input type="url" value={value} onChange={(e) => onChange(e.target.value)}
            placeholder={placeholder} inputMode="url"
            className={`field ${inset ? 'field-inset' : ''}`} style={{ fontSize: 12.5 }} />
          <div className="field-hint">Leave blank to use the LeetCode link guessed from the name.</div>
        </div>
      );
    }

    // Edit form for the three card fields. Used from both the review flow and the library.
    function CardForm({ problem, onSave, onCancel }) {
      const [solution, setSolution] = useState(problem.solution || '');
      const [notes, setNotes] = useState(problem.notes || '');
      const [url, setUrl] = useState(problem.url || '');

      const save = () => { onSave(problem.id, { solution, notes, url }); onCancel(); };

      return (
        <div className="stack-3 anim-fade">
          <Field label="My solution" value={solution} onChange={setSolution} mono rows={10} inset
            placeholder="Paste the solution you actually wrote." />
          <Field label="My notes" value={notes} onChange={setNotes} rows={3} inset
            placeholder="The insight, the edge case you missed, why it works." />
          <LinkField value={url} onChange={setUrl} inset
            placeholder={leetcodeUrlFor(problem.name) || 'https://…'} />
          <div className="flex gap-2">
            <button onClick={save} className="btn btn-primary btn-sm">
              <IconCheck size={13} /> Save card
            </button>
            <button onClick={onCancel} className="btn btn-ghost btn-sm">Cancel</button>
          </div>
        </div>
      );
    }

    // Read view of a card, with an edit toggle. This is the "back" of the flashcard.
    function CardPanel({ problem, onSave }) {
      const [editing, setEditing] = useState(false);

      if (editing) {
        return <CardForm problem={problem} onSave={onSave} onCancel={() => setEditing(false)} />;
      }

      // Stay compact when there is nothing saved. Opening the full form here would push
      // the rating buttons off screen for anyone who just wants to rate and move on.
      if (!hasCard(problem)) {
        return (
          <div className="inset dashed flex items-center justify-between gap-3" style={{ padding: '12px 13px' }}>
            <span style={{ color: 'var(--muted)', fontSize: 12.5 }}>No solution saved yet.</span>
            <button onClick={() => setEditing(true)} className="btn btn-quiet btn-sm">
              <IconPlus size={13} /> Add solution
            </button>
          </div>
        );
      }

      return (
        <div className="stack-3 anim-fade">
          {problem.solution && (
            <div>
              <div className="flex items-baseline justify-between gap-3" style={{ marginBottom: 7 }}>
                <span className="field-label" style={{ margin: 0 }}>My solution</span>
                {problem.solution_saved_at && (
                  <span className="mono tnum" style={{ color: 'var(--faint)', fontSize: 10 }}>
                    saved {problem.solution_saved_at}
                  </span>
                )}
              </div>
              <pre className="code">{problem.solution}</pre>
            </div>
          )}
          {problem.notes && (
            <div>
              <span className="field-label">My notes</span>
              <div style={{ color: 'var(--text)', fontSize: 13.5, lineHeight: 1.65, whiteSpace: 'pre-wrap' }}>
                {problem.notes}
              </div>
            </div>
          )}
          <button onClick={() => setEditing(true)} className="btn btn-ghost btn-sm">
            <IconPencil size={12} /> Edit card
          </button>
        </div>
      );
    }

    function ReviewCard({ problem, index, onRate, onSaveCard }) {
      const [rating, setRating] = useState(null);
      const [revealed, setRevealed] = useState(false);
      const [leaving, setLeaving] = useState(false);
      const slotRef = useRef(null);
      // Nothing saved yet means there is nothing to recall against, so go straight to
      // rating rather than dead-ending behind a reveal button that shows an empty card.
      const showRating = revealed || !hasCard(problem);
      const lastReview = problem.history[problem.history.length - 1];
      const daysSince = daysBetween(lastReview.date, todayStr());
      const daysOverdue = daysBetween(problem.next_review, todayStr());

      // Collapse the row out of the list rather than letting it vanish and snap the
      // remaining cards upward. Height is locked to the measured value first so the
      // transition to 0 has something to animate from.
      const handleRate = (r) => {
        if (rating !== null) return;
        setRating(r);
        const el = slotRef.current;
        if (el) el.style.maxHeight = `${el.scrollHeight}px`;
        requestAnimationFrame(() => requestAnimationFrame(() => setLeaving(true)));
        setTimeout(() => onRate(problem.id, r), 360);
      };

      return (
        <div className="review-slot" ref={slotRef} data-leaving={leaving}>
          <div className="card anim-rise" style={{ padding: 20, animationDelay: `${Math.min(index, 6) * 55}ms` }}>
            <div className="mono" style={{ fontSize: 15, fontWeight: 600, lineHeight: 1.4, wordBreak: 'break-word', marginBottom: 10 }}>
              {problem.name}
            </div>
            <div className="flex items-center flex-wrap gap-x-2.5 gap-y-1.5" style={{ marginBottom: 16 }}>
              <span className="pill">{problem.pattern}</span>
              <span style={{ color: 'var(--muted)', fontSize: 11.5 }}>
                last {daysSince === 0 ? 'today' : `${daysSince}d ago`}
              </span>
              {daysOverdue > 0 && <span className="pill pill-accent">{daysOverdue}d overdue</span>}
              <ProblemLink problem={problem} />
            </div>

            <div style={{ marginBottom: 16 }}>
              {showRating ? (
                <CardPanel problem={problem} onSave={onSaveCard} />
              ) : (
                <div className="inset card-back anim-fade" style={{ padding: 22, textAlign: 'center' }}>
                  <div style={{ color: 'var(--muted)', fontSize: 12.5, marginBottom: 14 }}>
                    Try to recall it first.
                  </div>
                  <button onClick={() => setRevealed(true)} className="btn btn-primary">
                    <IconEye size={15} /> Reveal solution
                  </button>
                </div>
              )}
            </div>

            {showRating && (
              <div className="anim-fade">
                <div className="eyebrow" style={{ marginBottom: 10 }}>How did it go?</div>
                <div className="grid grid-cols-2 gap-2">
                  {[4, 3, 2, 1].map((r) => (
                    <RatingButton key={r} rating={r} selected={rating === r} onClick={() => handleRate(r)} />
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function RatingButton({ rating, selected, onClick }) {
      const label = RATING_LABELS[rating];
      const days = RATING_INTERVALS[rating];
      const dotVar = {
        4: 'var(--dot-struggle)', 3: 'var(--accent)', 2: 'var(--dot-solid)', 1: 'var(--success)',
      }[rating];

      return (
        <button onClick={onClick} className="rating" aria-pressed={selected}>
          <span className="flex items-center gap-1.5" style={{ marginBottom: 5 }}>
            <span className="dot" style={{ background: dotVar }} />
            <span className="rating-label">{label}</span>
          </span>
          <span className="rating-days">→ in {days}d</span>
        </button>
      );
    }

    function AddView({ onAdd }) {
      const [name, setName] = useState('');
      const [pattern, setPattern] = useState('');
      const [rating, setRating] = useState(4);
      const [solution, setSolution] = useState('');
      const [notes, setNotes] = useState('');
      const [url, setUrl] = useState('');
      const canSubmit = name.trim().length > 0 && pattern.trim().length > 0;

      const submit = () => {
        if (!canSubmit) return;
        onAdd({ name, pattern, rating, solution, notes, url });
        setName(''); setPattern(''); setRating(4);
        setSolution(''); setNotes(''); setUrl('');
      };

      return (
        <div className="grid-add anim-rise">
          <div className="stack-5">
          <div>
            <label className="field-label">Problem name</label>
            <input type="text" value={name} onChange={(e) => setName(e.target.value)}
              placeholder="e.g. Two Sum" className="field field-lg mono" autoComplete="off" />
          </div>

          <div>
            <label className="field-label">Pattern</label>
            <input type="text" value={pattern} onChange={(e) => setPattern(e.target.value)}
              placeholder="e.g. Hash Map" className="field field-lg" autoComplete="off"
              style={{ marginBottom: 12 }} />
            <div className="flex flex-wrap gap-1.5">
              {COMMON_PATTERNS.map((p) => (
                <button key={p} onClick={() => setPattern(p)} className="chip" aria-pressed={pattern === p}>
                  {p}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className="field-label">How did it go?</label>
            <div className="grid grid-cols-2 gap-2">
              {[4, 3, 2, 1].map((r) => (
                <RatingButton key={r} rating={r} selected={rating === r} onClick={() => setRating(r)} />
              ))}
            </div>
          </div>
          </div>

          <div className="panel" style={{ padding: 16 }}>
            <div className="flex items-start gap-2" style={{ marginBottom: 14 }}>
              <IconLayers size={14} style={{ color: 'var(--faint)', marginTop: 2 }} />
              <p style={{ color: 'var(--faint)', fontSize: 11.5, lineHeight: 1.6, margin: 0 }}>
                Optional, but this is what you'll be shown when the problem comes back around.
              </p>
            </div>
            <div className="stack-3">
              <Field label="My solution" value={solution} onChange={setSolution} mono rows={8} inset
                placeholder="Paste the solution you actually wrote." />
              <Field label="My notes" value={notes} onChange={setNotes} rows={3} inset
                placeholder="The insight, the edge case you missed, why it works." />
              <LinkField value={url} onChange={setUrl} inset
                placeholder={leetcodeUrlFor(name) || 'https://…'} />
            </div>
          </div>

          <button onClick={submit} disabled={!canSubmit} className="btn btn-primary btn-lg add-submit">
            <IconPlus size={16} /> Add to tracker
          </button>
        </div>
      );
    }

    function AllView({ problems, onDelete, onSaveCard }) {
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [expanded, setExpanded] = useState(null);

      if (problems.length === 0) return (
        <EmptyState icon={<IconLayers size={22} />} title="Empty library"
          body="Once you add problems, they'll live here. You can review the whole set and remove any you no longer want to track." />
      );

      const sorted = [...problems].sort((a, b) => a.next_review.localeCompare(b.next_review));

      return (
        <div className="grid-rows">
          {sorted.map((p, i) => {
            const daysUntil = daysBetween(todayStr(), p.next_review);
            const overdue = daysUntil < 0;
            const dueSoon = overdue || daysUntil === 0;
            const dueLabel = overdue
              ? `${Math.abs(daysUntil)}d overdue`
              : daysUntil === 0 ? 'due today' : `in ${daysUntil}d`;
            const isOpen = expanded === p.id;

            return (
              <div key={p.id} className="row anim-rise" data-expanded={isOpen}
                style={{ padding: 12, animationDelay: `${Math.min(i, 10) * 28}ms` }}>
                <div className="flex items-center justify-between gap-2">
                  <div className="flex-1 min-w-0">
                    <button onClick={() => setExpanded(isOpen ? null : p.id)}
                      className="row-toggle" aria-expanded={isOpen}>
                      <IconChevron size={13} className="row-chevron" />
                      <span className="mono truncate" style={{ fontSize: 13.5, fontWeight: 600 }}>{p.name}</span>
                    </button>
                    <div className="flex items-center flex-wrap gap-x-2 gap-y-1"
                      style={{ marginTop: 5, paddingLeft: 21, fontSize: 11, color: 'var(--muted)' }}>
                      <span>{p.pattern}</span>
                      <span style={{ color: 'var(--faint)' }}>·</span>
                      <span className="tnum">{p.history.length}× reviewed</span>
                      <span style={{ color: 'var(--faint)' }}>·</span>
                      <span style={{ color: dueSoon ? 'var(--accent)' : 'var(--muted)', fontWeight: dueSoon ? 600 : 400 }}>
                        {dueLabel}
                      </span>
                      {hasCard(p) && (
                        <span className="pill pill-success" style={{ padding: '1px 7px', fontSize: 10 }}>
                          <span className="dot" style={{ background: 'var(--success)', width: 4, height: 4 }} />
                          card
                        </span>
                      )}
                      <ProblemLink problem={p} />
                    </div>
                  </div>
                  {confirmDelete === p.id ? (
                    <div className="flex gap-1.5 anim-fade" style={{ flex: 'none' }}>
                      <button onClick={() => { onDelete(p.id); setConfirmDelete(null); }} className="btn btn-danger btn-sm">
                        Delete
                      </button>
                      <button onClick={() => setConfirmDelete(null)} className="btn btn-ghost btn-sm">
                        Cancel
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => setConfirmDelete(p.id)} className="row-danger"
                      aria-label={`Delete ${p.name}`}>
                      <IconTrash size={15} />
                    </button>
                  )}
                </div>
                {isOpen && (
                  <div className="anim-fade" style={{ marginTop: 13, paddingTop: 13, borderTop: '1px solid var(--border)' }}>
                    <CardPanel problem={p} onSave={onSaveCard} />
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    function EmptyState({ icon, title, body, cta, onCta }) {
      return (
        <div className="card dashed anim-rise" style={{ padding: '40px 28px', textAlign: 'center', boxShadow: 'none' }}>
          {icon && (
            <div className="flex items-center justify-center"
              style={{
                width: 46, height: 46, margin: '0 auto 16px', borderRadius: 999,
                background: 'var(--tabs-bg)', color: 'var(--muted)',
              }}>
              {icon}
            </div>
          )}
          <div className="display" style={{ fontSize: 23, lineHeight: 1.2, marginBottom: 8 }}>{title}</div>
          <p style={{ fontSize: 13, color: 'var(--muted)', lineHeight: 1.65, margin: '0 auto', maxWidth: 320 }}>{body}</p>
          {cta && onCta && (
            <button onClick={onCta} className="btn btn-primary" style={{ marginTop: 20 }}>
              <IconPlus size={14} /> {cta}
            </button>
          )}
        </div>
      );
    }

    if (sb) {
      try {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
      } catch (err) {
        showFatal('Failed to render app: ' + err.message);
      }
    }
  </script>
</body>
</html>
