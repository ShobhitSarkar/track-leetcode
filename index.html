<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" id="theme-color-meta" content="#F4F3EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Recall" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Recall — Interval Prep</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:wght@400&display=swap" />

  <script>
    // Applied before first paint so a dark-theme user never sees a light flash.
    (function () {
      try {
        var stored = localStorage.getItem('recall_theme_v1');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Babel's stock "react" preset compiles JSX with the automatic runtime, which emits
    // `import { jsx } from "react/jsx-runtime"`. There is no bundler or import map on this
    // page, so that bare specifier cannot be resolved and the app never mounts (blank page).
    // React and ReactDOM are loaded as UMD globals above, so compile JSX to the classic
    // React.createElement form instead, which needs no module resolution at all.
    Babel.registerPreset('react-classic', {
      presets: [[Babel.availablePresets.react, { runtime: 'classic' }]],
    });
  </script>

  <style>
    /* ==========================================================================
       Design tokens. Every themed colour lives here as a custom property so that
       components can style their own hover / focus / active states in plain CSS
       instead of threading a palette object through props and patching styles
       from JS event handlers.
       ========================================================================== */
    :root {
      --bg: #F4F3EE;
      --surface: #FAF8F3;
      --surface-2: #FFFFFF;
      --inset: #EEEBE3;
      --text: #1A1A1D;
      --muted: #6F6A63;
      --faint: #A69E91;
      --border: #E3DED3;
      --border-strong: #D3CCBE;
      --accent: #A9741A;
      --accent-soft: rgba(169, 116, 26, 0.12);
      --primary: #1D3C6E;
      --primary-hover: #27508D;
      --primary-soft: rgba(29, 60, 110, 0.10);
      --success: #47682C;
      --success-soft: rgba(71, 104, 44, 0.12);
      --danger: #8B2E1E;
      --danger-soft: rgba(139, 46, 30, 0.10);
      --tabs-bg: #E8E4DA;
      --dot-struggle: #B8402E;
      --dot-solid: #7A7A2E;
      --on-primary: #FAF8F3;
      --on-primary-muted: #BCC8DC;
      --hover: rgba(26, 26, 29, 0.045);
      --press: rgba(26, 26, 29, 0.08);
      --shadow-sm: 0 1px 2px rgba(48, 40, 26, 0.05), 0 1px 1px rgba(48, 40, 26, 0.03);
      --shadow-md: 0 1px 2px rgba(48, 40, 26, 0.05), 0 10px 22px -12px rgba(48, 40, 26, 0.22);
      --shadow-lg: 0 2px 6px rgba(48, 40, 26, 0.06), 0 20px 40px -16px rgba(48, 40, 26, 0.28);
      --header-bg: rgba(244, 243, 238, 0.72);
      --ring: rgba(29, 60, 110, 0.40);
      --hatch: rgba(26, 26, 29, 0.045);
      --skeleton: rgba(26, 26, 29, 0.06);
      --skeleton-sheen: rgba(255, 255, 255, 0.55);
    }

    :root[data-theme="dark"] {
      --bg: #131312;
      --surface: #1C1C19;
      --surface-2: #232320;
      --inset: #191916;
      --text: #EDEBE4;
      --muted: #99938A;
      --faint: #635E57;
      --border: #2C2B27;
      --border-strong: #3B3934;
      --accent: #D9A040;
      --accent-soft: rgba(217, 160, 64, 0.14);
      --primary: #7BA0E0;
      --primary-hover: #93B2E9;
      --primary-soft: rgba(123, 160, 224, 0.14);
      --success: #8FB45C;
      --success-soft: rgba(143, 180, 92, 0.14);
      --danger: #D4705B;
      --danger-soft: rgba(212, 112, 91, 0.14);
      --tabs-bg: #232320;
      --dot-struggle: #D96450;
      --dot-solid: #B0AC56;
      --on-primary: #10161F;
      --on-primary-muted: #2E3E56;
      --hover: rgba(255, 255, 255, 0.05);
      --press: rgba(255, 255, 255, 0.09);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.42);
      --shadow-md: 0 2px 6px rgba(0, 0, 0, 0.38), 0 12px 28px -14px rgba(0, 0, 0, 0.7);
      --shadow-lg: 0 4px 12px rgba(0, 0, 0, 0.44), 0 24px 48px -18px rgba(0, 0, 0, 0.78);
      --header-bg: rgba(19, 19, 18, 0.72);
      --ring: rgba(123, 160, 224, 0.48);
      --hatch: rgba(255, 255, 255, 0.035);
      --skeleton: rgba(255, 255, 255, 0.05);
      --skeleton-sheen: rgba(255, 255, 255, 0.07);
    }

    :root {
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
      --t-fast: 130ms;
      --t-base: 210ms;
      --r-sm: 8px;
      --r-md: 10px;
      --r-lg: 14px;
      --r-xl: 18px;
      --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font-display: 'Instrument Serif', ui-serif, Georgia, 'Times New Roman', serif;
    }

    /* ==========================================================================
       Base
       ========================================================================== */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--bg); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-feature-settings: 'cv05' 1, 'cv11' 1, 'ss01' 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      text-rendering: optimizeLegibility;
    }

    input, button, textarea, select { font-family: inherit; color: inherit; }
    button { cursor: pointer; }

    ::selection { background: var(--primary-soft); color: var(--text); }

    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
      border-radius: var(--r-sm);
    }

    .mono { font-family: var(--font-mono); font-feature-settings: 'zero' 1; }
    .display { font-family: var(--font-display); font-weight: 400; }
    .tnum { font-variant-numeric: tabular-nums; }

    /* Thin, theme-aware scrollbars. The stock ones are the loudest element on a
       code block and read as unfinished. */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: content-box; }

    /* ==========================================================================
       Motion
       ========================================================================== */
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(-6px) scale(0.96); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes shimmer {
      from { background-position: -180% 0; }
      to   { background-position: 180% 0; }
    }
    @keyframes soft-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.45; }
    }

    .anim-rise { animation: rise 460ms var(--ease-out) both; }
    .anim-fade { animation: fade-in 320ms ease both; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       Layout shell

       Under 1024px: a stacked phone layout — sticky header, hero counter,
       segmented tabs, one column.
       At 1024px and up: a persistent left rail holds the identity, the counter
       and the navigation, and the whole remaining width belongs to content.
       ========================================================================== */
    .shell { min-height: 100vh; min-height: 100dvh; background: var(--bg); }
    .layout { display: flex; align-items: flex-start; min-height: 100vh; min-height: 100dvh; background: var(--bg); }
    .main { flex: 1 1 auto; min-width: 0; }

    .content {
      width: 100%;
      max-width: 34rem;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
    }
    @media (min-width: 640px) { .content { max-width: 40rem; } }
    @media (min-width: 840px) { .content { max-width: 54rem; padding-left: 28px; padding-right: 28px; } }
    @media (min-width: 1024px) { .content { max-width: 1560px; padding-left: 40px; padding-right: 40px; } }

    /* Content grids size themselves against this element, not the viewport, so
       the column count stays right whether or not the rail is taking 272px. */
    .view-area { container-type: inline-size; }

    /* Two columns is the ceiling for review cards. They hold code and a rating
       grid, so a third column costs readability, and every extra column makes
       the ragged bottom edge of a mixed-height card grid worse. */
    .grid-review {
      display: grid;
      gap: 14px;
      align-items: start;
      grid-template-columns: minmax(0, 1fr);
      max-width: 1200px;
    }
    @container (min-width: 760px) { .grid-review { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    .grid-rows { display: grid; gap: 8px; align-items: start; grid-template-columns: minmax(0, 1fr); }
    @container (min-width: 700px)  { .grid-rows { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @container (min-width: 1200px) { .grid-rows { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

    /* A form does not benefit from unlimited width, so it splits into two
       columns and then stops growing. */
    .grid-add { display: grid; gap: 22px; align-items: start; grid-template-columns: minmax(0, 1fr); max-width: 1080px; }
    @container (min-width: 860px) { .grid-add { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px; } }

    .rail {
      display: none;
      flex: none;
      width: 272px;
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      gap: 24px;
      padding: 26px 22px calc(22px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-right: 1px solid var(--border);
    }
    @media (min-width: 1024px) { .rail { display: flex; } }
    .rail .hero-num { font-size: 62px; }

    .rail-nav { display: flex; flex-direction: column; gap: 3px; }
    .rail-nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: var(--r-md);
      background: transparent;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 500;
      text-align: left;
      transition: background var(--t-fast) ease, color var(--t-fast) ease;
    }
    @media (hover: hover) { .rail-nav-btn:hover { background: var(--hover); color: var(--text); } }
    .rail-nav-btn[aria-current="page"] {
      background: var(--tabs-bg);
      color: var(--text);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .rail-nav-count {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
      color: var(--faint);
    }
    .rail-nav-btn[aria-current="page"] .rail-nav-count { color: var(--muted); }
    .rail-nav-count[data-due="true"] { color: var(--accent); font-weight: 600; }

    .rail-foot {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .rail-user { display: flex; align-items: center; gap: 9px; min-width: 0; }

    .view-head { margin-bottom: 22px; }
    .view-title { font-family: var(--font-display); font-size: 31px; line-height: 1.14; letter-spacing: -0.01em; }
    .view-sub { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }

    /* Split sign-in. A login form stretched across a desktop is worse, not
       better, so the width goes to a brand panel and the form stays readable. */
    .auth-brand { display: none; }
    @media (min-width: 1024px) {
      .auth-split { display: flex; min-height: 100vh; min-height: 100dvh; }
      .auth-brand {
        display: flex;
        flex: 1 1 50%;
        flex-direction: column;
        justify-content: space-between;
        gap: 40px;
        padding: 44px;
        background-color: var(--surface);
        background-image: repeating-linear-gradient(45deg, var(--hatch) 0 1.5px, transparent 1.5px 11px);
        border-right: 1px solid var(--border);
      }
      .auth-pane {
        flex: 1 1 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 44px;
      }
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding-top: env(safe-area-inset-top);
      background: var(--header-bg);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid transparent;
      transition: border-color var(--t-base) ease, box-shadow var(--t-base) ease;
    }
    .app-header[data-scrolled="true"] {
      border-bottom-color: var(--border);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.01);
    }
    .app-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 60px;
    }

    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }
    .wordmark-name {
      font-family: var(--font-display);
      font-size: 26px;
      line-height: 1;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .wordmark-sub {
      font-size: 9px;
      letter-spacing: 0.18em;
      font-weight: 500;
      color: var(--faint);
      white-space: nowrap;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.16em;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
    }

    .page-pad { padding-top: 28px; padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
    @media (min-width: 1024px) { .page-pad { padding-top: 38px; padding-bottom: 64px; } }

    /* ==========================================================================
       Buttons
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid transparent;
      border-radius: var(--r-md);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      padding: 9px 14px;
      background: transparent;
      color: var(--text);
      transition: background var(--t-fast) ease, color var(--t-fast) ease,
                  border-color var(--t-fast) ease, transform var(--t-fast) var(--ease-out),
                  box-shadow var(--t-fast) ease, opacity var(--t-fast) ease;
    }
    .btn:active:not(:disabled) { transform: scale(0.975); }
    .btn:disabled { cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
    }
    @media (hover: hover) {
      .btn-primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--shadow-md); }
    }
    .btn-primary:disabled { background: var(--tabs-bg); color: var(--faint); box-shadow: none; }

    .btn-quiet {
      background: var(--tabs-bg);
      color: var(--text);
    }
    @media (hover: hover) { .btn-quiet:hover:not(:disabled) { background: var(--border); } }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }
    @media (hover: hover) {
      .btn-ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); border-color: var(--border-strong); }
    }

    .btn-danger { background: var(--danger); color: #FFF6F3; font-weight: 600; }
    @media (hover: hover) { .btn-danger:hover { filter: brightness(1.08); } }

    .btn-lg { padding: 14px 18px; font-size: 15px; border-radius: var(--r-lg); width: 100%; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: var(--r-sm); }

    /* Square icon buttons in the header. */
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--muted);
      transition: background var(--t-fast) ease, color var(--t-fast) ease,
                  border-color var(--t-fast) ease, transform var(--t-fast) var(--ease-out);
    }
    @media (hover: hover) {
      .icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
    }
    .icon-btn:active { transform: scale(0.94); }

    .icon-swap { display: inline-flex; animation: pop-in 260ms var(--ease-spring) both; }

    /* ==========================================================================
       Surfaces
       ========================================================================== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-sm);
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
    }
    .inset {
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
    }
    .dashed { border-style: dashed; border-color: var(--border-strong); }

    /* The face-down side of a flashcard. Hatching makes "there is something
       behind this" legible at a glance, without a literal card-flip. */
    .card-back {
      background-color: var(--inset);
      background-image: repeating-linear-gradient(
        45deg, var(--hatch) 0 1.5px, transparent 1.5px 9px
      );
    }

    /* ==========================================================================
       Fields
       ========================================================================== */
    .field {
      display: block;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      color: var(--text);
      padding: 11px 13px;
      font-size: 14px;
      line-height: 1.55;
      transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, background var(--t-fast) ease;
    }
    .field::placeholder { color: var(--faint); }
    .field:hover:not(:focus) { border-color: var(--border-strong); }
    .field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
      outline: none;
    }
    .field-inset { background: var(--inset); }
    .field-lg { padding: 13px 15px; font-size: 15px; border-radius: var(--r-lg); }
    textarea.field { resize: vertical; min-height: 44px; }
    textarea.field.mono { font-size: 12.5px; line-height: 1.6; }

    .field-label {
      display: block;
      margin-bottom: 7px;
      font-size: 10px;
      letter-spacing: 0.14em;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
    }
    .field-hint { margin-top: 6px; font-size: 11px; color: var(--faint); line-height: 1.5; }

    /* iOS zooms the viewport when a focused field is under 16px. Zoom is left
       enabled for accessibility, so the fields grow on touch devices instead. */
    @media (pointer: coarse) {
      .field, .field-lg { font-size: 16px; }
      textarea.field.mono { font-size: 14px; }
    }

    /* ==========================================================================
       Segmented control
       ========================================================================== */
    .seg {
      position: relative;
      display: flex;
      padding: 4px;
      border-radius: var(--r-lg);
      background: var(--tabs-bg);
      border: 1px solid var(--border);
    }
    .seg-thumb {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc((100% - 8px) / 3);
      height: calc(100% - 8px);
      border-radius: var(--r-md);
      background: var(--surface-2);
      box-shadow: var(--shadow-sm);
      transition: transform 380ms var(--ease-out);
    }
    .seg-btn {
      position: relative;
      z-index: 1;
      flex: 1 1 0;
      padding: 9px 0;
      border: 0;
      background: none;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--r-md);
      color: var(--muted);
      transition: color var(--t-base) ease;
    }
    .seg-btn[aria-selected="true"] { color: var(--text); font-weight: 600; }
    @media (hover: hover) { .seg-btn:hover { color: var(--text); } }

    /* ==========================================================================
       Pills, chips, dots
       ========================================================================== */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.5;
      background: var(--tabs-bg);
      color: var(--muted);
      white-space: nowrap;
    }
    .pill-accent { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .pill-success { background: var(--success-soft); color: var(--success); font-weight: 600; }
    .pill-outline { background: transparent; border: 1px solid var(--border); }

    .dot { width: 6px; height: 6px; border-radius: 999px; flex: none; }

    .chip {
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1;
      transition: background var(--t-fast) ease, color var(--t-fast) ease,
                  border-color var(--t-fast) ease, transform var(--t-fast) var(--ease-out);
    }
    @media (hover: hover) {
      .chip:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
    }
    .chip:active { transform: scale(0.95); }
    .chip[aria-pressed="true"] {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary);
      font-weight: 600;
    }

    .link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 4px;
      transition: color var(--t-fast) ease, opacity var(--t-fast) ease;
    }
    @media (hover: hover) { .link:hover { color: var(--primary-hover); text-decoration: underline; text-underline-offset: 2px; } }

    /* ==========================================================================
       Hero counter
       ========================================================================== */
    .hero-num {
      font-family: var(--font-display);
      font-size: 76px;
      line-height: 0.82;
      letter-spacing: -0.015em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      transition: color var(--t-base) ease;
    }
    .hero-num[data-due="true"] { color: var(--accent); }

    /* ==========================================================================
       Rating buttons
       ========================================================================== */
    .rating {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 13px;
      border-radius: var(--r-lg);
      border: 1px solid var(--border);
      background: var(--surface-2);
      transition: background var(--t-fast) ease, border-color var(--t-fast) ease,
                  transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast) ease, color var(--t-fast) ease;
    }
    @media (hover: hover) {
      .rating:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
    }
    .rating:active { transform: scale(0.97); }
    .rating[aria-pressed="true"] {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-md);
    }
    .rating[aria-pressed="true"] .rating-days { color: var(--on-primary-muted); }
    .rating-label { font-size: 13px; font-weight: 600; }
    .rating-days { font-family: var(--font-mono); font-size: 11px; color: var(--muted); transition: color var(--t-fast) ease; }

    /* ==========================================================================
       Review card dismissal
       ========================================================================== */
    .review-slot {
      overflow: hidden;
      transition: max-height 380ms var(--ease-out), opacity 220ms ease,
                  transform 300ms var(--ease-out);
    }
    .review-slot[data-leaving="true"] {
      max-height: 0 !important;
      opacity: 0;
      transform: scale(0.97) translateY(-6px);
    }

    /* ==========================================================================
       Library rows
       ========================================================================== */
    .row {
      background: var(--surface);

      border-radius: var(--r-lg);

      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      padding: 0;
      color: var(--text);
      border-radius: var(--r-sm);

    }

    @media (hover: hover) { .row-toggle:hover .row-chevron { color: var(--muted); } }

    .row-danger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      flex: none;
      border: 0;
      border-radius: var(--r-sm);
      background: transparent;
      color: var(--faint);
      transition: background var(--t-fast) ease, color var(--t-fast) ease;
    }
    @media (hover: hover) { .row-danger:hover { background: var(--danger-soft); color: var(--danger); } }

    /* ==========================================================================
       Menu
       ========================================================================== */
    .menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 214px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transform-origin: top right;
      animation: pop-in 200ms var(--ease-out) both;

    }
    .menu-head { padding: 11px 13px; border-bottom: 1px solid var(--border); }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      text-align: left;
      padding: 11px 13px;
      background: none;
      border: 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      transition: background var(--t-fast) ease;
    }
    @media (hover: hover) { .menu-item:hover { background: var(--hover); } }

    .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 999px;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* ==========================================================================
       Code block
       ========================================================================== */
    .code {
      font-family: var(--font-mono);
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      color: var(--text);
      font-size: 12.5px;
      line-height: 1.65;
      padding: 13px;
      margin: 0;
      overflow-x: auto;
      white-space: pre;
      -webkit-overflow-scrolling: touch;
    }

    /* ==========================================================================
       Skeletons
       ========================================================================== */
    .sk {
      border-radius: 6px;
      background-color: var(--skeleton);
      background-image: linear-gradient(90deg, transparent 0%, var(--skeleton-sheen) 50%, transparent 100%);
      background-size: 180% 100%;
      background-repeat: no-repeat;
      animation: shimmer 1.5s linear infinite;
    }

    /* ==========================================================================
       Toasts
       ========================================================================== */
    .toast-layer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 9px;
      max-width: 26rem;
      width: fit-content;
      padding: 10px 15px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.4;
      pointer-events: auto;
      animation: toast-in 320ms var(--ease-spring) both;
      transition: opacity 220ms ease, transform 220ms var(--ease-out);
    }
    .toast[data-leaving="true"] { opacity: 0; transform: translateY(8px) scale(0.97); }
    .toast[data-variant="error"] { border-color: var(--danger); color: var(--danger); }
    .toast[data-variant="success"] .toast-icon { color: var(--success); }
    .toast-icon { flex: none; display: inline-flex; }

    /* ==========================================================================
       Misc
       ========================================================================== */
    .stack-2 > * + * { margin-top: 8px; }
    .stack-3 > * + * { margin-top: 12px; }
    .stack-4 > * + * { margin-top: 16px; }
    .stack-5 > * + * { margin-top: 20px; }
    .divider { height: 1px; background: var(--border); border: 0; margin: 0; }
    .breathe { animation: soft-pulse 1.6s ease-in-out infinite; }

    /* Spans both form columns, but a 1000px-wide submit button looks absurd, so
       it stops stretching once the form has actually split in two. */
    .add-submit { grid-column: 1 / -1; }
    @container (min-width: 860px) { .add-submit { justify-self: start; width: auto; min-width: 230px; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react-classic" data-type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    // ============================================================
    // CONFIG — replace with your own Supabase creds.
    // Both are safe to expose publicly (anon key is client-side by design).
    // Security is enforced by Row Level Security in the DB schema.
    // ============================================================
    const SUPABASE_URL = 'https://ipotfybjewmxmmdklniy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZqPnxAT_g8he81dVRvbRfw_SZZeFPI9';
    // ============================================================

    const { useState, useEffect, useRef, useCallback } = React;

    function showFatal(msg) {
      document.getElementById('root').innerHTML = `
        <div style="padding: 24px; max-width: 460px; margin: 15vh auto; font-family: var(--font-sans);">
          <div style="font-family: var(--font-display); font-size: 26px; color: var(--text); margin-bottom: 10px;">
