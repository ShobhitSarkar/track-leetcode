<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" id="theme-color-meta" content="#F4F3EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Recall" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Recall — Interval Prep</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:wght@400&display=swap" />

  <script>
    // Applied before first paint so a dark-theme user never sees a light flash.
    (function () {
      try {
        var stored = localStorage.getItem('recall_theme_v1');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Babel's stock "react" preset compiles JSX with the automatic runtime, which emits
    // `import { jsx } from "react/jsx-runtime"`. There is no bundler or import map on this
    // page, so that bare specifier cannot be resolved and the app never mounts (blank page).
    // React and ReactDOM are loaded as UMD globals above, so compile JSX to the classic
    // React.createElement form instead, which needs no module resolution at all.
    Babel.registerPreset('react-classic', {
      presets: [[Babel.availablePresets.react, { runtime: 'classic' }]],
    });
  </script>

  <style>
    /* ==========================================================================
       Design tokens. Every themed colour lives here as a custom property so that
       components can style their own hover / focus / active states in plain CSS
       instead of threading a palette object through props and patching styles
       from JS event handlers.
       ========================================================================== */
    :root {
      --bg: #F4F3EE;
      --surface: #FAF8F3;
      --surface-2: #FFFFFF;
      --inset: #EEEBE3;
      --text: #1A1A1D;
      --muted: #6F6A63;
      --faint: #A69E91;
      --border: #E3DED3;
      --border-strong: #D3CCBE;
      --accent: #A9741A;
      --accent-soft: rgba(169, 116, 26, 0.12);
      --primary: #1D3C6E;
      --primary-hover: #27508D;
      --primary-soft: rgba(29, 60, 110, 0.10);
      --success: #47682C;
      --success-soft: rgba(71, 104, 44, 0.12);
      --danger: #8B2E1E;
      --danger-soft: rgba(139, 46, 30, 0.10);
      --tabs-bg: #E8E4DA;
      --dot-struggle: #B8402E;
      --dot-solid: #7A7A2E;
      --on-primary: #FAF8F3;
      --on-primary-muted: #BCC8DC;
      --hover: rgba(26, 26, 29, 0.045);
      --press: rgba(26, 26, 29, 0.08);
      --shadow-sm: 0 1px 2px rgba(48, 40, 26, 0.05), 0 1px 1px rgba(48, 40, 26, 0.03);
      --shadow-md: 0 1px 2px rgba(48, 40, 26, 0.05), 0 10px 22px -12px rgba(48, 40, 26, 0.22);
      --shadow-lg: 0 2px 6px rgba(48, 40, 26, 0.06), 0 20px 40px -16px rgba(48, 40, 26, 0.28);
      --header-bg: rgba(244, 243, 238, 0.72);
      --ring: rgba(29, 60, 110, 0.40);
      --hatch: rgba(26, 26, 29, 0.045);
      --skeleton: rgba(26, 26, 29, 0.06);
      --skeleton-sheen: rgba(255, 255, 255, 0.55);
      --scrim: rgba(52, 44, 30, 0.24);
    }

    :root[data-theme="dark"] {
      --bg: #131312;
      --surface: #1C1C19;
      --surface-2: #232320;
      --inset: #191916;
      --text: #EDEBE4;
      --muted: #99938A;
      --faint: #635E57;
      --border: #2C2B27;
      --border-strong: #3B3934;
      --accent: #D9A040;
      --accent-soft: rgba(217, 160, 64, 0.14);
      --primary: #7BA0E0;
      --primary-hover: #93B2E9;
      --primary-soft: rgba(123, 160, 224, 0.14);
      --success: #8FB45C;
      --success-soft: rgba(143, 180, 92, 0.14);
      --danger: #D4705B;
      --danger-soft: rgba(212, 112, 91, 0.14);
      --tabs-bg: #232320;
      --dot-struggle: #D96450;
      --dot-solid: #B0AC56;
      --on-primary: #10161F;
      --on-primary-muted: #2E3E56;
      --hover: rgba(255, 255, 255, 0.05);
      --press: rgba(255, 255, 255, 0.09);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.42);
      --shadow-md: 0 2px 6px rgba(0, 0, 0, 0.38), 0 12px 28px -14px rgba(0, 0, 0, 0.7);
      --shadow-lg: 0 4px 12px rgba(0, 0, 0, 0.44), 0 24px 48px -18px rgba(0, 0, 0, 0.78);
      --header-bg: rgba(19, 19, 18, 0.72);
      --ring: rgba(123, 160, 224, 0.48);
      --hatch: rgba(255, 255, 255, 0.035);
      --skeleton: rgba(255, 255, 255, 0.05);
      --skeleton-sheen: rgba(255, 255, 255, 0.07);
      --scrim: rgba(0, 0, 0, 0.52);
    }

    :root {
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
      --t-fast: 130ms;
      --t-base: 210ms;
      --r-sm: 8px;
      --r-md: 10px;
      --r-lg: 14px;
      --r-xl: 18px;
      --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font-display: 'Instrument Serif', ui-serif, Georgia, 'Times New Roman', serif;
    }

    /* ==========================================================================
       Base
       ========================================================================== */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--bg); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-feature-settings: 'cv05' 1, 'cv11' 1, 'ss01' 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      text-rendering: optimizeLegibility;
    }

    input, button, textarea, select { font-family: inherit; color: inherit; }
    button { cursor: pointer; }

    ::selection { background: var(--primary-soft); color: var(--text); }

    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
      border-radius: var(--r-sm);
    }

    .mono { font-family: var(--font-mono); font-feature-settings: 'zero' 1; }
    .display { font-family: var(--font-display); font-weight: 400; }
    .tnum { font-variant-numeric: tabular-nums; }

    /* Thin, theme-aware scrollbars. The stock ones are the loudest element on a
       code block and read as unfinished. */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: content-box; }

    /* ==========================================================================
       Motion
       ========================================================================== */
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(-6px) scale(0.96); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes modal-in {
      from { opacity: 0; transform: translateY(14px) scale(0.965); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes modal-out {
      from { opacity: 1; transform: none; }
      to   { opacity: 0; transform: translateY(6px) scale(0.985); }
    }
    @keyframes sheet-in  { from { transform: translateY(100%); } to { transform: none; } }
    @keyframes sheet-out { from { transform: none; } to { transform: translateY(100%); } }
    @keyframes shimmer {
      from { background-position: -180% 0; }
      to   { background-position: 180% 0; }
    }
    @keyframes soft-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.45; }
    }

    .anim-rise { animation: rise 460ms var(--ease-out) both; }
    .anim-fade { animation: fade-in 320ms ease both; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       Layout shell

       Under 1024px: a stacked phone layout — sticky header, hero counter,
       segmented tabs, one column.
       At 1024px and up: a persistent left rail holds the identity, the counter
       and the navigation, and the whole remaining width belongs to content.
       ========================================================================== */
    .shell { min-height: 100vh; min-height: 100dvh; background: var(--bg); }
    .layout { display: flex; align-items: flex-start; min-height: 100vh; min-height: 100dvh; background: var(--bg); }
    .main { flex: 1 1 auto; min-width: 0; }

    .content {
      width: 100%;
      max-width: 34rem;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
    }
    @media (min-width: 640px) { .content { max-width: 40rem; } }
    @media (min-width: 840px) { .content { max-width: 54rem; padding-left: 28px; padding-right: 28px; } }
    @media (min-width: 1024px) { .content { max-width: 1560px; padding-left: 40px; padding-right: 40px; } }

    /* Content grids size themselves against this element, not the viewport, so
       the column count stays right whether or not the rail is taking 272px. */
    .view-area { container-type: inline-size; }

    /* Two columns is the ceiling for review cards. They hold code and a rating
       grid, so a third column costs readability, and every extra column makes
       the ragged bottom edge of a mixed-height card grid worse. */
    .grid-review {
      display: grid;
      gap: 14px;
      align-items: start;
      grid-template-columns: minmax(0, 1fr);
      max-width: 1200px;
    }
    @container (min-width: 760px) { .grid-review { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    .grid-rows { display: grid; gap: 8px; align-items: start; grid-template-columns: minmax(0, 1fr); }
    @container (min-width: 700px)  { .grid-rows { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @container (min-width: 1200px) { .grid-rows { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

    /* A form does not benefit from unlimited width, so it splits into two
       columns and then stops growing. */
    .grid-add { display: grid; gap: 22px; align-items: start; grid-template-columns: minmax(0, 1fr); max-width: 1080px; }
    @container (min-width: 860px) { .grid-add { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px; } }

    .rail {
      display: none;
      flex: none;
      width: 272px;
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      gap: 24px;
      padding: 26px 22px calc(22px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-right: 1px solid var(--border);
    }
    @media (min-width: 1024px) { .rail { display: flex; } }
    .rail .hero-num { font-size: 70px; }

    .rail-nav { display: flex; flex-direction: column; gap: 3px; }
    .rail-nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: var(--r-md);
      background: transparent;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 500;
      text-align: left;
      transition: background var(--t-fast) ease, color var(--t-fast) ease;
    }
    @media (hover: hover) { .rail-nav-btn:hover { background: var(--hover); color: var(--text); } }
    .rail-nav-btn[aria-current="page"] {
      background: var(--tabs-bg);
      color: var(--text);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .rail-nav-count {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
      color: var(--faint);
    }
    .rail-nav-btn[aria-current="page"] .rail-nav-count { color: var(--muted); }
    .rail-nav-count[data-due="true"] { color: var(--accent); font-weight: 600; }

    .rail-foot {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .rail-user { display: flex; align-items: center; gap: 9px; min-width: 0; }

    .view-head { margin-bottom: 26px; }
    .view-title { font-family: var(--font-display); font-size: 44px; line-height: 1.08; letter-spacing: -0.015em; }
    @media (min-width: 1400px) { .view-title { font-size: 50px; } }
    .view-sub { color: var(--muted); font-size: 14.5px; margin: 8px 0 0; }

    /* Split sign-in. A login form stretched across a desktop is worse, not
       better, so the width goes to a brand panel and the form stays readable. */
    .auth-brand { display: none; }
    @media (min-width: 1024px) {
      .auth-split { display: flex; min-height: 100vh; min-height: 100dvh; }
      .auth-brand {
        display: flex;
        flex: 1 1 50%;
        flex-direction: column;
        justify-content: space-between;
        gap: 40px;
        padding: 44px;
        background-color: var(--surface);
        background-image: repeating-linear-gradient(45deg, var(--hatch) 0 1.5px, transparent 1.5px 11px);
        border-right: 1px solid var(--border);
      }
      .auth-pane {
        flex: 1 1 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 44px;
      }
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding-top: env(safe-area-inset-top);
      background: var(--header-bg);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid transparent;
      transition: border-color var(--t-base) ease, box-shadow var(--t-base) ease;
    }
    .app-header[data-scrolled="true"] {
      border-bottom-color: var(--border);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.01);
    }
    .app-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 60px;
    }

    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }
    .wordmark-name {
      font-family: var(--font-display);
      font-size: 30px;
      line-height: 1;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .wordmark-sub {
      font-size: 9px;
      letter-spacing: 0.18em;
      font-weight: 500;
      color: var(--faint);
      white-space: nowrap;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.16em;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
    }

    .page-pad { padding-top: 28px; padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
    @media (min-width: 1024px) { .page-pad { padding-top: 38px; padding-bottom: 64px; } }

    /* ==========================================================================
       Buttons
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid transparent;
      border-radius: var(--r-md);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      padding: 9px 14px;
      background: transparent;
      color: var(--text);
      transition: background var(--t-fast) ease, color var(--t-fast) ease,
                  border-color var(--t-fast) ease, transform var(--t-fast) var(--ease-out),
                  box-shadow var(--t-fast) ease, opacity var(--t-fast) ease;
    }
    .btn:active:not(:disabled) { transform: scale(0.975); }
    .btn:disabled { cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
    }
    @media (hover: hover) {
      .btn-primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--shadow-md); }
    }
    .btn-primary:disabled { background: var(--tabs-bg); color: var(--faint); box-shadow: none; }

    .btn-quiet {
      background: var(--tabs-bg);
      color: var(--text);
    }
    @media (hover: hover) { .btn-quiet:hover:not(:disabled) { background: var(--border); } }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }
    @media (hover: hover) {
      .btn-ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); border-color: var(--border-strong); }
    }

    .btn-danger { background: var(--danger); color: #FFF6F3; font-weight: 600; }
    @media (hover: hover) { .btn-danger:hover { filter: brightness(1.08); } }

    .btn-lg { padding: 14px 18px; font-size: 15px; border-radius: var(--r-lg); width: 100%; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: var(--r-sm); }

    /* Square icon buttons in the header. */
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--muted);
      transition: background var(--t-fast) ease, color var(--t-fast) ease,
                  border-color var(--t-fast) ease, transform var(--t-fast) var(--ease-out);
    }
    @media (hover: hover) {
      .icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
    }
    .icon-btn:active { transform: scale(0.94); }

    .icon-swap { display: inline-flex; animation: pop-in 260ms var(--ease-spring) both; }

    /* ==========================================================================
       Surfaces
       ========================================================================== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-sm);
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
    }
    .inset {
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
    }
    .dashed { border-style: dashed; border-color: var(--border-strong); }

    /* The face-down side of a flashcard. Hatching makes "there is something
       behind this" legible at a glance, without a literal card-flip. */
    .card-back {
      background-color: var(--inset);
      background-image: repeating-linear-gradient(
        45deg, var(--hatch) 0 1.5px, transparent 1.5px 9px
      );
    }

    /* ==========================================================================
       Fields
       ========================================================================== */
    .field {
      display: block;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      color: var(--text);
      padding: 11px 13px;
      font-size: 14px;
      line-height: 1.55;
      transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, background var(--t-fast) ease;
    }
    .field::placeholder { color: var(--faint); }
    .field:hover:not(:focus) { border-color: var(--border-strong); }
    .field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
      outline: none;
    }
    .field-inset { background: var(--inset); }
    .field-lg { padding: 13px 15px; font-size: 15px; border-radius: var(--r-lg); }
    textarea.field { resize: vertical; min-height: 44px; }
    textarea.field.mono { font-size: 12.5px; line-height: 1.6; }

    .field-label {
      display: block;
      margin-bottom: 7px;
      font-size: 10px;
      letter-spacing: 0.14em;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
    }
    .field-hint { margin-top: 6px; font-size: 11px; color: var(--faint); line-height: 1.5; }

    /* iOS zooms the viewport when a focused field is under 16px. Zoom is left
       enabled for accessibility, so the fields grow on touch devices instead. */
    @media (pointer: coarse) {
      .field, .field-lg { font-size: 16px; }
      textarea.field.mono { font-size: 14px; }
    }

    /* ==========================================================================
       Segmented control
       ========================================================================== */
    .seg {
      position: relative;
      display: flex;
      padding: 4px;
      border-radius: var(--r-lg);
      background: var(--tabs-bg);
      border: 1px solid var(--border);
    }
    .seg-thumb {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc((100% - 8px) / 3);
      height: calc(100% - 8px);
      border-radius: var(--r-md);
      background: var(--surface-2);
      box-shadow: var(--shadow-sm);
      transition: transform 380ms var(--ease-out);
    }
    .seg-btn {
      position: relative;
      z-index: 1;
      flex: 1 1 0;
      padding: 9px 0;
      border: 0;
      background: none;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--r-md);
      color: var(--muted);
      transition: color var(--t-base) ease;
    }
    .seg-btn[aria-selected="true"] { color: var(--text); font-weight: 600; }
    @media (hover: hover) { .seg-btn:hover { color: var(--text); } }

    /* ==========================================================================
       Pills, chips, dots
       ========================================================================== */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.5;
      background: var(--tabs-bg);
      color: var(--muted);
      white-space: nowrap;
    }
    .pill-accent { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .pill-success { background: var(--success-soft); color: var(--success); font-weight: 600; }
    .pill-outline { background: transparent; border: 1px solid var(--border); }

    .dot { width: 6px; height: 6px; border-radius: 999px; flex: none; }

    .chip {
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1;
      transition: background var(--t-fast) ease, color var(--t-fast) ease,
                  border-color var(--t-fast) ease, transform var(--t-fast) var(--ease-out);
    }
    @media (hover: hover) {
      .chip:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
    }
    .chip:active { transform: scale(0.95); }
    .chip[aria-pressed="true"] {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary);
      font-weight: 600;
    }

    .link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 4px;
      transition: color var(--t-fast) ease, opacity var(--t-fast) ease;
    }
    @media (hover: hover) { .link:hover { color: var(--primary-hover); text-decoration: underline; text-underline-offset: 2px; } }

    /* ==========================================================================
       Hero counter
       ========================================================================== */
    .hero-num {
      font-family: var(--font-display);
      font-size: 88px;
      line-height: 0.82;
      letter-spacing: -0.015em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      transition: color var(--t-base) ease;
    }
    .hero-num[data-due="true"] { color: var(--accent); }

    /* ==========================================================================
       Rating buttons
       ========================================================================== */
    .rating {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 13px;
      border-radius: var(--r-lg);
      border: 1px solid var(--border);
      background: var(--surface-2);
      transition: background var(--t-fast) ease, border-color var(--t-fast) ease,
                  transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast) ease, color var(--t-fast) ease;
    }
    @media (hover: hover) {
      .rating:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
    }
    .rating:active { transform: scale(0.97); }
    .rating[aria-pressed="true"] {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-md);
    }
    .rating[aria-pressed="true"] .rating-days { color: var(--on-primary-muted); }
    .rating-label { font-size: 13px; font-weight: 600; }
    .rating-days { font-family: var(--font-mono); font-size: 11px; color: var(--muted); transition: color var(--t-fast) ease; }

    /* ==========================================================================
       Review card dismissal
       ========================================================================== */
    .review-slot {
      overflow: hidden;
      transition: max-height 380ms var(--ease-out), opacity 220ms ease,
                  transform 300ms var(--ease-out);
    }
    .review-slot[data-leaving="true"] {
      max-height: 0 !important;
      opacity: 0;
      transform: scale(0.97) translateY(-6px);
    }

    /* ==========================================================================
       Library rows
       ========================================================================== */
    .row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease,
                  background var(--t-fast) ease;
    }
    @media (hover: hover) {
      .row:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
    }
    .row[data-open="true"] { box-shadow: var(--shadow-md); border-color: var(--border-strong); }

    .row-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      padding: 0;
      color: var(--text);
      border-radius: var(--r-sm);
    }
    .row-chevron {
      flex: none;
      color: var(--faint);
      transition: transform var(--t-base) var(--ease-out), color var(--t-fast) ease;
    }
    @media (hover: hover) {
      .row-toggle:hover .row-chevron { color: var(--muted); transform: translateX(2px); }
    }

    .row-danger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      flex: none;
      border: 0;
      border-radius: var(--r-sm);
      background: transparent;
      color: var(--faint);
      transition: background var(--t-fast) ease, color var(--t-fast) ease;
    }
    @media (hover: hover) { .row-danger:hover { background: var(--danger-soft); color: var(--danger); } }

    /* ==========================================================================
       Menu
       ========================================================================== */
    .menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 214px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transform-origin: top right;
      animation: pop-in 200ms var(--ease-out) both;
      z-index: 50;
    }
    .menu-head { padding: 11px 13px; border-bottom: 1px solid var(--border); }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      text-align: left;
      padding: 11px 13px;
      background: none;
      border: 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      transition: background var(--t-fast) ease;
    }
    @media (hover: hover) { .menu-item:hover { background: var(--hover); } }

    .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 999px;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* ==========================================================================
       Code block
       ========================================================================== */
    .code {
      font-family: var(--font-mono);
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      color: var(--text);
      font-size: 12.5px;
      line-height: 1.65;
      padding: 13px;
      margin: 0;
      overflow-x: auto;
      white-space: pre;
      -webkit-overflow-scrolling: touch;
    }

    /* ==========================================================================
       Skeletons
       ========================================================================== */
    .sk {
      border-radius: 6px;
      background-color: var(--skeleton);
      background-image: linear-gradient(90deg, transparent 0%, var(--skeleton-sheen) 50%, transparent 100%);
      background-size: 180% 100%;
      background-repeat: no-repeat;
      animation: shimmer 1.5s linear infinite;
    }

    /* ==========================================================================
       Modal

       Rendered through a portal to document.body. It has to be: `.view-area`
       sets `container-type`, which makes that element a containing block for
       fixed-position descendants, so a modal rendered in place would be
       trapped inside the content column instead of covering the viewport.
       ========================================================================== */
    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--scrim);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      backdrop-filter: blur(10px) saturate(140%);
      animation: fade-in 220ms ease both;
    }
    .modal-layer[data-leaving="true"] { animation: fade-out 190ms ease both; }

    .modal {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 640px;
      max-height: min(84vh, 820px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: modal-in 320ms var(--ease-out) both;
    }
    .modal-layer[data-leaving="true"] .modal { animation: modal-out 190ms ease both; }
    @supports (max-height: 84dvh) { .modal { max-height: min(84dvh, 820px); } }

    .modal-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 18px 18px 15px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
    }
    .modal-body { padding: 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    .sheet-grip { display: none; }

    /* On a phone a centred dialog floating in the middle reads worse than a
       sheet that comes up from the thumb, so it becomes one. */
    @media (max-width: 639px) {
      .modal-layer { padding: 0; align-items: flex-end; }
      .modal {
        max-width: none;
        max-height: 90vh;
        border-radius: var(--r-xl) var(--r-xl) 0 0;
        border-bottom: 0;
        animation: sheet-in 340ms var(--ease-out) both;
      }
      @supports (max-height: 90dvh) { .modal { max-height: 90dvh; } }
      .modal-layer[data-leaving="true"] .modal { animation: sheet-out 210ms ease both; }
      .modal-body { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
      .sheet-grip {
        display: block;
        width: 38px;
        height: 4px;
        flex: none;
        margin: 9px auto 0;
        border-radius: 999px;
        background: var(--border-strong);
      }
    }

    /* ==========================================================================
       Toasts
       ========================================================================== */
    .toast-layer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 9px;
      max-width: 26rem;
      width: fit-content;
      padding: 10px 15px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.4;
      pointer-events: auto;
      animation: toast-in 320ms var(--ease-spring) both;
      transition: opacity 220ms ease, transform 220ms var(--ease-out);
    }
    .toast[data-leaving="true"] { opacity: 0; transform: translateY(8px) scale(0.97); }
    .toast[data-variant="error"] { border-color: var(--danger); color: var(--danger); }
    .toast[data-variant="success"] .toast-icon { color: var(--success); }
    .toast-icon { flex: none; display: inline-flex; }

    /* ==========================================================================
       Misc
       ========================================================================== */
    .stack-2 > * + * { margin-top: 8px; }
    .stack-3 > * + * { margin-top: 12px; }
    .stack-4 > * + * { margin-top: 16px; }
    .stack-5 > * + * { margin-top: 20px; }
    .divider { height: 1px; background: var(--border); border: 0; margin: 0; }
    .breathe { animation: soft-pulse 1.6s ease-in-out infinite; }

    /* Spans both form columns, but a 1000px-wide submit button looks absurd, so
       it stops stretching once the form has actually split in two. */
    .add-submit { grid-column: 1 / -1; }
    @container (min-width: 860px) { .add-submit { justify-self: start; width: auto; min-width: 230px; } }

    /* ==========================================================================
       Notes — freeform notetaking + generated flashcards
       ========================================================================== */
    .notes-shell {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      align-items: start;
    }
    @container (max-width: 780px) {
      .notes-shell { grid-template-columns: 1fr; }
    }

    .notes-rail {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
      padding: 12px 10px;
      position: sticky;
      top: 96px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }
    .notes-rail-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 6px 10px;
      gap: 8px;
    }
    .notes-list { display: flex; flex-direction: column; gap: 2px; }
    .notes-item {
      display: flex; flex-direction: column; gap: 4px;
      padding: 10px 10px;
      background: transparent;
      border: none;
      border-radius: var(--r-md);
      cursor: pointer;
      text-align: left;
      transition: background 130ms var(--ease-out);
      position: relative;
    }
    .notes-item:hover { background: var(--hover); }
    .notes-item[data-active="true"] {
      background: var(--surface-2);
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .notes-item[data-active="true"]::before {
      content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px;
      background: var(--primary); border-radius: 999px;
    }
    .notes-item-title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .notes-item-meta {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 10px; color: var(--muted);
    }

    .note-workspace {
      display: flex; flex-direction: column; gap: 16px;
      min-width: 0;
    }
    .note-head { display: flex; flex-direction: column; gap: 8px; }
    .note-title-input {
      background: transparent; border: none; outline: none;
      font-family: var(--font-display); font-size: 34px; line-height: 1.15;
      letter-spacing: -0.015em; color: var(--text); width: 100%;
      padding: 4px 0;
    }
    .note-title-input::placeholder { color: var(--faint); }
    .note-sub { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .note-topic-input {
      background: var(--inset); border: 1px solid transparent;
      border-radius: 999px; padding: 4px 10px;
      font-size: 11px; color: var(--accent); outline: none; min-width: 220px;
      transition: border-color 130ms;
    }
    .note-topic-input:focus { border-color: var(--accent); background: var(--surface-2); }
    .note-topic-input::placeholder { color: var(--faint); }

    .note-tabs {
      display: flex; align-items: center; gap: 4px;
      background: var(--tabs-bg); padding: 4px;
      border-radius: var(--r-md);
    }
    .note-tab {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 8px;
      font-size: 12.5px; font-weight: 500; color: var(--muted);
      background: transparent; border: none; cursor: pointer;
      transition: color 130ms, background 130ms;
    }
    .note-tab:hover { color: var(--text); }
    .note-tab[data-active="true"] {
      background: var(--surface-2); color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .note-tab-count {
      font-family: var(--font-mono); font-size: 10px;
      background: var(--inset); color: var(--muted);
      padding: 1px 6px; border-radius: 999px; min-width: 18px; text-align: center;
    }
    .note-tab-count[data-hot="true"] { background: var(--accent-soft); color: var(--accent); }

    .note-body-editor {
      width: 100%; min-height: 320px; resize: vertical;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: 20px 22px;
      font-family: var(--font-sans); font-size: 14.5px; line-height: 1.65;
      color: var(--text); outline: none;
      box-shadow: var(--shadow-sm);
      transition: border-color 130ms, box-shadow 130ms;
    }
    .note-body-editor:focus { border-color: var(--border-strong); }
    .note-body-editor::placeholder { color: var(--faint); }

    .generate-cta {
      margin-top: 16px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--surface-2), var(--surface));
      border-radius: var(--r-lg);

      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
    }

    .cards-summary {

      gap: 10px; margin-bottom: 16px;
    }
    .stat-tile {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-md); padding: 12px 14px;
    }
    .stat-tile .k {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted);
    }
    .stat-tile .v {
      font-family: var(--font-display); font-size: 28px; letter-spacing: -0.01em; margin-top: 2px;
    }
    .stat-tile.accent .v { color: var(--primary); }

    .quiz-stage {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 26px 28px;
      box-shadow: var(--shadow-md);
      display: flex; flex-direction: column; gap: 18px;
      position: relative; overflow: hidden;
    }
    .quiz-stage::after {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(1200px 400px at 20% -10%, var(--accent-soft), transparent 60%),
        radial-gradient(800px 300px at 100% 110%, var(--primary-soft), transparent 60%);
      pointer-events: none;
    }
    .quiz-stage > * { position: relative; z-index: 1; }
    .quiz-progress {
      display: flex; align-items: center; gap: 14px;
      font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    }
    .progress-track {
      flex: 1; height: 3px; background: var(--inset); border-radius: 999px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px; transition: width 320ms var(--ease-out);
    }
    .quiz-card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: 24px 26px;
      display: flex; flex-direction: column; gap: 16px; min-height: 180px;
    }
    .quiz-question {

    /* "Start a note" toggle inside the Add view */
    .start-note-toggle {
      grid-column: 1 / -1;
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: border-color 130ms, background 130ms;
    }
    .start-note-toggle:hover { border-color: var(--border-strong); }

      border-color: var(--accent);

    .start-note-toggle input {
      margin-top: 3px; accent-color: var(--accent);
      width: 15px; height: 15px; flex: none;
    }
    .start-note-body { display: flex; flex-direction: column; gap: 3px; }
    .start-note-title {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: var(--text);
    }
    .start-note-sub {
      font-size: 11.5px; line-height: 1.5; color: var(--muted);
    }

    /* ==========================================================================
       Drills — PR review, debugging, system design
       ========================================================================== */
    .drill-kinds {
      display: grid; gap: 10px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    @container (max-width: 720px) {
      .drill-kinds { grid-template-columns: 1fr; }
    }
    .drill-kind {
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      text-align: left; padding: 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
      transition: border-color 130ms, background 130ms, transform 130ms var(--ease-out);
    }
    .drill-kind:hover { border-color: var(--border-strong); }
    .drill-kind:active { transform: scale(0.99); }
    .drill-kind[data-active="true"] {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft), var(--shadow-sm);
      background: var(--surface-2);
    }
    .drill-kind-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 999px;
      background: var(--tabs-bg); color: var(--muted); margin-bottom: 4px;
    }
    .drill-kind[data-active="true"] .drill-kind-icon { background: var(--primary-soft); color: var(--primary); }
    .drill-kind-title { font-family: var(--font-display); font-size: 22px; line-height: 1.15; }
    .drill-kind-blurb { font-size: 12.5px; line-height: 1.55; color: var(--muted); }
    .drill-kind-meta { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--faint); margin-top: 2px; }

    .sd-catalog {
      display: grid; gap: 6px;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    }
    .sd-pick {
      display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
      text-align: left; padding: 10px 12px;
      background: var(--inset); border: 1px solid transparent; border-radius: var(--r-md);
      transition: border-color 130ms, background 130ms;
    }
    .sd-pick:hover { border-color: var(--border-strong); }
    .sd-pick[data-active="true"] { background: var(--surface-2); border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
    .sd-pick-title { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-transform: capitalize; }
    .sd-pick-tags { font-size: 11px; color: var(--muted); }

    .drill-generating {
      display: flex; align-items: center; gap: 18px; padding: 24px;
    }

    // Supabase call helper — retries once on a PostgREST schema-cache miss.

    // few minutes, or immediately when someone clicks Reload schema in the Supabase

    // matches "intermittent cache errors" exactly.

    // retry also fails, humaniseSbError rewrites the message so the user knows the

    // ============================================================
    const SCHEMA_CACHE_RE = /schema cache/i;

    // failed" (older browsers) — the whole family of network-drop TypeErrors that
    // browsers throw synchronously out of fetch(). Supabase-js doesn't catch them,
    // so without runSb they'd propagate as uncaught promise rejections.
    const NETWORK_ERR_RE = /failed to fetch|network|load failed|networkerror/i;

    // "token used before issued" — this fires when a browser tab wakes from sleep,
    // a laptop's clock was adjusted, or the auth vs. API server clocks briefly
    // drift. A short sleep plus a refreshSession() almost always clears it,
    // because the new token is stamped with the auth server's current time.
    const JWT_FUTURE_RE = /token used before issued|issued in the future|clock skew|iat is in the future/i;
    const isSchemaCacheError = (err) => !!err && SCHEMA_CACHE_RE.test(err.message || '');
    const isNetworkError = (err) => !!err && (err.name === 'TypeError' || NETWORK_ERR_RE.test(err.message || ''));
    const isJwtFutureError = (err) => !!err && JWT_FUTURE_RE.test(err.message || '');
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    // Every Supabase call goes through this. It never throws — a thrown error
    // (network drop, aborted fetch, undefined return) is caught and reshaped into
    // the standard `{ data, error }` result so callers can always destructure.
    // Retries once with a small delay for three transient classes: PostgREST
    // schema cache misses right after a migration, network TypeErrors that clear
    // once the connection recovers, and "token used before issued" JWT errors
    // that clear once the auth server's clock catches up (a forced session
    // refresh usually gives us a token stamped with the current server time).
    const runSb = async (fn) => {
      const attempt = async () => {
        try {
          const r = await fn();
          if (!r || typeof r !== 'object') {
            return { data: null, error: { message: 'Empty response from Supabase' } };
          }
          return r;
        } catch (err) {
          return { data: null, error: err || { message: 'Unknown error' } };
        }
      };
      let result = await attempt();
      if (isJwtFutureError(result.error)) {
        await sleep(1500);
        try { await sb.auth.refreshSession(); } catch (_) { /* refresh failure falls through to retry */ }
        result = await attempt();
      } else if (isSchemaCacheError(result.error) || isNetworkError(result.error)) {
        await sleep(900);
        result = await attempt();
      }
      return result;
    };

      if (isSchemaCacheError(err)) {
        return "Supabase's schema cache is stale — open the Supabase dashboard → Database → API and click Reload schema, then try again.";
      }
      if (isNetworkError(err)) {
        return "Network error — the request couldn't reach Supabase. Check your connection and try again.";
      }
      if (isJwtFutureError(err)) {

      }

    const WIDE = '(min-width: 1024px)';
    function useMediaQuery(query) {
      const [matches, setMatches] = useState(() => window.matchMedia(query).matches);
      useEffect(() => {
        const mql = window.matchMedia(query);
        const onChange = (e) => setMatches(e.matches);
        setMatches(mql.matches);
        mql.addEventListener('change', onChange);
        return () => mql.removeEventListener('change', onChange);
      }, [query]);
      return matches;
    }

    // ============================================================
    // Toasts — replace blocking window.alert() for failures, and give
    // silent writes (rate / save / delete) a visible confirmation.
    // ============================================================
    function useToasts() {
      const [toasts, setToasts] = useState([]);
      const timers = useRef([]);

      useEffect(() => () => timers.current.forEach(clearTimeout), []);

      const notify = useCallback((message, variant = 'info') => {
        const id = `t_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        const life = variant === 'error' ? 5200 : 2600;
        setToasts((t) => [...t, { id, message, variant, leaving: false }].slice(-3));
        timers.current.push(setTimeout(() => {
          setToasts((t) => t.map((x) => (x.id === id ? { ...x, leaving: true } : x)));
        }, life));
        timers.current.push(setTimeout(() => {
          setToasts((t) => t.filter((x) => x.id !== id));
        }, life + 260));
      }, []);

      const dismiss = useCallback((id) => setToasts((t) => t.filter((x) => x.id !== id)), []);
      return { toasts, notify, dismiss };
    }

    // Centred dialog (bottom sheet on phones) for content that would otherwise
    // expand in place. Owns its own exit animation, so callers just flip the
    // state that renders it and the close paths all run through `close()`.
    function Modal({ title, meta, onClose, children }) {
      const [leaving, setLeaving] = useState(false);
      const dialogRef = useRef(null);
      const restoreRef = useRef(null);
      const closedRef = useRef(false);
      const titleId = 'modal-title';

      const close = useCallback(() => {
        if (closedRef.current) return;
        closedRef.current = true;
        setLeaving(true);
        setTimeout(onClose, 200);
      }, [onClose]);

      // Lock the page behind the dialog, and hand focus back to whatever opened
      // it on the way out.
      useEffect(() => {
        restoreRef.current = document.activeElement;
        const body = document.body;
        const prevOverflow = body.style.overflow;
        const prevPadding = body.style.paddingRight;
        const gap = window.innerWidth - document.documentElement.clientWidth;
        body.style.overflow = 'hidden';
        if (gap > 0) body.style.paddingRight = `${gap}px`;
        if (dialogRef.current) dialogRef.current.focus();
        return () => {
          body.style.overflow = prevOverflow;
          body.style.paddingRight = prevPadding;
          const el = restoreRef.current;
          if (el && typeof el.focus === 'function') el.focus();
        };
      }, []);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'Escape') { close(); return; }
          if (e.key !== 'Tab' || !dialogRef.current) return;
          const focusable = dialogRef.current.querySelectorAll(
            'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])'
          );
          if (focusable.length === 0) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [close]);

      return ReactDOM.createPortal(
        <div className="modal-layer" data-leaving={leaving}
          onMouseDown={(e) => { if (e.target === e.currentTarget) close(); }}>
          <div className="modal" role="dialog" aria-modal="true" aria-labelledby={titleId}
            ref={dialogRef} tabIndex={-1}>
            <div className="sheet-grip" />
            <div className="modal-head">
              <div style={{ minWidth: 0, flex: 1 }}>
                <div id={titleId} className="mono modal-title">{title}</div>
                {meta}
              </div>
              <button onClick={close} className="icon-btn" aria-label="Close" style={{ flex: 'none' }}>
                <IconX size={15} />
              </button>
            </div>
            <div className="modal-body">{children}</div>
          </div>
        </div>,
        document.body
      );
    }

    function ToastLayer({ toasts, onDismiss }) {
      if (toasts.length === 0) return null;
      return (
        <div className="toast-layer" role="status" aria-live="polite">
          {toasts.map((t) => (
            <div key={t.id} className="toast" data-variant={t.variant} data-leaving={t.leaving}
              onClick={() => onDismiss(t.id)}>
              <span className="toast-icon">
                {t.variant === 'error' ? <IconAlert size={14} /> : <IconCheck size={14} />}
              </span>
              <span>{t.message}</span>
            </div>
          ))}
        </div>
      );
    }

    // ============================================================
    // Main
    // ============================================================
    function MainApp({ user, theme, onToggleTheme }) {
      const isWide = useMediaQuery(WIDE);
      const [problems, setProblems] = useState([]);
      // Map<slug, skipped_at ISO string>. Kept as a Map (not a Set) so the engine can
      // decide whether a skip is still relevant based on when it was made vs. when
      // the user last practiced one of that problem's patterns.
      const [skips, setSkips] = useState(() => new Map());
      const [notes, setNotes] = useState([]);
      const [cards, setCards] = useState([]);
      const [selectedNoteId, setSelectedNoteId] = useState(null);
      const [view, setView] = useState('today');
      const [addPrefill, setAddPrefill] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [menuOpen, setMenuOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);
      // Cached LLM-generated suggestions for the Discover view. `state` is
      // 'idle' | 'loading' | 'ready' | 'error'; `picks` is the last successful
      // batch. We cache so switching tabs doesn't re-hit the model on every
      // visit, but the user can force a fresh batch with the Refresh button.
      const [aiSuggest, setAiSuggest] = useState({ state: 'idle', picks: [] });
      const [drills, setDrills] = useState([]);
      const [openDrillId, setOpenDrillId] = useState(null);
      // { kind, startedAt } while a drill is being generated. Lives here rather
      // than in the Drills view so leaving the tab mid-generation is harmless.
      const [drillGen, setDrillGen] = useState(null);
      const [gradingIds, setGradingIds] = useState(() => new Set());
      const menuRef = useRef(null);
      const { toasts, notify, dismiss } = useToasts();

      useEffect(() => { fetchProblems(); fetchSkips(); fetchNotes(); fetchCards(); fetchDrills(); }, []);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 4);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      // A menu that only closes by clicking its own trigger again is the kind of
      // papercut that makes an app feel unfinished.
      useEffect(() => {
        if (!menuOpen) return;
        const onDown = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
        const onKey = (e) => { if (e.key === 'Escape') setMenuOpen(false); };
        document.addEventListener('mousedown', onDown);
        document.addEventListener('touchstart', onDown);
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('mousedown', onDown);
          document.removeEventListener('touchstart', onDown);
          document.removeEventListener('keydown', onKey);
        };
      }, [menuOpen]);

      const fetchProblems = async () => {
        setLoading(true); setError(null);
        const { data, error } = await runSb(() =>
          sb.from('problems').select('*').order('next_review', { ascending: true }));
        if (error) setError(humaniseSbError(error));
        else setProblems(data || []);
        setLoading(false);
      };

      // Skipped Discover suggestions. Kept in a separate table (not the problems row)
      // because a skip is a *preference*, not a solve — merging the two would confuse
      // both the review queue and the mastery signal the recommender reads.
      // A pre-migration failure (no table yet) is swallowed silently so the app keeps
      // running for users who haven't re-run the schema — but schema-cache errors are
      // logged so a debugger can see why skips look empty during the reload window.
      const fetchSkips = async () => {
        const { data, error } = await runSb(() =>
          sb.from('skipped_suggestions').select('slug, skipped_at'));
        if (error) {
          if (isSchemaCacheError(error)) console.warn('[skips] schema cache stale; retry later', error);
          return;
        }
        const map = new Map();
        for (const row of (data || [])) map.set(row.slug, row.skipped_at);
        setSkips(map);
      };

      const skipSuggestion = async (name) => {
        const slug = slugify(name);
        const now = new Date().toISOString();
        const prev = skips;
        const next = new Map(prev); next.set(slug, now);
        setSkips(next);
        const { error } = await runSb(() => sb.from('skipped_suggestions')
          .upsert({ user_id: user.id, slug, skipped_at: now }, { onConflict: 'user_id,slug' }));
        if (error) { setSkips(prev); notify('Failed to skip: ' + humaniseSbError(error), 'error'); }
      };

      const resetSkips = async () => {
        const prev = skips;
        setSkips(new Map());
        const { error } = await runSb(() =>
          sb.from('skipped_suggestions').delete().eq('user_id', user.id));
        if (error) { setSkips(prev); notify('Failed to reset: ' + humaniseSbError(error), 'error'); }
        else notify(`Restored ${prev.size} skipped ${prev.size === 1 ? 'suggestion' : 'suggestions'}`, 'success');
      };

      // Compact snapshot the LLM needs to recommend well without us shipping the
      // whole problems table upstream. Mirrors the signal the deterministic
      // engine already computes (pattern stats, difficulty comfort), plus the
      // recent-solves list and the block lists (solved + skipped) so the model
      // doesn't hand back things the user has already seen.
      const buildSuggestionSnapshot = () => {
        const { patternStats, difficultyCleared } = analyseHistory(PROBLEM_CATALOG, problems);
        const totalCleared = difficultyCleared.Easy + difficultyCleared.Medium + difficultyCleared.Hard;
        const comfort = totalCleared === 0
          ? 'Easy'
          : difficultyCleared.Hard >= 3 ? 'Hard'
          : difficultyCleared.Medium >= 3 ? 'Medium'
          : 'Easy';
        const statsArr = [...patternStats.entries()].map(([pattern, s]) => ({
          pattern, count: s.count, avgRating: s.avgRating,
          strongCount: s.strongCount, struggling: s.struggling,
        }));
        // Recent-first, deduped by name.
        const recentNames = [];
        const seenRecent = new Set();
        const sorted = [...problems].sort((a, b) => {
          const ad = (a.history && a.history[a.history.length - 1] && a.history[a.history.length - 1].date) || a.created_at || '';
          const bd = (b.history && b.history[b.history.length - 1] && b.history[b.history.length - 1].date) || b.created_at || '';
          return bd.localeCompare(ad);
        });
        for (const p of sorted) {
          if (recentNames.length >= 15) break;
          if (seenRecent.has(p.name)) continue;
          seenRecent.add(p.name);
          recentNames.push(p.name);
        }
        const solvedNames = problems.map((p) => p.name);
        // Send skipped as names when we can (looking up the catalog by slug),
        // otherwise the slug itself — either way the server slug-normalises
        // before blocking so the model can't hand a skipped item back.
        const bySlug = new Map(PROBLEM_CATALOG.map((c) => [slugify(c.name), c.name]));
        const skippedNames = [...skips.keys()].map((slug) => bySlug.get(slug) || slug);
        return {
          solved: solvedNames,
          skipped: skippedNames,
          recent: recentNames,
          patternStats: statsArr,
          comfort,
          count: 5,
        };
      };

      // Loads a fresh batch of LLM picks and stashes them in state. `force`
      // means the user asked for a refresh (button press) — we invalidate the
      // cache; otherwise we skip if we already have a batch on hand.
      const loadAiSuggestions = async ({ force = false } = {}) => {
        if (!force && aiSuggest.state === 'ready') return;
        if (aiSuggest.state === 'loading') return;
        setAiSuggest((s) => ({ state: 'loading', picks: force ? [] : s.picks }));
        const snapshot = buildSuggestionSnapshot();
        const picks = await requestAiSuggestions(snapshot);
        if (picks && picks.length > 0) {
          // Belt-and-braces: filter out anything the user has already logged or
          // actively skipped, in case the model ignored the block list.
          const solvedSlugs = new Set(problems.map((p) => slugify(p.name)));
          const activeSkips = activeSkipSlugs(PROBLEM_CATALOG, problems, skips);
          const filtered = picks.filter((p) => {
            const slug = slugify(p.name);
            return !solvedSlugs.has(slug) && !activeSkips.has(slug);
          });
          setAiSuggest({ state: 'ready', picks: filtered });
        } else {
          setAiSuggest({ state: 'error', picks: [] });
        }
      };

      // ---- Notes and flashcards ----------------------------------------
      // Notes are freeform (any topic, not just a LeetCode problem). Cards are
      // generated from a note's body and scheduled on the same 30/12/5/2 rhythm as
      // problems. A pre-migration schema (no `notes` table yet) is swallowed silently
      // so the rest of the app keeps working; the user re-runs schema.sql to enable it.
      const fetchNotes = async () => {
        const { data, error } = await runSb(() =>
          sb.from('notes').select('*').order('updated_at', { ascending: false }));
        if (error) {
          if (isSchemaCacheError(error)) console.warn('[notes] schema cache stale; retry later', error);
          return;
        }
        setNotes(data || []);
      };

      const fetchCards = async () => {
        const { data, error } = await runSb(() =>
          sb.from('flashcards').select('*').order('next_review', { ascending: true }));
        if (error) {
          if (isSchemaCacheError(error)) console.warn('[flashcards] schema cache stale; retry later', error);
          return;
        }
        setCards(data || []);
      };

      const addNote = async ({ title, topic, body, problem_id }) => {
        const now = new Date().toISOString();
        const newNote = {
          id: `n_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          user_id: user.id,
          title: (title || 'Untitled').trim(),
          topic: (topic || '').trim() || null,
          body: (body || ''),
          problem_id: problem_id || null,
          updated_at: now,
          created_at: now,
        };
        // Functional setState so a rapid second call sees the first call's
        // update rather than the stale closure.
        setNotes((prev) => [newNote, ...prev]);
        setSelectedNoteId(newNote.id);
        const { error } = await runSb(() => sb.from('notes').insert(newNote));
        if (error) {
          setNotes((prev) => prev.filter((n) => n.id !== newNote.id));
          notify('Failed to save note: ' + humaniseSbError(error), 'error');
          return null;
        }
        return newNote;
      };

      const saveNote = async (id, patch) => {
        const clean = {
          title: (patch.title ?? '').trim() || 'Untitled',
          topic: (patch.topic ?? '').trim() || null,
          body: patch.body ?? '',
          updated_at: new Date().toISOString(),
        };
        let restored;
        setNotes((prev) => {
          restored = prev.find((n) => n.id === id);
          return prev.map((n) => (n.id === id ? { ...n, ...clean } : n));
        });
        const { error } = await runSb(() => sb.from('notes').update(clean).eq('id', id));
        if (error) {
          if (restored) setNotes((prev) => prev.map((n) => (n.id === id ? restored : n)));
          notify('Failed to save note: ' + humaniseSbError(error), 'error');
        }
      };

      const deleteNote = async (id) => {
        let goneNote, goneCards;
        setNotes((prev) => { goneNote = prev.find((n) => n.id === id); return prev.filter((n) => n.id !== id); });
        setCards((prev) => { goneCards = prev.filter((c) => c.note_id === id); return prev.filter((c) => c.note_id !== id); });
        if (selectedNoteId === id) setSelectedNoteId(null);
        // The FK is `on delete cascade` so removing the note removes its cards server-side.
        const { error } = await runSb(() => sb.from('notes').delete().eq('id', id));
        if (error) {
          if (goneNote) setNotes((prev) => [goneNote, ...prev]);
          if (goneCards && goneCards.length) setCards((prev) => [...prev, ...goneCards]);
          notify('Failed to delete: ' + humaniseSbError(error), 'error');
        } else {
          notify(`${goneNote ? goneNote.title : 'Note'} removed`, 'success');
        }
      };

      const insertCards = async (rows) => {
        if (rows.length === 0) return;
        // Functional setState because the AI path awaits up to 30s before the
        // DB write returns; a stale `prev` snapshot would clobber ratings,
        // deletes, or newly inserted cards that landed in between.
        setCards((prev) => [...prev, ...rows]);
        const rowIds = new Set(rows.map((r) => r.id));
        const { error } = await runSb(() => sb.from('flashcards').insert(rows));
        if (error) {
          setCards((prev) => prev.filter((c) => !rowIds.has(c.id)));
          notify('Failed to save cards: ' + humaniseSbError(error), 'error');
        }
      };

      // Client-side card extraction from a note body. Naive but honest:
      // split on blank lines, take the paragraphs of at least ~20 chars, and split
      // each on the first colon or first sentence so the front is a natural prompt
      // and the back is the elaboration. If neither pattern is present we still
      // create a "recall this passage" card so nothing gets dropped silently.
      const cardsFromBody = (noteId, body) => {
        const now = todayStr();
        const nextReview = addDays(now, RATING_INTERVALS[3]);
        const paragraphs = (body || '')
          .split(/\n\s*\n/)
          .map((p) => p.trim())
          .filter((p) => p.length > 20);
        return paragraphs.map((p) => {
          const colon = p.indexOf(':');
          const period = p.search(/[.!?]\s/);
          let front, back;
          const afterColon = colon >= 0 ? p.slice(colon + 1).trim() : '';
          const afterPeriod = period >= 0 ? p.slice(period + 1).trim() : '';
          if (colon > 3 && colon < 80 && afterColon.length > 0) {
            front = p.slice(0, colon).trim() + '?';
            back = afterColon;
          } else if (period > 3 && period < 140 && afterPeriod.length > 0) {
            front = p.slice(0, period + 1).trim();
            back = afterPeriod;
          } else {
            front = 'Recall this passage:';
            back = p;
          }
          return {
            id: `c_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
            user_id: user.id,
            note_id: noteId,
            front, back,
            code: null,
            source: 'heuristic',
            history: [],
            next_review: nextReview,
            created_at: now,
          };
        });
      };

      // Shared helper: POST JSON to a Supabase Edge Function, retrying once with
      // a session refresh when the JWT is rejected as clock-skewed (see the
      // isJwtFutureError note in runSb — the same class of failure hits the
      // Edge Function gateway too, which returns 401 with a body like
      // "token used before issued"). Callers get null on any failure so the
      // UI can fall back gracefully instead of surfacing OpenAI internals.
      const callEdgeFunction = async (path, body, timeoutMs = 30000) => {
        const doPost = async () => {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), timeoutMs);
          try {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return { resp: null, text: '' };
            const resp = await fetch(`${SUPABASE_URL}/functions/v1/${path}`, {
              method: 'POST',
              signal: ctrl.signal,
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${session.access_token}`,
                apikey: SUPABASE_ANON_KEY,
              },
              body: JSON.stringify(body),
            });
            const text = await resp.text().catch(() => '');
            return { resp, text };
          } finally {
            clearTimeout(timer);
          }
        };
        try {
          let { resp, text } = await doPost();
          if (resp && !resp.ok && (resp.status === 401 || resp.status === 403) && JWT_FUTURE_RE.test(text)) {
            await sleep(1500);
            try { await sb.auth.refreshSession(); } catch (_) { /* retry with whatever token we have */ }
            ({ resp, text } = await doPost());
          }
          if (!resp) return null;
          if (!resp.ok) {
            console.warn(`[${path}] failed`, resp.status, text.slice(0, 200));
            return null;
          }
          try { return JSON.parse(text); } catch (_) { return null; }
        } catch (e) {
          console.warn(`[${path}] request threw`, e);
          return null;
        }
      };

      // Ask the generate-cards Edge Function to produce flashcards with OpenAI.
      // Returns an array of {front, back, code?} on success, or null on any
      // failure so the caller can fall back to the client-side heuristic.
      // We treat "not deployed / not configured" and "auth failed" as the same
      // fallback path — the app should keep working with the heuristic even
      // before the function is set up.
      const requestAiCards = async (note) => {
        const data = await callEdgeFunction('generate-cards', {
          title: note.title || '',
          topic: note.topic || '',
          body: note.body || '',
        });
        const arr = Array.isArray(data?.cards) ? data.cards : null;
        if (!arr || arr.length === 0) return null;
        const cleaned = arr
          .filter((c) => c && typeof c.front === 'string' && typeof c.back === 'string')
          .map((c) => ({
            front: c.front.trim(),
            back: c.back.trim(),
            code: (typeof c.code === 'string' && c.code.trim()) ? c.code : null,
          }))
          // Server-side validation catches this too, but a bad row here would
          // hit a `not null` DB constraint and toast a generic save failure,
          // which is much noisier than falling back to the heuristic.
          .filter((c) => c.front.length > 0 && c.back.length > 0);
        return cleaned.length > 0 ? cleaned : null;
      };

      // Ask the suggest-problems Edge Function for LLM-generated fresh picks.
      // Sends a compact user snapshot (patterns practiced, comfort, recent /
      // logged / skipped names) so the model can propose something the built-in
      // catalog doesn't already know about. Returns an array of picks shaped
      // like the catalog rows (plus a `reason` and `source:'ai'` marker) or
      // null on any failure — Discover falls back to the deterministic engine.
      const requestAiSuggestions = async (snapshot) => {
        const data = await callEdgeFunction('suggest-problems', snapshot, 30000);
        const arr = Array.isArray(data?.picks) ? data.picks : null;
        if (!arr || arr.length === 0) return null;
        const okDiff = new Set(['Easy', 'Medium', 'Hard']);
        const cleaned = arr
          .filter((p) => p && typeof p.name === 'string' && p.name.trim().length > 0)
          .map((p) => ({
            name: p.name.trim(),
            difficulty: okDiff.has(p.difficulty) ? p.difficulty : 'Medium',
            patterns: Array.isArray(p.patterns)
              ? p.patterns.filter((x) => typeof x === 'string' && x.trim()).map((x) => x.trim()).slice(0, 3)
              : [],
            reason: typeof p.reason === 'string' ? p.reason.trim() : '',
            frequency: 2,
            source: 'ai',
          }));
        return cleaned.length > 0 ? cleaned : null;
      };

      const cardRowFromFields = (noteId, { front, back, code }, source) => {
        const now = todayStr();
        return {
          id: `c_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          user_id: user.id,
          note_id: noteId,
          front, back,
          code: code || null,
          source,
          history: [],
          next_review: addDays(now, RATING_INTERVALS[3]),
          created_at: now,
        };
      };

      const generateCards = async (noteId) => {
        const note = notes.find((n) => n.id === noteId);
        if (!note) return;
        if (!(note.body || '').trim()) {
          notify('Add a couple of paragraphs first — cards are pulled from your note body', 'error');
          return;
        }

        // Primary path: OpenAI via the Edge Function.
        const ai = await requestAiCards(note);
        let rows, via;
        if (ai && ai.length > 0) {
          rows = ai.map((c) => cardRowFromFields(noteId, c, 'ai'));
          via = 'AI';
        } else {
          // Fallback so the app still generates something when the Edge Function
          // isn't deployed yet — the same paragraph-split heuristic as before.
          rows = cardsFromBody(noteId, note.body);
          via = 'heuristic';
        }

        if (rows.length === 0) {
          notify('Add a couple of paragraphs first — cards are pulled from your note body', 'error');
          return;
        }
        await insertCards(rows);
        notify(`Generated ${rows.length} card${rows.length === 1 ? '' : 's'} via ${via} · next up in 5 days`, 'success');
      };

      const addManualCard = async (noteId, { front, back, code }) => {
        const now = todayStr();
        const row = {
          id: `c_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          user_id: user.id,
          note_id: noteId,
          front: front.trim(),
          back: back.trim(),
          code: (code || '').trim() || null,
          source: 'manual',
          history: [],
          next_review: now,
          created_at: now,
        };
        await insertCards([row]);
      };

      const rateCard = async (id, rating) => {
        const card = cards.find((c) => c.id === id);
        if (!card) return;
        const newHistory = [...(card.history || []), { date: todayStr(), rating }];
        const newNextReview = addDays(todayStr(), RATING_INTERVALS[rating]);
        const rollback = { history: card.history, next_review: card.next_review };
        setCards((prev) => prev.map((c) =>
          c.id === id ? { ...c, history: newHistory, next_review: newNextReview } : c
        ));
        const { error } = await runSb(() => sb.from('flashcards')
          .update({ history: newHistory, next_review: newNextReview }).eq('id', id));
        if (error) {
          setCards((prev) => prev.map((c) => (c.id === id ? { ...c, ...rollback } : c)));
          notify('Failed to save: ' + humaniseSbError(error), 'error');
        }
      };

      const deleteCard = async (id) => {
        let gone;
        setCards((prev) => { gone = prev.find((c) => c.id === id); return prev.filter((c) => c.id !== id); });
        const { error } = await runSb(() => sb.from('flashcards').delete().eq('id', id));
        if (error) {
          if (gone) setCards((prev) => [...prev, gone]);
          notify('Failed to delete: ' + humaniseSbError(error), 'error');
        }
      };
      // -----------------------------------------------------------------

      // ---- Drills --------------------------------------------------------
      // One row per attempt. The exercise (with its answer key) is stored on the
      // row the moment it's generated, so a reload never throws away a drill
      // that took a minute of model time to write.
      const fetchDrills = async () => {
        const { data, error } = await runSb(() =>
          sb.from('drills').select('*').order('created_at', { ascending: false }));
        if (error) {
          if (isSchemaCacheError(error)) console.warn('[drills] schema cache stale; retry later', error);
          return;
        }
        setDrills(data || []);
      };

      // Bigger model + long outputs: generation can take a minute or two. The
