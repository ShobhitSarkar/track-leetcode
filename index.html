                  {card.code && <pre className="code" style={{ marginTop: 10 }}>{card.code}</pre>}
                </div>
                <div>
                  <div className="eyebrow" style={{ marginBottom: 10 }}>How did it go?</div>
                  <div className="grid grid-cols-2 gap-2">
                    {[4, 3, 2, 1].map((r) => (
                      <RatingButton key={r} rating={r} selected={false} onClick={() => handleRate(r)} />
                    ))}
                  </div>
                </div>
              </>
            )}
            {!revealed && (
              <button onClick={() => setRevealed(true)} className="btn btn-primary" style={{ alignSelf: 'flex-start' }}>
                <IconEye size={15} /> Reveal answer
              </button>
            )}
          </div>
        </div>
      );
    }
    // ============================================================
    // Drills
    // ============================================================
    const formatClock = (sec) => {
      const s = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
      return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}` : `${m}:${String(r).padStart(2, '0')}`;
    };
    const shortDate = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    };

    // Seconds since `startedAt`, ticking while `active`.
    function useElapsed(startedAt, active) {
      const [now, setNow] = useState(() => Date.now());
      useEffect(() => {
        if (!active) return;
        setNow(Date.now());
        const h = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(h);
      }, [active, startedAt]);
      return startedAt ? Math.max(0, Math.round((now - startedAt) / 1000)) : 0;
    }

    // Line diff via LCS. PR files are capped at ~150 lines by the generator, so
    // the O(n·m) table is tiny; anything absurd falls back to delete-all/add-all
    // rather than locking the tab.
    function lineDiff(before, after) {
      const split = (t) => (t ? t.replace(/\n$/, '').split('\n') : []);
      const a = split(before), b = split(after);
      const n = a.length, m = b.length;
      if (n * m > 400000) {
        return [
          ...a.map((text, i) => ({ t: 'del', o: i + 1, n: null, text })),
          ...b.map((text, j) => ({ t: 'add', o: null, n: j + 1, text })),
        ];
      }
      const w = m + 1;
      const dp = new Uint32Array((n + 1) * w);
      for (let i = n - 1; i >= 0; i--) {
        for (let j = m - 1; j >= 0; j--) {
          dp[i * w + j] = a[i] === b[j] ? dp[(i + 1) * w + j + 1] + 1 : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
        }
      }
      const rows = [];
      let i = 0, j = 0;
      while (i < n && j < m) {
        if (a[i] === b[j]) { rows.push({ t: 'ctx', o: i + 1, n: j + 1, text: a[i] }); i++; j++; }
        else if (dp[(i + 1) * w + j] >= dp[i * w + j + 1]) { rows.push({ t: 'del', o: i + 1, n: null, text: a[i] }); i++; }
        else { rows.push({ t: 'add', o: null, n: j + 1, text: b[j] }); j++; }
      }
      while (i < n) { rows.push({ t: 'del', o: i + 1, n: null, text: a[i] }); i++; }
      while (j < m) { rows.push({ t: 'add', o: null, n: j + 1, text: b[j] }); j++; }
      return rows;
    }

    // Answer keys anchor to a line by quoting it, because models are bad at
    // counting lines. Find that line in the file: exact, then trimmed, then a
    // substring match for snippets the model shortened.
    function anchorLine(content, snippet) {
      if (!content || !snippet) return null;
      const lines = content.split('\n');
      const want = snippet.replace(/\n.*$/s, '');
      const t = want.trim();
      let idx = lines.indexOf(want);
      if (idx < 0) idx = lines.findIndex((l) => l.trim() === t);
      if (idx < 0 && t.length >= 6) idx = lines.findIndex((l) => l.includes(t) || (l.trim().length >= 6 && t.includes(l.trim())));
      return idx >= 0 ? idx + 1 : null;
    }

    // The note body handed to Notes by "Save lessons". One paragraph per
    // lesson so Generate cards makes one flashcard each.
    function drillLessonsBody(drill) {
      const g = drill.grade;
      if (!g) return '';
      const ex = drill.exercise || {};
      const parts = [...(g.improvements || [])];
      if (drill.kind === 'pr_review') {
        const result = new Map((g.issues || []).map((i) => [i.id, i.caught]));
        for (const issue of (ex.issues || [])) {
          if (result.get(issue.id) === 'yes') continue;
          parts.push(`Missed in review, ${issue.severity} ${issue.category}: ${issue.title}. ${issue.explanation}`);
        }
      } else if (drill.kind === 'debugging' && ex.answer) {
        parts.push(`Root cause of "${drill.title}": ${ex.answer.root_cause}`);
        if (ex.answer.fix) parts.push(`The fix: ${ex.answer.fix}`);
      } else if (drill.kind === 'system_design') {
        for (const k of (g.key_points || [])) {
          if (k.covered === 'yes') continue;
          parts.push(`${drill.title}, key point: ${k.point}${k.note ? ` (${k.note})` : ''}`);
        }
        if (g.model_outline) parts.push(`Strong outline for ${drill.title}:\n${g.model_outline}`);
      }
      return parts.filter(Boolean).join('\n\n');
    }

    // Wrapped code lines keep Python's indentation readable: continuation lines
    // hang two columns in from where the code on that line starts.
    const hangingIndent = (text) => {
      const lead = (text.match(/^[ \t]*/) || [''])[0].replace(/\t/g, '    ').length;
      const w = Math.min(lead, 40) + 2;
      return { paddingLeft: `${w}ch`, textIndent: `-${w}ch` };
    };
    const formatPractice = (sec) => (sec < 3600 ? `${Math.round(sec / 60)}m` : `${(sec / 3600).toFixed(1)}h`);

    const SCORE_TONE = (score) => (score >= 75 ? 'good' : score >= 50 ? 'mid' : 'low');
    const COVER_TONE = { yes: 'good', partial: 'mid', no: 'low' };
    const COVER_LABEL = { yes: 'Caught', partial: 'Partly', no: 'Missed' };

    function DrillsView({
      drills, openId, onOpen, generating, gradingIds,
      onStart, onPatch, onGrade, onRequestFollowups, onDelete, onSaveLessons,
    }) {
      const [tab, setTab] = useState('new');
      const open = drills.find((d) => d.id === openId) || null;

      if (open) {
        return (
          <DrillWorkspace key={open.id} drill={open} grading={gradingIds.has(open.id)}
            onBack={() => onOpen(null)} onPatch={onPatch} onGrade={onGrade}
            onRequestFollowups={onRequestFollowups}
            onDelete={() => onDelete(open.id)} onSaveLessons={() => onSaveLessons(open)} />
        );
      }

      return (
        <div className="anim-rise">
          <div className="note-tabs" role="tablist" style={{ display: 'inline-flex', marginBottom: 18 }}>
            {[
              { k: 'new', label: 'New drill', Icon: IconPlus },
              { k: 'history', label: 'History', Icon: IconHistory, count: drills.length },
            ].map((t) => (
              <button key={t.k} onClick={() => setTab(t.k)} role="tab" aria-selected={tab === t.k}
                className="note-tab" data-active={tab === t.k}>
                <t.Icon size={13} /> {t.label}
                {typeof t.count === 'number' && <span className="note-tab-count">{t.count}</span>}
              </button>
            ))}
          </div>
          {tab === 'new'
            ? <DrillLauncher generating={generating} onStart={onStart} onOpen={onOpen}
                inProgress={drills.filter((d) => d.status === 'in_progress')} />
            : <DrillHistory drills={drills} onOpen={onOpen} onGoNew={() => setTab('new')} />}
        </div>
      );
    }

    function DrillLauncher({ generating, onStart, onOpen, inProgress }) {
      const [kind, setKind] = useState('pr_review');
      const [level, setLevel] = useState('Mid');
      const [focus, setFocus] = useState('');
      const [pick, setPick] = useState('ai'); // system design: catalog id or 'ai'
      const elapsed = useElapsed(generating?.startedAt, !!generating);
      const meta = DRILL_KINDS[kind];
      const catalogItem = kind === 'system_design' && pick !== 'ai'
        ? SYSTEM_DESIGN_CATALOG.find((c) => c.id === pick) : null;
      const showFocus = kind !== 'system_design' || pick === 'ai';

      const start = () => onStart({ kind, difficulty: level, focus: showFocus ? focus.trim() : '', catalogItem });

      if (generating) {
        const g = DRILL_KINDS[generating.kind];
        return (
          <div className="card drill-generating anim-fade">
            <div className="drill-spinner" aria-hidden="true"><g.Icon size={20} /></div>
            <div>
              <div className="display" style={{ fontSize: 24, lineHeight: 1.2 }}>
                Writing a fresh {g.label.toLowerCase()} drill…
              </div>
              <p style={{ color: 'var(--muted)', fontSize: 13, lineHeight: 1.6, margin: '6px 0 0' }}>
                <span className="mono tnum">{formatClock(elapsed)}</span> · A larger model writes the code and the hidden answer key, which usually takes one to two minutes. You can switch tabs; it keeps going.
              </p>
            </div>
          </div>
        );
      }

      return (
        <div className="stack-5">
          {inProgress.length > 0 && (
            <div className="panel" style={{ padding: 14 }}>
              <div className="eyebrow" style={{ marginBottom: 8 }}>Pick up where you left off</div>
              <div className="stack-2">
                {inProgress.slice(0, 3).map((d) => {
                  const K = DRILL_KINDS[d.kind];
                  return (
                    <button key={d.id} onClick={() => onOpen(d.id)} className="drill-resume">
                      <K.Icon size={14} style={{ color: 'var(--muted)' }} />
                      <span className="truncate" style={{ flex: 1, textAlign: 'left' }}>{d.title}</span>
                      <span className="mono tnum" style={{ fontSize: 11, color: 'var(--muted)' }}>{formatClock(d.duration_sec)}</span>
                      <IconChevron size={14} style={{ color: 'var(--faint)' }} />
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          <div className="drill-kinds" role="radiogroup" aria-label="Drill type">
            {DRILL_KIND_KEYS.map((k) => {
              const K = DRILL_KINDS[k];
              return (
                <button key={k} onClick={() => setKind(k)} className="drill-kind"
                  role="radio" aria-checked={kind === k} data-active={kind === k}>
                  <span className="drill-kind-icon"><K.Icon size={18} /></span>
                  <span className="drill-kind-title">{K.label}</span>
                  <span className="drill-kind-blurb">{K.blurb}</span>
                  <span className="mono drill-kind-meta"><IconClock size={11} /> ~{K.targetMin} min · Python</span>
                </button>
              );
            })}
          </div>

          <div className="card" style={{ padding: 20 }}>
            <div className="stack-4">
              <div>
                <span className="field-label">Level</span>
                <div className="flex flex-wrap gap-1.5">
                  {DRILL_LEVELS.map((l) => (
                    <button key={l} onClick={() => setLevel(l)} className="chip" aria-pressed={level === l}>{l}</button>
                  ))}
                </div>
              </div>

              {kind === 'system_design' && (
                <div>
                  <span className="field-label">Question</span>
                  <div className="sd-catalog">
                    <button onClick={() => setPick('ai')} className="sd-pick" data-active={pick === 'ai'}>
                      <span className="sd-pick-title"><IconSparkle size={13} style={{ color: 'var(--accent)' }} /> Surprise me</span>
                      <span className="sd-pick-tags">AI writes a fresh question and rubric</span>
                    </button>
                    {SYSTEM_DESIGN_CATALOG.map((c) => (
                      <button key={c.id} onClick={() => setPick(c.id)} className="sd-pick" data-active={pick === c.id}>
                        <span className="sd-pick-title">{c.title.replace(/^Design (a |an )?/, '')}</span>
                        <span className="sd-pick-tags">{c.tags.join(' · ')}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {showFocus && (
                <div>
                  <span className="field-label">Focus <span style={{ textTransform: 'none', letterSpacing: 0, color: 'var(--faint)', fontWeight: 400 }}>(optional)</span></span>
                  <div className="flex flex-wrap gap-1.5" style={{ marginBottom: 10 }}>
                    {meta.focus.map((f) => (
                      <button key={f} onClick={() => setFocus(focus === f ? '' : f)} className="chip" aria-pressed={focus === f}>{f}</button>
                    ))}
                  </div>
                  <input value={focus} onChange={(e) => setFocus(e.target.value)} className="field field-inset"
                    placeholder={kind === 'pr_review' ? 'Or type one, e.g. "FastAPI auth middleware"' : kind === 'debugging' ? 'Or type one, e.g. "asyncio worker pool"' : 'Or type one, e.g. "collaborative document editing"'} />
                </div>
              )}

              <div className="flex items-center justify-between gap-3" style={{ flexWrap: 'wrap', paddingTop: 4 }}>
                <p style={{ margin: 0, fontSize: 12, color: 'var(--muted)', lineHeight: 1.5, maxWidth: '52ch' }}>
                  {catalogItem
                    ? 'Starts right away. Graded against hand-written key points.'
                    : 'Generated fresh, so you have never seen it before. The answer key stays hidden until you submit.'}
                </p>
                <button onClick={start} className="btn btn-primary">
                  {catalogItem ? <><IconTarget size={14} /> Start</> : <><IconBolt size={14} /> Generate drill</>}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function DrillHistory({ drills, onOpen, onGoNew }) {
      const [filter, setFilter] = useState('all');
      const shown = filter === 'all' ? drills : drills.filter((d) => d.kind === filter);
      const graded = shown.filter((d) => typeof d.score === 'number');
      const avg = graded.length ? Math.round(graded.reduce((a, d) => a + d.score, 0) / graded.length) : null;
      const totalSec = shown.reduce((a, d) => a + (d.duration_sec || 0), 0);

      // Weakest rubric dimensions across graded attempts: the closest thing to
      // Discover's "struggling patterns" for drills.
      const weak = useMemo(() => {
        const acc = new Map();
        for (const d of graded) {
          for (const dim of (d.grade?.dimensions || [])) {
            const key = `${DRILL_KINDS[d.kind].label} · ${dim.name}`;
            const e = acc.get(key) || { sum: 0, n: 0 };
            e.sum += dim.score; e.n += 1;
            acc.set(key, e);
          }
        }
        return [...acc.entries()]
          .map(([name, e]) => ({ name, avg: e.sum / e.n, n: e.n }))
          .filter((w) => w.avg < 3)
          .sort((a, b) => a.avg - b.avg)
          .slice(0, 4);
      }, [shown]);

      if (drills.length === 0) {
        return (
          <EmptyState icon={<IconTarget size={22} />} title="No drills yet"
            body="Generate a PR review, a debugging ticket or a system design round. Every attempt lands here with its score, time and feedback."
            cta="Start a drill" ctaIcon={<IconBolt size={14} />} onCta={onGoNew} />
        );
      }

      return (
        <div className="stack-4">
          <div className="cards-summary">
            <div className="stat-tile"><div className="k">Attempts</div><div className="v tnum">{shown.length}</div></div>
            <div className="stat-tile accent"><div className="k">Avg score</div><div className="v tnum">{avg === null ? '–' : avg}</div></div>
            <div className="stat-tile"><div className="k">Time</div><div className="v tnum">{formatPractice(totalSec)}</div></div>
          </div>

          {weak.length > 0 && (
            <div className="panel" style={{ padding: 16 }}>
              <div className="eyebrow" style={{ marginBottom: 12 }}>Weakest areas</div>
              <div className="stack-3">
                {weak.map((w) => (
                  <div key={w.name} className="dim-row">
                    <span className="dim-name">{w.name}</span>
                    <div className="dim-track"><div className="dim-fill" data-tone={w.avg >= 3 ? 'good' : w.avg >= 2.25 ? 'mid' : 'low'} style={{ width: `${(w.avg / 4) * 100}%` }} /></div>
                    <span className="mono tnum dim-val">{w.avg.toFixed(1)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="flex flex-wrap gap-1.5">
            {['all', ...DRILL_KIND_KEYS].map((k) => (
              <button key={k} onClick={() => setFilter(k)} className="chip" aria-pressed={filter === k}>
                {k === 'all' ? 'All' : DRILL_KINDS[k].label}
              </button>
            ))}
          </div>

          <div className="stack-2">
            {shown.map((d) => {
              const K = DRILL_KINDS[d.kind];
              return (
                <button key={d.id} onClick={() => onOpen(d.id)} className="drill-row">
                  <span className="drill-row-icon"><K.Icon size={15} /></span>
                  <span style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
                    <span className="drill-row-title">{d.title}</span>
                    <span className="drill-row-meta mono">
                      {K.label} · {d.difficulty || 'Mid'}{d.topic ? ` · ${d.topic}` : ''} · {shortDate(d.created_at)} · {formatClock(d.duration_sec)}
                    </span>
                  </span>
                  {typeof d.score === 'number'
                    ? <span className="score-badge tnum" data-tone={SCORE_TONE(d.score)}>{d.score}</span>
                    : <span className={`pill ${d.status === 'in_progress' ? 'pill-accent' : ''}`}>{d.status === 'in_progress' ? 'in progress' : 'ungraded'}</span>}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    function DrillWorkspace({ drill, grading, onBack, onPatch, onGrade, onRequestFollowups, onDelete, onSaveLessons }) {
      const K = DRILL_KINDS[drill.kind];
      const ex = drill.exercise || {};
      const editable = drill.status === 'in_progress' && !grading;
      const revealed = !editable;
      const [response, setResponse] = useState(() => drill.response || {});
      const [followups, setFollowups] = useState(() => drill.followups || null);
      const [elapsed, setElapsed] = useState(drill.duration_sec || 0);
      const [fuState, setFuState] = useState('idle'); // idle | loading | error
      const [confirmDel, setConfirmDel] = useState(false);

      // Active-time clock: only ticks while the attempt is open, editable and
      // the tab is visible, so walking away doesn't inflate the history.
      useEffect(() => {
        if (!editable) return;
        const h = setInterval(() => { if (document.visibilityState === 'visible') setElapsed((e) => e + 1); }, 1000);
        return () => clearInterval(h);
      }, [editable]);

      const latest = useRef({});
      latest.current = { response, followups, duration_sec: elapsed };
      const editableRef = useRef(editable);
      editableRef.current = editable;
      const patchRef = useRef(onPatch);
      patchRef.current = onPatch;

      // Debounced autosave of the work itself.
      const firstRun = useRef(true);
      useEffect(() => {
        if (firstRun.current) { firstRun.current = false; return; }
        if (!editable) return;
        const h = setTimeout(() => onPatch(drill.id, latest.current, { quiet: true }), 900);
        return () => clearTimeout(h);
      }, [response, followups]);

      // Keep the stored clock roughly current, and flush everything on leave.
      useEffect(() => {
        if (editable && elapsed > 0 && elapsed % 30 === 0) onPatch(drill.id, { duration_sec: elapsed }, { quiet: true });
      }, [elapsed]);
      useEffect(() => () => {
        if (editableRef.current) patchRef.current(drill.id, latest.current, { quiet: true });
      }, []);

      const submit = () => onGrade(drill.id, { response, followups, duration_sec: elapsed });
      const retryGrade = () => onGrade(drill.id, { response: drill.response, followups: drill.followups, duration_sec: drill.duration_sec });

      const askFollowups = async () => {
        setFuState('loading');
        const qs = await onRequestFollowups(drill, response);
        if (!qs) { setFuState('error'); return; }
        setFuState('idle');
        setFollowups(qs.map((q) => ({ q, a: '' })));
      };

      const over = elapsed > K.targetMin * 60;
      const designStage = drill.kind === 'system_design' && editable ? (followups ? 'followups' : 'work') : null;

      let primary = null;
      if (editable) {
        if (designStage === 'work') {
          primary = (
            <>
              <button onClick={submit} className="btn btn-ghost btn-sm" disabled={fuState === 'loading'}>Skip follow-ups</button>
              <button onClick={askFollowups} className="btn btn-primary" disabled={fuState === 'loading'}>
                <IconMessage size={14} /> {fuState === 'loading' ? 'Interviewer is reading…' : 'Done: take follow-ups'}
              </button>
            </>
          );
        } else {
          primary = (
            <button onClick={submit} className="btn btn-primary"><IconCheck size={14} /> Submit for grading</button>
          );
        }
      }

      return (
        <div className="drill-workspace anim-rise">
          <button onClick={onBack} className="btn btn-quiet btn-sm" style={{ alignSelf: 'flex-start', marginLeft: -8 }}>
            <IconArrowLeft size={14} /> All drills
          </button>

          <header>
            <div className="eyebrow flex items-center gap-1.5" style={{ marginBottom: 8, flexWrap: 'wrap' }}>
              <K.Icon size={12} /> {K.label} · {drill.difficulty || 'Mid'}{drill.topic ? ` · ${drill.topic}` : ''}
            </div>
            <h2 className="display drill-title">{drill.title}</h2>
          </header>

          {revealed && <GradePanel drill={drill} grading={grading} onRetry={retryGrade} />}

          {drill.kind === 'pr_review' && (
            <PrReviewPanel ex={ex} response={editable ? response : (drill.response || {})} setResponse={setResponse}
              editable={editable} revealed={revealed && !grading} grade={drill.grade} />
          )}
          {drill.kind === 'debugging' && (
            <DebugPanel ex={ex} response={editable ? response : (drill.response || {})} setResponse={setResponse}
              editable={editable} revealed={revealed && !grading} />
          )}
          {drill.kind === 'system_design' && (
            <DesignPanel ex={ex} response={editable ? response : (drill.response || {})} setResponse={setResponse}
              followups={editable ? followups : drill.followups} setFollowups={setFollowups}
              editable={editable} revealed={revealed && !grading} grade={drill.grade} />
          )}

          {fuState === 'error' && (
            <div className="panel" style={{ padding: 12, borderColor: 'var(--danger)', background: 'var(--danger-soft)', color: 'var(--danger)', fontSize: 13 }}>
              The interviewer didn't respond. Try again, or submit without follow-ups.
            </div>
          )}

          <div className="drill-actionbar">
            <span className="drill-clock mono tnum" data-over={editable && over}>
              <IconClock size={13} /> {formatClock(elapsed)}
              <span style={{ color: 'var(--faint)' }}>&nbsp;/ {K.targetMin}:00</span>
            </span>
            <div className="flex items-center gap-2" style={{ marginLeft: 'auto', flexWrap: 'wrap', justifyContent: 'flex-end' }}>
              {!editable && !grading && drill.grade && (
                <button onClick={onSaveLessons} className="btn btn-ghost btn-sm"><IconNotes size={13} /> Save lessons to Notes</button>
              )}
              {!editable && !grading && (
                confirmDel ? (
                  <>
                    <button onClick={onDelete} className="btn btn-danger btn-sm">Delete</button>
                    <button onClick={() => setConfirmDel(false)} className="btn btn-ghost btn-sm">Cancel</button>
                  </>
                ) : (
                  <button onClick={() => setConfirmDel(true)} className="icon-btn" aria-label="Delete drill"><IconTrash size={14} /></button>
                )
              )}
              {primary}
            </div>
          </div>
        </div>
      );
    }

    // ---- Grade --------------------------------------------------------
    function GradePanel({ drill, grading, onRetry }) {
      const [startedAt, setStartedAt] = useState(() => Date.now());
      useEffect(() => { if (grading) setStartedAt(Date.now()); }, [grading]);
      const elapsed = useElapsed(startedAt, grading);
      const g = drill.grade;

      if (grading) {
        return (
          <div className="card drill-generating anim-fade">
            <div className="drill-spinner" aria-hidden="true"><IconTarget size={20} /></div>
            <div>
              <div className="display" style={{ fontSize: 24, lineHeight: 1.2 }}>Grading…</div>
              <p style={{ color: 'var(--muted)', fontSize: 13, margin: '6px 0 0' }}>
                <span className="mono tnum">{formatClock(elapsed)}</span> · Comparing your answer against the hidden key.
              </p>
            </div>
          </div>
        );
      }

      if (!g) {
        return (
          <div className="panel anim-fade" style={{ padding: 16, borderColor: 'var(--danger)', background: 'var(--danger-soft)' }}>
            <div className="flex items-start gap-2" style={{ marginBottom: 12 }}>
              <IconAlert size={15} style={{ color: 'var(--danger)', marginTop: 2 }} />
              <div style={{ color: 'var(--danger)', fontSize: 13, lineHeight: 1.55 }}>
                No grade yet. The grader failed or timed out. The answer key is shown below so you can check your work, or try grading again.
              </div>
            </div>
            <button onClick={onRetry} className="btn btn-primary btn-sm">Retry grading</button>
          </div>
        );
      }

      const issueTotal = (drill.exercise?.issues || []).length;
      const caught = (g.issues || []).filter((i) => i.caught === 'yes').length;

      return (
        <section className="card grade-card anim-fade">
          <div className="grade-top">
            <div className="grade-score" data-tone={SCORE_TONE(g.score)}>
              <span className="display tnum">{g.score}</span>
              <span className="mono">/ 100</span>
            </div>
            <div style={{ flex: 1, minWidth: 220 }}>
              <div className="flex items-center gap-2" style={{ flexWrap: 'wrap', marginBottom: 8 }}>
                <span className="pill verdict-pill" data-tone={SCORE_TONE(g.score)}>{g.verdict}</span>
                {drill.kind === 'pr_review' && issueTotal > 0 && (
                  <span className="pill">{caught} of {issueTotal} planted issues caught</span>
                )}
                {drill.kind === 'debugging' && g.root_cause_found && (
                  <span className="pill" data-tone={COVER_TONE[g.root_cause_found]}>root cause: {g.root_cause_found}</span>
                )}
              </div>
              <p style={{ margin: 0, fontSize: 14, lineHeight: 1.65 }}>{g.summary}</p>
            </div>
          </div>

          {g.dimensions?.length > 0 && (
            <div className="stack-3" style={{ marginTop: 20 }}>
              {g.dimensions.map((d) => (
                <div key={d.name}>
                  <div className="dim-row">
                    <span className="dim-name">{d.name}</span>
                    <div className="dim-track"><div className="dim-fill" data-tone={d.score >= 3 ? 'good' : d.score === 2 ? 'mid' : 'low'} style={{ width: `${(d.score / 4) * 100}%` }} /></div>
                    <span className="mono tnum dim-val">{d.score}/4</span>
                  </div>
                  {d.comment && <div className="dim-comment">{d.comment}</div>}
                </div>
              ))}
            </div>
          )}

          <div className="grade-lists">
            {g.strengths?.length > 0 && (
              <div>
                <div className="eyebrow" style={{ color: 'var(--success)', marginBottom: 8 }}>Strengths</div>
                <ul className="grade-ul">{g.strengths.map((s, i) => <li key={i}>{s}</li>)}</ul>
              </div>
            )}
            {g.improvements?.length > 0 && (
              <div>
                <div className="eyebrow" style={{ color: 'var(--accent)', marginBottom: 8 }}>Do differently</div>
                <ul className="grade-ul">{g.improvements.map((s, i) => <li key={i}>{s}</li>)}</ul>
              </div>
            )}
          </div>
          {g.model && <div className="mono" style={{ marginTop: 14, fontSize: 10, color: 'var(--faint)' }}>graded by {g.model}</div>}
        </section>
      );
    }

    // ---- PR review ----------------------------------------------------
    function PrReviewPanel({ ex, response, setResponse, editable, revealed, grade }) {
      const comments = response.comments || [];
      const issueResult = useMemo(() => new Map((grade?.issues || []).map((i) => [i.id, i])), [grade]);
      const commentResult = useMemo(() => new Map((grade?.comments || []).map((c) => [c.id, c])), [grade]);
      const files = ex.files || [];
      const added = useMemo(() => files.reduce((a, f) => a + lineDiff(f.before, f.after).filter((r) => r.t === 'add').length, 0), [ex]);

      const addComment = (c) => setResponse((r) => ({ ...r, comments: [...(r.comments || []), c] }));
      const removeComment = (id) => setResponse((r) => ({ ...r, comments: (r.comments || []).filter((c) => c.id !== id) }));

      return (
        <div className="stack-4">
          <div className="card" style={{ padding: 18 }}>
            <div className="flex items-center gap-2" style={{ marginBottom: 10, color: 'var(--muted)', fontSize: 12 }}>
              <IconPR size={14} />
              <span className="mono">{files.length} file{files.length === 1 ? '' : 's'} · +{added}</span>
            </div>
            <div style={{ fontSize: 14, lineHeight: 1.65, whiteSpace: 'pre-wrap' }}>{ex.description}</div>
          </div>

          {editable && (
            <p style={{ margin: 0, fontSize: 12, color: 'var(--muted)' }}>
              Click any line to leave a comment. Review it the way you would at work: what has to change before merge, and why.
            </p>
          )}

          {files.map((f) => (
            <DiffFile key={f.path} file={f} editable={editable}
              comments={comments.filter((c) => c.path === f.path)}
              onAdd={addComment} onRemove={removeComment}
              issues={revealed ? (ex.issues || []).filter((i) => i.file === f.path) : []}
              issueResult={issueResult} commentResult={commentResult} />
          ))}

          <div className="card" style={{ padding: 18 }}>
            <span className="field-label">Review decision</span>
            <div className="flex flex-wrap gap-1.5" style={{ marginBottom: 14 }}>
              {['Approve', 'Comment', 'Request changes'].map((d) => (
                <button key={d} className="chip" aria-pressed={response.decision === d} disabled={!editable}
                  onClick={() => setResponse((r) => ({ ...r, decision: d }))}>{d}</button>
              ))}
            </div>
            {editable ? (
              <Field label="Summary comment" value={response.summary || ''} rows={4} inset
                onChange={(v) => setResponse((r) => ({ ...r, summary: v }))}
                placeholder="Overall take for the author: the must-fixes, what's nice, anything to follow up on later." />
            ) : (
              <div>
                <span className="field-label">Summary comment</span>
                <div className="readonly-block">{response.summary || <span style={{ color: 'var(--faint)' }}>(none)</span>}</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const DIFF_CONTEXT = 3;

    function DiffFile({ file, editable, comments, onAdd, onRemove, issues, issueResult, commentResult }) {
      const rows = useMemo(() => lineDiff(file.before || '', file.after || ''), [file.before, file.after]);
      const [expanded, setExpanded] = useState(() => new Set());
      const [composer, setComposer] = useState(null);
      const [draft, setDraft] = useState('');

      const keyOf = (r) => (r.t === 'del' ? `old:${r.o}` : `new:${r.n}`);
      const byKey = useMemo(() => {
        const m = new Map();
        for (const c of comments) {
          const k = `${c.side}:${c.line}`;
          if (!m.has(k)) m.set(k, []);
          m.get(k).push(c);
        }
        return m;
      }, [comments]);
      const { issuesByLine, floating } = useMemo(() => {
        const m = new Map(); const fl = [];
        for (const i of issues) {
          const n = anchorLine(file.after, i.snippet);
          if (n === null) { fl.push(i); continue; }
          const k = `new:${n}`;
          if (!m.has(k)) m.set(k, []);
          m.get(k).push(i);
        }
        return { issuesByLine: m, floating: fl };
      }, [issues, file.after]);

      const pinned = (r) => byKey.has(keyOf(r)) || issuesByLine.has(keyOf(r)) || composer === keyOf(r);

      // Fold long unchanged runs, but never hide a line that carries a comment,
      // a revealed issue or an open composer.
      const items = [];
      for (let i = 0; i < rows.length;) {
        if (rows[i].t !== 'ctx') { items.push({ row: rows[i] }); i++; continue; }
        let j = i;
        while (j < rows.length && rows[j].t === 'ctx') j++;
        const lead = i === 0 ? 0 : DIFF_CONTEXT;
        const trail = j === rows.length ? 0 : DIFF_CONTEXT;
        const hidden = rows.slice(i + lead, j - trail);
        if (hidden.length > 2 && !expanded.has(i) && !hidden.some(pinned)) {
          rows.slice(i, i + lead).forEach((row) => items.push({ row }));
          items.push({ fold: i, count: hidden.length });
          rows.slice(j - trail, j).forEach((row) => items.push({ row }));
        } else {
          rows.slice(i, j).forEach((row) => items.push({ row }));
        }
        i = j;
      }

      const openComposer = (k) => { if (!editable) return; setComposer(k); setDraft(''); };
      const saveComment = (r) => {
        if (!draft.trim()) return;
        onAdd({
          id: `c${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`,
          path: file.path, side: r.t === 'del' ? 'old' : 'new', line: r.t === 'del' ? r.o : r.n,
          code: r.text.slice(0, 300), body: draft.trim(),
        });
        setComposer(null); setDraft('');
      };

      return (
        <div className="diff-file">
          <div className="diff-file-head mono">
            <span className="truncate">{file.path}</span>
            {!file.before && <span className="pill pill-success" style={{ fontSize: 10, padding: '1px 7px' }}>new file</span>}
          </div>
          {floating.map((i) => <IssueCallout key={i.id} issue={i} result={issueResult.get(i.id)} />)}
          <div className="diff-body">
            {items.map((it, idx) => {
              if (it.fold !== undefined) {
                return (
                  <button key={`f${it.fold}`} className="diff-fold mono"
                    onClick={() => setExpanded((s) => new Set(s).add(it.fold))}>
                    ⋯ {it.count} unchanged line{it.count === 1 ? '' : 's'}
                  </button>
                );
              }
              const r = it.row;
              const k = keyOf(r);
              return (
                <React.Fragment key={`${k}:${idx}`}>
                  <div className="diff-row" data-t={r.t} data-clickable={editable}
                    onClick={() => openComposer(k)} title={editable ? 'Comment on this line' : undefined}>
                    <span className="diff-num">{r.o ?? ''}</span>
                    <span className="diff-num">{r.n ?? ''}</span>
                    <span className="diff-sign">{r.t === 'add' ? '+' : r.t === 'del' ? '−' : ''}</span>
                    <code className="diff-code" style={hangingIndent(r.text)}>{r.text || ' '}</code>
                  </div>
                  {(byKey.get(k) || []).map((c) => (
                    <DiffComment key={c.id} c={c} editable={editable} onRemove={() => onRemove(c.id)} result={commentResult.get(c.id)} />
                  ))}
                  {(issuesByLine.get(k) || []).map((i) => <IssueCallout key={i.id} issue={i} result={issueResult.get(i.id)} />)}
                  {composer === k && (
                    <div className="diff-inline">
                      <textarea autoFocus value={draft} onChange={(e) => setDraft(e.target.value)} rows={3}
                        className="field" placeholder="What's wrong here, why it matters, and what you'd suggest."
                        onKeyDown={(e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) saveComment(r); if (e.key === 'Escape') setComposer(null); }} />
                      <div className="flex gap-2" style={{ marginTop: 8 }}>
                        <button onClick={() => saveComment(r)} className="btn btn-primary btn-sm" disabled={!draft.trim()}>Comment</button>
                        <button onClick={() => setComposer(null)} className="btn btn-ghost btn-sm">Cancel</button>
                      </div>
                    </div>
                  )}
                </React.Fragment>
              );
            })}
          </div>
        </div>
      );
    }

    const COMMENT_VERDICT = {
      matched: { label: 'matches a planted issue', tone: 'good' },
      valid_extra: { label: 'valid, not in the key', tone: 'info' },
      noise: { label: 'noise', tone: 'low' },
    };

    function DiffComment({ c, editable, onRemove, result }) {
      const v = result && COMMENT_VERDICT[result.verdict];
      return (
        <div className="diff-inline">
          <div className="diff-comment">
            <div className="flex items-start gap-2">
              <IconMessage size={13} style={{ color: 'var(--primary)', marginTop: 3 }} />
              <div style={{ flex: 1, whiteSpace: 'pre-wrap', fontSize: 13, lineHeight: 1.55 }}>{c.body}</div>
              {editable && <button onClick={onRemove} className="icon-btn" aria-label="Delete comment" style={{ width: 26, height: 26 }}><IconX size={12} /></button>}
            </div>
            {v && (
              <div className="flex items-start gap-2" style={{ marginTop: 8, fontSize: 12, color: 'var(--muted)' }}>
                <span className="pill" data-tone={v.tone} style={{ fontSize: 10, padding: '1px 7px' }}>{v.label}</span>
                {result.note && <span style={{ lineHeight: 1.5 }}>{result.note}</span>}
              </div>
            )}
          </div>
        </div>
      );
    }

    function IssueCallout({ issue, result }) {
      const caught = result?.caught;
      return (
        <div className="diff-inline">
          <div className="issue-callout" data-tone={caught ? COVER_TONE[caught] : 'neutral'}>
            <div className="flex items-center gap-2" style={{ flexWrap: 'wrap', marginBottom: 4 }}>
              <span className="eyebrow" style={{ color: 'inherit' }}>Planted issue</span>
              <span className="pill" style={{ fontSize: 10, padding: '1px 7px' }}>{issue.severity} · {issue.category}</span>
              {caught && <span className="pill" data-tone={COVER_TONE[caught]} style={{ fontSize: 10, padding: '1px 7px' }}>{COVER_LABEL[caught]}</span>}
            </div>
            <div style={{ fontWeight: 600, fontSize: 13.5, color: 'var(--text)' }}>{issue.title}</div>
            <div style={{ fontSize: 13, lineHeight: 1.55, color: 'var(--text)', marginTop: 3 }}>{issue.explanation}</div>
            {result?.note && <div style={{ fontSize: 12, lineHeight: 1.5, color: 'var(--muted)', marginTop: 6 }}>{result.note}</div>}
          </div>
        </div>
      );
    }

    // ---- Debugging ----------------------------------------------------
    function CodeFile({ path, content, highlight }) {
      const lines = (content || '').replace(/\n$/, '').split('\n');
      return (
        <div className="diff-file">
          <div className="diff-file-head mono"><span className="truncate">{path}</span></div>
          <div className="diff-body">
            {lines.map((text, i) => (
              <div key={i} className="diff-row code-row" data-t={highlight === i + 1 ? 'hit' : 'ctx'}>
                <span className="diff-num">{i + 1}</span>
                <code className="diff-code" style={hangingIndent(text)}>{text || ' '}</code>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const DEBUG_FIELDS = [
      { k: 'location', label: 'Where is the bug?', rows: 1, placeholder: 'File and function (and line, if you can).' },
      { k: 'root_cause', label: 'Root cause', rows: 4, placeholder: 'What is actually wrong, and how does it produce the symptom in the report?' },
      { k: 'fix', label: 'Fix', rows: 7, mono: true, placeholder: 'The corrected code, or a precise description of the change.' },
      { k: 'verify', label: 'How you would verify it', rows: 3, placeholder: 'A test you would write, or how you would reproduce it before and after.' },
      { k: 'notes', label: 'Investigation notes', rows: 3, placeholder: 'Optional. Suspects you ruled out and why. The grader credits sound reasoning.' },
    ];

    function DebugPanel({ ex, response, setResponse, editable, revealed }) {
      const a = ex.answer || {};
      const hitFile = revealed ? a.file : null;
      return (
        <div className="stack-4">
          <div className="card" style={{ padding: 18 }}>
            <div className="eyebrow flex items-center gap-1.5" style={{ marginBottom: 10 }}><IconBug size={12} /> Bug report</div>
            <div style={{ fontSize: 14, lineHeight: 1.65, whiteSpace: 'pre-wrap' }}>{ex.bug_report}</div>
            {ex.logs && (
              <>
                <div className="eyebrow" style={{ margin: '16px 0 8px' }}>Logs</div>
                <pre className="code" style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{ex.logs}</pre>
              </>
            )}
          </div>

          {(ex.files || []).map((f) => (
            <CodeFile key={f.path} path={f.path} content={f.content}
              highlight={hitFile === f.path ? anchorLine(f.content, a.snippet) : null} />
          ))}

          <div className="card" style={{ padding: 18 }}>
            <div className="stack-4">
              {DEBUG_FIELDS.map((fd) => editable ? (
                <Field key={fd.k} label={fd.label} value={response[fd.k] || ''} rows={fd.rows} mono={fd.mono} inset
                  placeholder={fd.placeholder} onChange={(v) => setResponse((r) => ({ ...r, [fd.k]: v }))} />
              ) : (
                <div key={fd.k}>
                  <span className="field-label">{fd.label}</span>
                  <div className={`readonly-block ${fd.mono ? 'mono' : ''}`}>{response[fd.k] || <span style={{ color: 'var(--faint)' }}>(blank)</span>}</div>
                </div>
              ))}
            </div>
          </div>

          {revealed && (
            <div className="card answer-key" style={{ padding: 18 }}>
              <div className="eyebrow" style={{ color: 'var(--accent)', marginBottom: 12 }}>Answer key</div>
              <div className="stack-4">
                <div><span className="field-label">Location</span><div className="mono" style={{ fontSize: 12.5 }}>{a.file}: {a.snippet}</div></div>
                <div><span className="field-label">Root cause</span><div className="readonly-block">{a.root_cause}</div></div>
                <div><span className="field-label">Fix</span><div className="readonly-block">{a.fix}</div></div>
                {a.patch && <pre className="code">{a.patch}</pre>}
                {a.red_herrings?.length > 0 && (
                  <div><span className="field-label">Red herrings</span><ul className="grade-ul">{a.red_herrings.map((r, i) => <li key={i}>{r}</li>)}</ul></div>
                )}
                {a.verify && <div><span className="field-label">Verification</span><div className="readonly-block">{a.verify}</div></div>}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ---- System design ------------------------------------------------
    function DesignPanel({ ex, response, setResponse, followups, setFollowups, editable, revealed, grade }) {
      const [showScale, setShowScale] = useState(!editable);
      const filled = SD_PHASES.filter((p) => (response[p.k] || '').trim()).length;
      const keyPoints = grade?.key_points?.length
        ? grade.key_points
        : (ex.key_points || []).map((point) => ({ point }));
      const answering = editable && !!followups;

      return (
        <div className="stack-4">
          <div className="card" style={{ padding: 18 }}>
            <div style={{ fontSize: 15, lineHeight: 1.65, whiteSpace: 'pre-wrap' }}>{ex.prompt}</div>
            {ex.tags?.length > 0 && (
              <div className="flex flex-wrap gap-1.5" style={{ marginTop: 12 }}>
                {ex.tags.map((t) => <span key={t} className="pill">{t}</span>)}
              </div>
            )}
            {ex.scale && (
              showScale ? (
                <div className="inset" style={{ padding: 12, marginTop: 14 }}>
                  <div className="field-label" style={{ marginBottom: 5 }}>Scale & constraints</div>
                  <div style={{ fontSize: 13.5, lineHeight: 1.6 }}>{ex.scale}</div>
                </div>
              ) : (
                <button onClick={() => setShowScale(true)} className="btn btn-ghost btn-sm" style={{ marginTop: 14 }}>
                  <IconEye size={13} /> Ask about scale
                </button>
              )
            )}
          </div>

          {editable && (
            <div className="sd-progress mono">
              {SD_PHASES.map((p) => (
                <a key={p.k} href={`#sd-${p.k}`} className="sd-progress-dot" data-done={!!(response[p.k] || '').trim()} title={p.label}>{p.label}</a>
              ))}
              <span style={{ marginLeft: 'auto', color: 'var(--muted)' }}>{filled}/{SD_PHASES.length}</span>
            </div>
          )}

          <div className="card" style={{ padding: 18 }}>
            <div className="stack-5">
              {SD_PHASES.map((p, i) => (
                <div key={p.k} id={`sd-${p.k}`} style={{ scrollMarginTop: 90 }}>
                  <div className="flex items-baseline gap-2" style={{ marginBottom: 4 }}>
                    <span className="mono" style={{ fontSize: 10, color: 'var(--faint)' }}>{String(i + 1).padStart(2, '0')}</span>
                    <span style={{ fontWeight: 600, fontSize: 14 }}>{p.label}</span>
                  </div>
                  {editable && !answering ? (
                    <>
                      <div className="field-hint" style={{ margin: '0 0 8px' }}>{p.hint}</div>
                      <textarea value={response[p.k] || ''} rows={p.mono ? 8 : 4}
                        onChange={(e) => setResponse((r) => ({ ...r, [p.k]: e.target.value }))}
                        className={`field field-inset ${p.mono ? 'mono' : ''}`} />
                    </>
                  ) : (
                    <div className={`readonly-block ${p.mono ? 'mono' : ''}`}>{response[p.k] || <span style={{ color: 'var(--faint)' }}>(left blank)</span>}</div>
                  )}
                </div>
              ))}
            </div>
          </div>

          {followups && followups.length > 0 && (
            <div className="card followups" style={{ padding: 18 }}>
              <div className="eyebrow flex items-center gap-1.5" style={{ color: 'var(--primary)', marginBottom: 12 }}>
                <IconMessage size={12} /> Interviewer follow-ups
              </div>
              <div className="stack-4">
                {followups.map((f, i) => (
                  <div key={i}>
                    <div style={{ fontFamily: 'var(--font-display)', fontSize: 19, lineHeight: 1.3, marginBottom: 8 }}>{f.q}</div>
                    {answering ? (
                      <textarea value={f.a} rows={3} className="field field-inset"
                        placeholder="Answer as you would out loud: decision first, then the reasoning."
                        onChange={(e) => { const v = e.target.value; setFollowups((arr) => arr.map((x, j) => (j === i ? { ...x, a: v } : x))); }} />
                    ) : (
                      <div className="readonly-block">{f.a || <span style={{ color: 'var(--faint)' }}>(no answer)</span>}</div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {revealed && keyPoints.length > 0 && (
            <div className="card answer-key" style={{ padding: 18 }}>
              <div className="eyebrow" style={{ color: 'var(--accent)', marginBottom: 12 }}>Key points</div>
              <div className="stack-3">
                {keyPoints.map((k, i) => (
                  <div key={i} className="flex items-start gap-2.5">
                    {k.covered
                      ? <span className="pill" data-tone={COVER_TONE[k.covered]} style={{ fontSize: 10, padding: '1px 7px', marginTop: 2 }}>{k.covered === 'yes' ? 'covered' : k.covered === 'partial' ? 'partial' : 'missed'}</span>
                      : <span className="dot" style={{ background: 'var(--faint)', marginTop: 8 }} />}
                    <div style={{ fontSize: 13.5, lineHeight: 1.55 }}>
                      {k.point}
                      {k.note && <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 2 }}>{k.note}</div>}
                    </div>
                  </div>
                ))}
              </div>
              {grade?.model_outline && (
                <details style={{ marginTop: 16 }}>
                  <summary className="btn btn-ghost btn-sm" style={{ display: 'inline-flex' }}>Show a strong outline</summary>
                  <pre className="code" style={{ marginTop: 10, whiteSpace: 'pre-wrap', fontFamily: 'var(--font-sans)', fontSize: 13 }}>{grade.model_outline}</pre>
                </details>
              )}
            </div>
          )}
        </div>
      );
    }

    // ============================================================

    function EmptyState({ icon, title, body, cta, onCta, ctaIcon }) {
      return (
        <div className="card dashed anim-rise" style={{ padding: '40px 28px', textAlign: 'center', boxShadow: 'none' }}>
          {icon && (
            <div className="flex items-center justify-center"
              style={{
                width: 46, height: 46, margin: '0 auto 16px', borderRadius: 999,
                background: 'var(--tabs-bg)', color: 'var(--muted)',
              }}>
              {icon}
            </div>
          )}
          <div className="display" style={{ fontSize: 29, lineHeight: 1.16, marginBottom: 9 }}>{title}</div>
          <p style={{ fontSize: 13, color: 'var(--muted)', lineHeight: 1.65, margin: '0 auto', maxWidth: 320 }}>{body}</p>
          {cta && onCta && (
            <button onClick={onCta} className="btn btn-primary" style={{ marginTop: 20 }}>
              {ctaIcon || <IconPlus size={14} />} {cta}
            </button>
          )}
        </div>
      );
    }

    if (sb) {
      try {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
      } catch (err) {
        showFatal('Failed to render app: ' + err.message);
      }
    }
  </script>
</body>
</html>
