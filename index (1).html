<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Recall" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Recall — Interval Prep</title>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    input, button, textarea { font-family: inherit; }
    #root { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react" data-type="module">
    /** @jsxRuntime classic */
    import React, { useState, useEffect } from 'https://esm.sh/react@18';
    import { createRoot } from 'https://esm.sh/react-dom@18/client';
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    // ============================================================
    // CONFIG — replace with your own Supabase creds.
    // Both are safe to expose publicly (anon key is client-side by design).
    // Security is enforced by Row Level Security in the DB schema.
    // ============================================================
    const SUPABASE_URL = 'https://ipotfybjewmxmmdklniy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZqPnxAT_g8he81dVRvbRfw_SZZeFPI9';
    // ============================================================

    let sb;
    try {
      sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      showFatal('Failed to init Supabase: ' + err.message);
    }

    function showFatal(msg) {
      document.getElementById('root').innerHTML = `
        <div style="padding: 24px; max-width: 500px; margin: 40px auto; font-family: ui-sans-serif, system-ui;">
          <div style="color: #8B2E1E; font-weight: 600; margin-bottom: 8px;">App failed to load</div>
          <div style="color: #7A7570; font-size: 13px; margin-bottom: 16px;">${msg}</div>
          <div style="color: #B8B0A3; font-size: 11px;">Check the browser console for details. Common causes: bad Supabase URL/key, CDN blocked by network, or a script that failed to load.</div>
        </div>
      `;
    }

    // Catch anything that goes uncaught
    window.addEventListener('error', (e) => {
      console.error('Uncaught error:', e.error || e.message);
    });

    const RATING_INTERVALS = { 1: 30, 2: 12, 3: 5, 4: 2 };
    const RATING_LABELS = {
      1: 'Trivial', 2: 'Solid', 3: 'Got it eventually', 4: 'Struggled hard',
    };
    const COMMON_PATTERNS = [
      'Two Pointers', 'Sliding Window', 'Hash Map', 'Binary Search',
      'BFS', 'DFS', 'DP', 'Backtracking', 'Greedy', 'Monotonic Stack',
      'Prefix Sum', 'Heap', 'Union Find', 'Trie', 'Linked List',
      'Tree', 'Graph', 'Bit Manipulation'
    ];

    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const addDays = (dateStr, days) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + days);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    };
    const daysBetween = (a, b) => {
      const [y1, m1, d1] = a.split('-').map(Number);
      const [y2, m2, d2] = b.split('-').map(Number);
      return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 86400000);
    };

    const THEME_KEY = 'recall_theme_v1';
    const loadTheme = () => { try { return localStorage.getItem(THEME_KEY) || 'light'; } catch { return 'light'; } };
    const saveTheme = (t) => { try { localStorage.setItem(THEME_KEY, t); } catch {} };

    const THEMES = {
      light: {
        bg: '#F4F3EE', surface: '#FAF8F3',
        text: '#1A1A1D', muted: '#7A7570', faint: '#B8B0A3',
        border: '#E0DBD0', accent: '#B8801A',
        primary: '#1D3C6E', success: '#4A6B2E', danger: '#8B2E1E',
        tabsBg: '#EAE7DE',
        dotStruggle: '#B8402E', dotSolid: '#7A7A2E',
        onPrimary: '#FAF8F3', onPrimaryMuted: '#D4CFC5',
      },
      dark: {
        bg: '#141412', surface: '#1E1E1B',
        text: '#EDEBE4', muted: '#8B857B', faint: '#4A4640',
        border: '#2E2D29', accent: '#D9A040',
        primary: '#6B92D6', success: '#7A9E4A', danger: '#C25A45',
        tabsBg: '#252420',
        dotStruggle: '#D96450', dotSolid: '#A8A44E',
        onPrimary: '#0F1420', onPrimaryMuted: '#2A3550',
      },
    };

    function App() {
      const [authState, setAuthState] = useState('checking');
      const [user, setUser] = useState(null);
      const [theme, setTheme] = useState(loadTheme);
      const C = THEMES[theme];

      useEffect(() => { document.documentElement.style.background = C.bg; }, [C.bg]);

      useEffect(() => {
        sb.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) { setUser(session.user); setAuthState('signed-in'); }
          else { setAuthState('signed-out'); }
        });
        const { data: { subscription } } = sb.auth.onAuthStateChange((_e, session) => {
          if (session?.user) { setUser(session.user); setAuthState('signed-in'); }
          else { setUser(null); setAuthState('signed-out'); }
        });
        return () => subscription.unsubscribe();
      }, []);

      const toggleTheme = () => {
        const next = theme === 'light' ? 'dark' : 'light';
        setTheme(next); saveTheme(next);
      };

      if (authState === 'checking') {
        return (
          <div className="min-h-screen flex items-center justify-center" style={{ background: C.bg }}>
            <div style={{ color: C.muted, fontSize: 12, letterSpacing: 2 }}>CHECKING SESSION</div>
          </div>
        );
      }
      if (authState === 'signed-out') {
        return <AuthScreen C={C} theme={theme} onToggleTheme={toggleTheme} />;
      }
      return <MainApp user={user} C={C} theme={theme} onToggleTheme={toggleTheme} />;
    }

    function AuthScreen({ C, theme, onToggleTheme }) {
      const [email, setEmail] = useState('');
      const [sending, setSending] = useState(false);
      const [sent, setSent] = useState(false);
      const [error, setError] = useState(null);

      const isValidEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

      const sendLink = async () => {
        if (!isValidEmail(email)) {
          setError('That doesn\'t look like a valid email');
          return;
        }
        setSending(true); setError(null);
        const { error } = await sb.auth.signInWithOtp({
          email: email.trim(),
          options: {
            emailRedirectTo: window.location.origin + window.location.pathname,
            shouldCreateUser: true,
          },
        });
        if (error) {
          setError(error.message);
          setSending(false);
        } else {
          setSent(true);
          setSending(false);
        }
      };

      const useDifferentEmail = () => {
        setSent(false); setEmail(''); setError(null);
      };

      return (
        <div className="min-h-screen flex flex-col" style={{ background: C.bg, color: C.text }}>
          <div className="max-w-lg w-full mx-auto px-5 py-6 flex justify-between items-baseline">
            <div className="flex items-baseline gap-3">
              <div className="font-bold text-xl tracking-tight">Recall</div>
              <div style={{ color: C.faint, fontSize: 10, letterSpacing: 2 }} className="font-medium">
                INTERVAL PREP
              </div>
            </div>
            <button onClick={onToggleTheme} className="rounded-md transition flex items-center justify-center"
              style={{ background: C.tabsBg, color: C.muted, width: 28, height: 28, fontSize: 14, lineHeight: 1 }}
              aria-label="Toggle theme">
              {theme === 'light' ? '☾' : '☀'}
            </button>
          </div>

          <div className="flex-1 flex items-center justify-center px-5">
            <div className="max-w-sm w-full">
              {!sent ? (
                <>
                  <div className="mb-8">
                    <div style={{ color: C.muted, fontSize: 10, letterSpacing: 2, fontWeight: 500 }} className="mb-2">
                      SIGN IN
                    </div>
                    <div className="font-bold tracking-tight mb-3" style={{ fontSize: 32, lineHeight: 1.1 }}>
                      Your queue,<br />across every device.
                    </div>
                    <div style={{ color: C.muted, fontSize: 14, lineHeight: 1.5 }}>
                      Enter your email and we'll send you a sign-in link. No password to remember.
                    </div>
                  </div>

                  <input
                    type="email"
                    value={email}
                    onChange={(e) => { setEmail(e.target.value); setError(null); }}
                    onKeyDown={(e) => { if (e.key === 'Enter') sendLink(); }}
                    placeholder="you@example.com"
                    autoComplete="email"
                    inputMode="email"
                    className="w-full px-4 py-3 rounded-lg outline-none transition mb-3"
                    style={{
                      background: C.surface, border: `1px solid ${C.border}`,
                      color: C.text, fontSize: 15,
                    }}
                    onFocus={(e) => (e.target.style.borderColor = C.primary)}
                    onBlur={(e) => (e.target.style.borderColor = C.border)}
                  />

                  <button onClick={sendLink} disabled={sending || !email}
                    className="w-full py-3.5 rounded-lg font-semibold transition"
                    style={{
                      background: sending || !email ? C.tabsBg : C.primary,
                      color: sending || !email ? C.muted : C.onPrimary,
                      fontSize: 15,
                      cursor: sending ? 'wait' : (!email ? 'not-allowed' : 'pointer'),
                    }}>
                    {sending ? 'Sending…' : 'Send sign-in link'}
                  </button>

                  {error && (
                    <div className="mt-3 rounded-lg p-3" style={{ background: C.surface, border: `1px solid ${C.danger}` }}>
                      <div style={{ fontSize: 12, color: C.danger }}>{error}</div>
                    </div>
                  )}

                  <div className="mt-6" style={{ fontSize: 11, color: C.faint, lineHeight: 1.5 }}>
                    We only store your problem list and email. No tracking, no ads, no analytics.
                  </div>
                </>
              ) : (
                <>
                  <div className="mb-6">
                    <div style={{ color: C.muted, fontSize: 10, letterSpacing: 2, fontWeight: 500 }} className="mb-2">
                      LINK SENT
                    </div>
                    <div className="font-bold tracking-tight mb-3" style={{ fontSize: 28, lineHeight: 1.1 }}>
                      Check your email.
                    </div>
                    <div style={{ color: C.muted, fontSize: 14, lineHeight: 1.5 }}>
                      A sign-in link is on the way to <span className="font-mono" style={{ color: C.text }}>{email}</span>. Open it on this device to finish signing in. The link expires in an hour.
                    </div>
                  </div>

                  <div className="rounded-lg p-4 mb-4" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                    <div style={{ color: C.muted, fontSize: 11, lineHeight: 1.5 }}>
                      Not seeing it? Check spam, or wait a minute — Supabase's free tier can throttle. If it never arrives, use a different email.
                    </div>
                  </div>

                  <button onClick={useDifferentEmail}
                    className="w-full py-2.5 rounded-lg font-medium transition"
                    style={{ background: C.tabsBg, color: C.text, fontSize: 13 }}>
                    Use a different email
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    function MainApp({ user, C, theme, onToggleTheme }) {
      const [problems, setProblems] = useState([]);
      const [view, setView] = useState('today');
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [menuOpen, setMenuOpen] = useState(false);

      useEffect(() => { fetchProblems(); }, []);

      const fetchProblems = async () => {
        setLoading(true); setError(null);
        const { data, error } = await sb.from('problems').select('*').order('next_review', { ascending: true });
        if (error) setError(error.message);
        else setProblems(data || []);
        setLoading(false);
      };

      const addProblem = async (data) => {
        const newProblem = {
          id: `p_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          user_id: user.id,
          name: data.name.trim(),
          pattern: data.pattern.trim(),
          history: [{ date: todayStr(), rating: data.rating }],
          next_review: addDays(todayStr(), RATING_INTERVALS[data.rating]),
          created_at: todayStr(),
        };
        const prev = problems;
        setProblems([...problems, newProblem]);
        setView('today');
        const { error } = await sb.from('problems').insert(newProblem);
        if (error) { setProblems(prev); alert('Failed to save: ' + error.message); }
      };

      const rateProblem = async (id, rating) => {
        const problem = problems.find((p) => p.id === id);
        if (!problem) return;
        const newHistory = [...problem.history, { date: todayStr(), rating }];
        const newNextReview = addDays(todayStr(), RATING_INTERVALS[rating]);
        const prev = problems;
        setProblems(problems.map((p) =>
          p.id === id ? { ...p, history: newHistory, next_review: newNextReview } : p
        ));
        const { error } = await sb.from('problems')
          .update({ history: newHistory, next_review: newNextReview })
          .eq('id', id);
        if (error) { setProblems(prev); alert('Failed to save: ' + error.message); }
      };

      const deleteProblem = async (id) => {
        const prev = problems;
        setProblems(problems.filter((p) => p.id !== id));
        const { error } = await sb.from('problems').delete().eq('id', id);
        if (error) { setProblems(prev); alert('Failed to delete: ' + error.message); }
      };

      const signOut = async () => { await sb.auth.signOut(); };

      const today = todayStr();
      const dueToday = problems
        .filter((p) => p.next_review <= today)
        .sort((a, b) => a.next_review.localeCompare(b.next_review));
      const stats = { total: problems.length, due: dueToday.length };

      return (
        <div className="min-h-screen" style={{ background: C.bg, color: C.text }}>
          <div className="max-w-lg mx-auto px-5 py-6">
            <header className="flex items-baseline justify-between mb-8">
              <div className="flex items-baseline gap-3">
                <div className="font-bold text-xl tracking-tight">Recall</div>
                <div style={{ color: C.faint, fontSize: 10, letterSpacing: 2 }} className="font-medium">
                  INTERVAL PREP
                </div>
              </div>
              <div className="flex items-center gap-2 relative">
                <div className="font-mono" style={{ color: C.muted, fontSize: 11 }}>
                  {stats.total} tracked
                </div>
                <button onClick={onToggleTheme}
                  className="rounded-md transition flex items-center justify-center"
                  style={{ background: C.tabsBg, color: C.muted, width: 28, height: 28, fontSize: 14, lineHeight: 1 }}
                  aria-label="Toggle theme">
                  {theme === 'light' ? '☾' : '☀'}
                </button>
                <button onClick={() => setMenuOpen(!menuOpen)}
                  className="rounded-md transition flex items-center justify-center"
                  style={{ background: C.tabsBg, color: C.muted, width: 28, height: 28, fontSize: 16, lineHeight: 1 }}
                  aria-label="Menu">
                  ⋯
                </button>
                {menuOpen && (
                  <div className="absolute top-full right-0 mt-2 rounded-lg overflow-hidden z-10"
                    style={{ background: C.surface, border: `1px solid ${C.border}`, minWidth: 180 }}>
                    <div className="px-3 py-2 truncate"
                      style={{ borderBottom: `1px solid ${C.border}`, fontSize: 11, color: C.muted }}>
                      {user.email}
                    </div>
                    <button onClick={() => { setMenuOpen(false); signOut(); }}
                      className="w-full text-left px-3 py-2 transition"
                      style={{ color: C.text, fontSize: 13 }}>
                      Sign out
                    </button>
                  </div>
                )}
              </div>
            </header>

            {loading ? (
              <div className="py-16 text-center" style={{ color: C.muted, fontSize: 12, letterSpacing: 2 }}>
                LOADING PROBLEMS
              </div>
            ) : error ? (
              <div className="rounded-lg p-4 mb-4" style={{ background: C.surface, border: `1px solid ${C.danger}` }}>
                <div style={{ color: C.danger, fontSize: 13, marginBottom: 8 }}>
                  Couldn't load your problems: {error}
                </div>
                <button onClick={fetchProblems} className="px-3 py-1.5 rounded"
                  style={{ background: C.primary, color: C.onPrimary, fontSize: 12, fontWeight: 500 }}>
                  Retry
                </button>
              </div>
            ) : (
              <>
                <div className="mb-8">
                  <div className="mb-2" style={{ color: C.muted, fontSize: 10, letterSpacing: 2, fontWeight: 500 }}>
                    TODAY
                  </div>
                  <div className="flex items-baseline gap-3">
                    <div className="font-bold tracking-tight"
                      style={{ fontSize: 56, lineHeight: 1, color: stats.due > 0 ? C.accent : C.text }}>
                      {stats.due}
                    </div>
                    <div style={{ color: C.muted, fontSize: 15 }}>
                      {stats.due === 1 ? 'problem' : 'problems'} to review
                    </div>
                  </div>
                </div>

                <div className="flex gap-1 mb-6 p-1 rounded-lg" style={{ background: C.tabsBg }}>
                  {[
                    { key: 'today', label: 'Today' },
                    { key: 'add', label: 'Add' },
                    { key: 'all', label: 'All' },
                  ].map((tab) => (
                    <button key={tab.key} onClick={() => setView(tab.key)}
                      className="flex-1 py-2 text-sm font-medium rounded-md transition-all"
                      style={{
                        background: view === tab.key ? C.surface : 'transparent',
                        color: view === tab.key ? C.text : C.muted,
                        boxShadow: view === tab.key ? '0 1px 2px rgba(0,0,0,0.06)' : 'none',
                      }}>
                      {tab.label}
                    </button>
                  ))}
                </div>

                {view === 'today' && (
                  <TodayView due={dueToday} onRate={rateProblem} hasProblems={problems.length > 0}
                    onGoAdd={() => setView('add')} C={C} />
                )}
                {view === 'add' && <AddView onAdd={addProblem} C={C} />}
                {view === 'all' && <AllView problems={problems} onDelete={deleteProblem} C={C} />}
              </>
            )}
          </div>
        </div>
      );
    }

    function TodayView({ due, onRate, hasProblems, onGoAdd, C }) {
      if (!hasProblems) return (
        <EmptyState title="Nothing tracked yet"
          body="Add the first problem you've solved recently. Rate it honestly — that rating sets when you'll see it again."
          cta="Add a problem" onCta={onGoAdd} C={C} />
      );
      if (due.length === 0) return (
        <EmptyState title="Clear queue"
          body="No reviews due today. Add new problems as you solve them, or come back tomorrow."
          cta="Add a problem" onCta={onGoAdd} C={C} />
      );
      return (
        <div className="space-y-3">
          {due.map((p) => <ReviewCard key={p.id} problem={p} onRate={onRate} C={C} />)}
        </div>
      );
    }

    function ReviewCard({ problem, onRate, C }) {
      const [rating, setRating] = useState(null);
      const lastReview = problem.history[problem.history.length - 1];
      const daysSince = daysBetween(lastReview.date, todayStr());
      const daysOverdue = daysBetween(problem.next_review, todayStr());
      const handleRate = (r) => { setRating(r); setTimeout(() => onRate(problem.id, r), 220); };

      return (
        <div className="rounded-xl p-5 transition-all"
          style={{
            background: C.surface, border: `1px solid ${C.border}`,
            opacity: rating !== null ? 0.4 : 1,
            transform: rating !== null ? 'scale(0.98)' : 'scale(1)',
          }}>
          <div className="font-mono font-semibold text-base mb-1"
            style={{ color: C.text, wordBreak: 'break-word' }}>
            {problem.name}
          </div>
          <div className="flex items-center flex-wrap gap-x-3 gap-y-1 mb-4" style={{ fontSize: 12 }}>
            <span className="px-2 py-0.5 rounded"
              style={{ background: C.tabsBg, color: C.muted, fontSize: 11, fontWeight: 500 }}>
              {problem.pattern}
            </span>
            <span style={{ color: C.muted }}>
              last: {daysSince === 0 ? 'today' : `${daysSince}d ago`}
            </span>
            {daysOverdue > 0 && (
              <span style={{ color: C.accent, fontWeight: 500 }}>{daysOverdue}d overdue</span>
            )}
          </div>
          <div className="mb-2" style={{ color: C.muted, fontSize: 10, letterSpacing: 1.5, fontWeight: 500 }}>
            HOW DID IT GO?
          </div>
          <div className="grid grid-cols-2 gap-2">
            {[4, 3, 2, 1].map((r) => (
              <RatingButton key={r} rating={r} selected={rating === r} onClick={() => handleRate(r)} C={C} />
            ))}
          </div>
        </div>
      );
    }

    function RatingButton({ rating, selected, onClick, C }) {
      const label = RATING_LABELS[rating];
      const days = RATING_INTERVALS[rating];
      const dotColor = { 4: C.dotStruggle, 3: C.accent, 2: C.dotSolid, 1: C.success }[rating];

      return (
        <button onClick={onClick}
          className="text-left rounded-lg p-3 transition-all active:scale-95"
          style={{
            background: selected ? C.primary : C.bg,
            color: selected ? C.onPrimary : C.text,
            border: `1px solid ${selected ? C.primary : C.border}`,
          }}>
          <div className="flex items-center gap-1.5 mb-1">
            <div className="rounded-full" style={{ width: 6, height: 6, background: dotColor }} />
            <div style={{ fontSize: 13, fontWeight: 600 }}>{label}</div>
          </div>
          <div className="font-mono" style={{ fontSize: 11, color: selected ? C.onPrimaryMuted : C.muted }}>
            → in {days}d
          </div>
        </button>
      );
    }

    function AddView({ onAdd, C }) {
      const [name, setName] = useState('');
      const [pattern, setPattern] = useState('');
      const [rating, setRating] = useState(4);
      const canSubmit = name.trim().length > 0 && pattern.trim().length > 0;

      const submit = () => {
        if (!canSubmit) return;
        onAdd({ name, pattern, rating });
        setName(''); setPattern(''); setRating(4);
      };

      return (
        <div className="space-y-5">
          <div>
            <label className="block mb-2"
              style={{ color: C.muted, fontSize: 10, letterSpacing: 1.5, fontWeight: 500 }}>
              PROBLEM NAME
            </label>
            <input type="text" value={name} onChange={(e) => setName(e.target.value)}
              placeholder="e.g. Two Sum"
              className="w-full px-4 py-3 rounded-lg font-mono outline-none transition"
              style={{ background: C.surface, border: `1px solid ${C.border}`, color: C.text, fontSize: 15 }}
              onFocus={(e) => (e.target.style.borderColor = C.primary)}
              onBlur={(e) => (e.target.style.borderColor = C.border)} />
          </div>

          <div>
            <label className="block mb-2"
              style={{ color: C.muted, fontSize: 10, letterSpacing: 1.5, fontWeight: 500 }}>
              PATTERN
            </label>
            <input type="text" value={pattern} onChange={(e) => setPattern(e.target.value)}
              placeholder="e.g. Hash Map"
              className="w-full px-4 py-3 rounded-lg outline-none transition mb-3"
              style={{ background: C.surface, border: `1px solid ${C.border}`, color: C.text, fontSize: 15 }}
              onFocus={(e) => (e.target.style.borderColor = C.primary)}
              onBlur={(e) => (e.target.style.borderColor = C.border)} />
            <div className="flex flex-wrap gap-1.5">
              {COMMON_PATTERNS.map((p) => (
                <button key={p} onClick={() => setPattern(p)}
                  className="px-2.5 py-1 rounded transition"
                  style={{
                    background: pattern === p ? C.primary : C.tabsBg,
                    color: pattern === p ? C.onPrimary : C.muted,
                    fontSize: 11, fontWeight: 500,
                  }}>
                  {p}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className="block mb-2"
              style={{ color: C.muted, fontSize: 10, letterSpacing: 1.5, fontWeight: 500 }}>
              HOW DID IT GO?
            </label>
            <div className="grid grid-cols-2 gap-2">
              {[4, 3, 2, 1].map((r) => (
                <RatingButton key={r} rating={r} selected={rating === r} onClick={() => setRating(r)} C={C} />
              ))}
            </div>
          </div>

          <button onClick={submit} disabled={!canSubmit}
            className="w-full py-3.5 rounded-lg font-semibold transition"
            style={{
              background: canSubmit ? C.primary : C.tabsBg,
              color: canSubmit ? C.onPrimary : C.muted,
              fontSize: 15, cursor: canSubmit ? 'pointer' : 'not-allowed',
            }}>
            Add to tracker
          </button>
        </div>
      );
    }

    function AllView({ problems, onDelete, C }) {
      const [confirmDelete, setConfirmDelete] = useState(null);

      if (problems.length === 0) return (
        <EmptyState title="Empty library"
          body="Once you add problems, they'll live here. You can review the whole set and remove any you no longer want to track."
          C={C} />
      );

      const sorted = [...problems].sort((a, b) => a.next_review.localeCompare(b.next_review));

      return (
        <div className="space-y-2">
          {sorted.map((p) => {
            const daysUntil = daysBetween(todayStr(), p.next_review);
            const overdue = daysUntil < 0;
            const dueLabel = overdue
              ? `${Math.abs(daysUntil)}d overdue`
              : daysUntil === 0 ? 'due today' : `in ${daysUntil}d`;

            return (
              <div key={p.id} className="rounded-lg p-3 flex items-center justify-between gap-3"
                style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                <div className="flex-1 min-w-0">
                  <div className="font-mono font-semibold truncate" style={{ fontSize: 14, color: C.text }}>
                    {p.name}
                  </div>
                  <div className="flex items-center flex-wrap gap-x-2 gap-y-0.5 mt-0.5"
                    style={{ fontSize: 11, color: C.muted }}>
                    <span>{p.pattern}</span><span>·</span>
                    <span>{p.history.length}× reviewed</span><span>·</span>
                    <span style={{
                      color: overdue || daysUntil === 0 ? C.accent : C.muted,
                      fontWeight: overdue || daysUntil === 0 ? 500 : 400,
                    }}>{dueLabel}</span>
                  </div>
                </div>
                {confirmDelete === p.id ? (
                  <div className="flex gap-1 shrink-0">
                    <button onClick={() => { onDelete(p.id); setConfirmDelete(null); }}
                      className="px-2 py-1 rounded"
                      style={{ background: C.danger, color: C.onPrimary, fontSize: 11, fontWeight: 500 }}>
                      Delete
                    </button>
                    <button onClick={() => setConfirmDelete(null)}
                      className="px-2 py-1 rounded"
                      style={{ background: C.tabsBg, color: C.muted, fontSize: 11, fontWeight: 500 }}>
                      Cancel
                    </button>
                  </div>
                ) : (
                  <button onClick={() => setConfirmDelete(p.id)}
                    className="p-1 rounded transition shrink-0"
                    style={{ color: C.faint, fontSize: 20, lineHeight: 1, width: 28, height: 28 }}
                    aria-label="Delete problem">
                    ×
                  </button>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    function EmptyState({ title, body, cta, onCta, C }) {
      return (
        <div className="rounded-xl p-8 text-center"
          style={{ background: C.surface, border: `1px dashed ${C.border}` }}>
          <div className="font-semibold mb-2" style={{ fontSize: 16, color: C.text }}>{title}</div>
          <div className="mb-5" style={{ fontSize: 13, color: C.muted, lineHeight: 1.5 }}>{body}</div>
          {cta && onCta && (
            <button onClick={onCta} className="px-4 py-2 rounded-lg font-medium transition"
              style={{ background: C.primary, color: C.onPrimary, fontSize: 13 }}>
              {cta}
            </button>
          )}
        </div>
      );
    }

    if (sb) {
      try {
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
      } catch (err) {
        showFatal('Failed to render app: ' + err.message);
      }
    }
  </script>
</body>
</html>
