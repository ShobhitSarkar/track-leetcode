name: Deploy Supabase functions

# Keeps the deployed Edge Functions in lockstep with main. Merging index.html
# only ships the static frontend, so a new function under supabase/functions/
# has to be pushed to Supabase separately — which is exactly the gap that had
# "Fresh from AI" showing "Couldn't reach the AI coach" after PR #13 merged.
#
# Runs on any push to main that touches the functions tree (or this workflow
# itself), and can be kicked off by hand from the Actions tab via
# workflow_dispatch. `supabase functions deploy` with no argument deploys
# every function under supabase/functions/, which is a no-op for unchanged
# ones and means adding a new function needs no workflow edit.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — personal access token from
#                            https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — the project ref, e.g. ipotfybjewmxmmdklniy
#                            (the subdomain of the project's Supabase URL)
#
# The OpenAI key the functions use at runtime is a Supabase secret
# (`supabase secrets set OPENAI_API_KEY=…`), not a GitHub secret — it never
# needs to be sent through this workflow.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

concurrency:
  # One deploy at a time — a rapid second push should replace an in-flight
  # deploy rather than race it and land the older commit last.
  group: deploy-supabase-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set as repo secrets."
            exit 1
          fi
          supabase functions deploy --project-ref "${SUPABASE_PROJECT_REF}"
